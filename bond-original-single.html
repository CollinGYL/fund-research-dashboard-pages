"2012-09-30","iss":"2012-10-24","rtype":"季报","span":91,"n":647,"kw":{"久期":1,"杠杆":3,"信用":4,"利率债":4,"转债":0,"赎回":0},"txt":"2012年3季度经济继续保持弱势，8月工业增加值同比已经降至9%以下。这使得通胀压力持续缓解，尤其是以PPI和购进价格指数为代表的中上游价格，其环比增速已经持续1年为负，这使得8月PPI同比增速已经降至-3.5%。虽然经济保持弱势，但是由于7月之后市场对准备金率调整的预期迟迟没有兑现，央行只是通过逆回购操作投放基础货币，并将7天回购利率定在3.35%左右的较高水平，这使得市场对资金面宽松以及降息的乐观预期迅速消失，这推动收益率曲线从之前的低位逐渐上行，短端收益率上行更为明显。进入8月以后，美国干旱使得国际农产品价格大幅上涨，9月初发改委公示万亿规模的投资项目、欧央行推出OMT计划以及美联储推出QE3，这些都使得市场对于通胀的预期有所上升，推动收益率曲线进一步上行。从收益率水平来看，在美联储推出QE3后，10年期国债一度达到3.55%,10年期非国开金融债达到4.26%，国开债则达到4.4%左右，已经基本达到年初以来的最高水平，其后收益率水平回落10个BP左右；目前3-5年期的国债品种仍然高出年初最高收益率水平10个BP以上。由于利率品种收益率上行以及资金面的紧张使得信用产品的流动性溢价上升，再加上经济持续疲弱导致企业盈利和现金流恶化，3季度信用利差有所扩大，信用债跌幅更为显著。报告期内，基金债券投资相对比较稳健，主要采取“高杠杆、低久期”的投资策略，均衡配置中高等级信用债和同业存款，注重风险控制，以获取持有期收益为主。本运作期内基金的净值保持稳步增长，波动率控制在较低水平。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"中性","rate_future":"中性","note":"利率债收益率逐渐上行创年内新高;信用利差扩大、信用债跌幅更显著。操作维持'高杠杆低久期'防御,未见明确前瞻表态"}},{"s":"2012-10-01","e":"2012-12-31","iss":"2013-01-22","rtype":"季报","span":91,"n":954,"kw":{"久期":2,"杠杆":1,"信用":9,"利率债":2,"转债":0,"赎回":0},"txt":"2012年四季度中国经济并未延续二、三季度的疲弱态势，而是出现了企稳回暖的趋势，工业增加值月度数据频频超出预期，PPI也从低位回升，PMI数据有明显改善；虽然信贷总量低于预期，但是社会融资总量继续表现出了走强的态势。宏观数据的不断改善强化了市场对未来经济继续回暖的预期，对债券市场尤其是利率产品市场造成了较大的冲击。虽然四季度通胀数据有所缓解，但这基本在市场预期之内，因而并未对债券市场走势构成方向性的影响。虽然11月中上旬利率产品收益率在资金面宽松、国内股市大幅下跌、外围避险需求回升等因素共同作用下，出现了一波较为明显的下行行情。但在经济总体企稳回暖的大背景下，利率产品收益率整个四季度还是表现为震荡上行，其中10年期国债和金融债收益率在四季度分别上行约10bp—15bp。信用产品方面，经济的回升使得市场对企业整体盈利能力好转的预期有所增强，11江西赛维CP001的成功兑付也在一定程度上缓解了市场对信用风险的担忧情绪，加上市场对持有期收益的普遍追求，四季度中低评级的信用债表现良好，信用利差不断收窄，并已回归至历史均值或者以下水平。而短融收益率则在四季度银行类机构需求明显减少、市场对年末资金担忧情绪上升等因素影响下出现平坦化上移。四季度城投债较高的收益率也吸引了不少机构的买入兴趣，收益率快速回落。但10月以来，监管部门相继出台了一些针对城投公司融资的限制，包括银监会叫停平台贷款类、基础建设类和资金池类等政信合作项目；银监会发文进一步针对融资平台贷款的风险进行监管；国土资源部、财政部、人民银行、银监会四部委联合下发《关于加强土地储备与融资管理的通知》，对土地储备机构管理、土地储备和开发管理、土地储备融资等进行了规范。相关政策的出台使得城投债的投资热度有所降低，城投债收益率结束了快速下行的行情，出现平稳运行的态势。本基金在10月中下旬市场对未来经济预期有所改变时，及时减持了7年期国债和10年期金融债等长久期的利率品种，避免了资本损失。在短融收益率上行过程中逐渐增持了AA、AA+的短融。总体看，本基金债券投资相对比较稳健，注重风险控制，以获取持有期收益为主，主要采取“高杠杆、低久期”的投资策略，均衡配置了一些资质较好的短融和公司债。本运作期内基金的净值保持稳步增长，波动率控制在较低水平。","sentiment":{"credit_past":"牛市","rate_past":"震荡","credit_future":"乐观","rate_future":"悲观","note":"利率债震荡上行10-15bp;中低评级信用利差收窄回归历史均值。操作减持长久期利率品种、增持AA/AA+短融"}},{"s":"2013-01-01","e":"2013-03-31","iss":"2013-04-20","rtype":"季报","span":89,"n":1062,"kw":{"久期":1,"杠杆":5,"信用":10,"利率债":1,"转债":0,"赎回":0},"txt":"2013年伊始，投资者延续了去年四季度以来对经济复苏的乐观预期。国内市场方面，虽然1、2月份经济增长数据处于真空期，但是通胀和PMI数据基本符合预期。海外市场方面，美国经济复苏势头稳固，欧债危机也暂时进入平静期，全球风险偏好继续走高。尽管如此，年初宽松的资金面和有利的供需关系使债券市场与股票市场一同上涨。在去年年末大量的财政存款释放和1月份外汇占款大幅增加的推动下，市场资金面异常宽松。1月中旬，央行宣布引入公开市场短期流动性调节工具(Short-termLiquidityOperations,SLO)，作为公开市场常规操作的必要补充，在银行体系流动性出现临时波动时相机使用，让投资者对未来资金面形成乐观预期；与此同时，配置型机构对债券的需求较大，但由于季节性因素债券供给量较小，供求关系较为有利。从2013年年初至春节前，债券收益率曲线牛市增陡，其中信用债券各期限收益率下行幅度更加明显，信用利差普遍压缩到历史中位数甚至以下。春节后，央行节前投放的大量逆回购到期，公开市场资金缺口较大。但央行非但没有进行逆回购续作，反而重启了时隔8个月的正回购操作，两周从公开市场净回笼资金9000多亿，使得2月下旬资金异常紧张。投资者对前期过于乐观的资金面预期开始有所谨慎，加之3月份信用债的发行量将面临季节性的大幅增加，而信用债利差本身也已降至较低水平，信用债收益率在2月底出现了止跌回升的态势。进入3月，官方公布的1-2月增长数据和PMI等指标多低于预期，微观层面经济动能趋弱，促使投资者开始调整之前对经济的乐观心态，风险资产震荡下行。另外，监管层密集出台了一系列规范地方融资平台和银行理财的文件及房地产调控政策，使市场风险偏好进一步向下修正。在此期间，资金面趋于稳定，信用利差回调也达到5-10bp左右，债券市场交投热情逐渐开始回暖。3月末，债券收益率再度出现快速回落，信用利差重新回归至历史较低水平。综合来看，一季度信用债表现较为抢眼，收益率大致经历了“年初的快速下行-2月下旬开始的上行调整-3月下旬以来的再次快速下行”三个阶段，总体来看还是获得了较好的投资回报。本基金在一季度以信用债持仓为主，年初杠杆水平较高，在短融收益率快速下行过程中，减持了部分收益率较低的短融，并加配了一些资质较好的城投债，杠杆水平较年初有所回落。利率债方面，主要以波段操作为主。总体看，本基金仍延续了较为稳健的投资风格，久期较短，注重风险控制，注重净值增长的稳定性，以获取持有期收益为主。本运作期内基金的净值保持稳步增长，波动率控制在较低水平。","sentiment":{"credit_past":"牛市","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"信用债表现抢眼、信用利差降至历史低位;利率债以波段操作为主未见明显单边。年初高杠杆后转为回落,无强方向表态"}},{"s":"2013-04-01","e":"2013-06-30","iss":"2013-07-17","rtype":"季报","span":90,"n":693,"kw":{"久期":1,"杠杆":1,"信用":1,"利率债":0,"转债":1,"赎回":0},"txt":"2013年二季度，国内经济增长动力趋缓，宏观指标喜忧参半，总体疲软，货币当局坚持稳健甚至略有收紧的货币政策，对地方融资平台、影子银行的整顿以及房地产的调控一定程度上抑制经济回升，压缩人民币升值、出口虚增也打击经济爬升势头。领先指数PMI经历掉头向下，工业增加值增速继续回落，投资增长趋缓，出口回落。物价疲软，CPI基本稳定，PPI继续走低，环比下滑，通缩风险加大。货币信贷状况基本稳定，社会融资总量维持较高水平。新的政府领导集体积极有序推进改革，强调经济增长的质量，政策基调稳中求进，保持经济平稳增长，继续调控房地产，整顿影子银行、规范债券市场，加强监管地方融资平台，抑制产能过剩行业不合理扩张。相比一季度而言，宏观调控政策略有收紧，并加强金融风险防范。本季度内资金面波动加大，总体偏紧。4月份至5月上旬资金面较为宽松，外汇占款流入较为明显，资金利率总体处于较低水平。5月初中国人民银行重启央票发行，并对商业银行外汇头寸加强监管，抑制资本流入和本币升值，资金逐步趋紧。6月份，受贷款增长较快、企业所得税集中清缴、外汇市场变化、补缴法定准备金等多种因素叠加影响，货币市场利率大幅上升，且高居不下，市场有所恐慌，债券市场快速下跌，收益率曲线平坦化至倒挂，股票市场冲高快速回落，创下新低，总体上，本季度内，固定收益资产表现好于股票、可转债等风险资产。二季度，我们基于对经济复苏偏弱、货币信贷政策略有收紧，以及资金面由松趋紧，组合继续坚持稳健的低波动率策略，维持较短久期，较低杠杆水平，持有信用债以获取持有期收益。本季度，债券市场波动较大，纯债基金净值秉持稳健的操作策略，获得超出基准的正收益。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"中性","rate_future":"中性","note":"'钱荒'致收益率曲线平坦化至倒挂、债市快速下跌;操作维持短久期低杠杆防御,无明确前瞻表态"}},{"s":"2013-07-01","e":"2013-09-30","iss":"2013-10-25","rtype":"季报","span":91,"n":697,"kw":{"久期":1,"杠杆":3,"信用":1,"利率债":1,"转债":2,"赎回":0},"txt":"2013年三季度，国内经济增长动力逐步回升，宏观指标表现强劲，相对二季度有明显改善，总体略超市场预期。宏观调控当局维持中性的总量政策，结构上适度微调，盘活存量货币和财政资金，推出棚户区改造，增加铁路投资等结构性刺激政策。领先指数PMI持续上升，固定资产投资增速平稳，基建投资增长较快，地产投资维持高位，制造业投资较为稳定，发电量、工业增加值增速等指标超出预期，进出口增速企稳，物价稳定，有所上涨，货币信贷增速符合市场预期，社会融资总量增加略超预期。面对二季度以来的国内外复杂形势和经济下行压力，中国政府稳中求进，创新宏观经济政策，不扩大赤字，不放松也不收紧货币，同时，采取创新性政策措施，推进改革，激发市场活力，调整经济结构。总体看，这些宏观调控政策与稳增长的目标是相一致的，对经济形成一定刺激，有效地保持经济平稳运行。本季度内资金面总体稳定。6月份“钱荒”以后，中国人民银行略有调整政策，并加强与市场沟通。7月份启动逆回购，并快速大幅下调逆回购利率，有节奏、择机的向市场注入短期资金，维持市场资金面稳定，8、9月份末资金仅略有季节性紧张，好于市场预期。本季度内，债券市场继续下跌，10年期国债收益率上升至4.10%的水平，达到近两年以来高点，可转债市场波动，上升再回落，股票市场上涨，总体上，本季度股票、可转债等风险资产好于固定收益资产。三季度，我们基于对经济复苏有望回升、货币信贷政策有望微调，以及资金面由紧趋平稳的判断，组合继续坚持稳健的低波动率策略，维持较短久期，较低杠杆水平，持有信用债以获取持有期收益。本季度，债券市场有所下跌，纯债基金净值秉持稳健的操作策略，获得超出基准的正收益。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"中性","rate_future":"中性","note":"10年国债收益率升至4.10%近两年高点、债市继续下跌;维持短久期低杠杆防御"}},{"s":"2013-10-01","e":"2013-12-31","iss":"2014-01-21","rtype":"季报","span":91,"n":778,"kw":{"久期":1,"杠杆":3,"信用":1,"利率债":1,"转债":2,"赎回":0},"txt":"2013年四季度，国内经济增长动力逐步跨过阶段性高点，并且有所下滑，宏观指标表现稳中稍有回落，回落幅度略低于市场预期。宏观调控稳中求进，维持稳健的货币政策和积极的财政政策，加大力度推进改革，具体政策操作表现显示货币信贷政策实际中性偏紧。领先指数PMI企稳稍有回落，幅度不大。固定资产投资增速平稳，基建和房地产投资增长稍有回落，制造业投资有所回升。发电量、工业增加值增速等指标基本符合预期，出口增速有所回升，物价稳定，货币信贷增速仍旧较快，社会融资总量增量较大。经济历经三季度的超预期快速回升后，宏观调控信心更足，操作更具针对性和灵活性，即便是在月末年末等时点利率极高、市场出现一定恐慌情况下，央行能及时通过SLF和SLO从容应对，显示出较为稳定而又不失灵活的调控能力，且加强了不放松不收紧货币的市场预期。三中全会的胜利召开，兑现所有的预期，未来主要看具体落实和推进，以及改革过程中对新问题、新情况的灵活有效处理。本季度内资金面总体稳定，月末和年末冲高效应明显。中国人民银行采取灵活操作模式，相机抉择，灵活启用或停止公开市场逆回购和正回购，适时运用SLF和SLO定向投放资金，缓释银行间市场短期资金压力。季度内银行间7天回购利率平均4.74%，波动率1%左右，资金利率水平总体偏高，但货币当局对波动的控制能力较以前增强。本季度内，债券市场继续下跌，10年期国债收益率上升至4.72%，达到近十年以来高点，股票和可转债市场波动中回落，股票可转债等风险资产与固定收益资产均表现不佳。四季度，我们基于对经济复苏有望回落、货币信贷政策维持稳健，以及资金面紧平衡的判断，组合继续坚持稳健的低波动率策略，维持较短久期，增加组合流动性，投资协议存款等货币市场工具，持有信用债以获取持有期收益。本季度，债券市场有所下跌，纯债基金净值秉持稳健的操作策略，获得超出基准的正收益。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"中性","rate_future":"悲观","note":"10年国债收益率升至4.72%近十年高点;操作增加货币工具、避险防御倾向明显"}},{"s":"2014-01-01","e":"2014-03-31","iss":"2014-04-19","rtype":"季报","span":89,"n":801,"kw":{"久期":1,"杠杆":2,"信用":0,"利率债":0,"转债":1,"赎回":0},"txt":"2014年一季度，国内经济增速继续下滑，主要宏观指标继续回落，幅度大于市场预期。宏观调控稳中求进、改革创新，维持稳健货币政策和积极财政政策，强调大力推进改革，具体政策操作表现显示货币信贷政策中性略有偏宽松。本季度后期，宏观调控政策逐步更强调把经济运行保持在合理区间，并提早于市场预期推出促改革、调结构、惠民生的定向刺激政策，推动经济稳定发展。领先指数PMI企稳回落至半年多低点，回落幅度大于市场预期。固定资产投资增速继续回落，基建、房地产投资和制造业投资增长均有趋缓。发电量、工业增加值增速等指标低于预期，出口增速稳中有升，波动仍旧较大，物价稳定，房价出现下降预期。货币信贷增速稳定，社会融资总量增量略有回落。宏观调控当局经历了去年经济下行及局部微刺激等有效调控后，积累了战胜经济下行挑战的成功经验，且为今年继续进行局部定向刺激做好了政策储备，对经济短期波动与中长期转型升级的跟踪研究、调控和平衡力更强，有利于今年经济调控政策的相机抉择和有效展开。本季度内资金面总体略显宽松，月末和季末冲高效应不明显，资金利率相对去年明显下降。春节前，中国人民银行采取灵活操作模式，向市场投放资金，缓释银行间市场短期资金压力，并于节后陆续回笼，去年年末以来人民币币值保持相对强势，外汇占款流入较多。季度内银行间7天回购利率平均低于4%，1天回购利率平均低于3%，资金利率水平总体偏低，2月份以来，人民币快速大幅贬值，单日波动区间从1%扩大至2%，汇改进一步推进，流入货币市场的外汇占款有所趋缓。本季度内，债券市场上涨，中债总财富指数上涨约2.0%，股票和可转债市场振荡，固定收益资产相对表现较好。一季度，我们基于对经济增速有望延续去年四季度以来的回落，货币信贷政策维持稳健，以及资金面弱平衡的判断，组合继续坚持稳健的低波动率策略，维持较短久期，增加组合流动性，减持协议存款等短期货币市场工具，保持一定水平持有期收益率。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"中性","rate_future":"中性","note":"中债总财富指数上涨约2.0%,债市转牛;操作仍以'保持一定水平持有期收益率'防御表述为主"}},{"s":"2014-04-01","e":"2014-06-30","iss":"2014-07-21","rtype":"季报","span":90,"n":825,"kw":{"久期":1,"杠杆":2,"信用":1,"利率债":0,"转债":2,"赎回":0},"txt":"2014年二季度，国内经济增速继续下滑，主要宏观指标继续回落，幅度有所收窄，符合市场预期。宏观调控稳中求进、改革创新，坚持稳健货币政策和积极财政政策的前提下，积极推出定向宽松政策，改善货币信贷条件，加大棚户区改造、基建投资力度。一季度末早于市场预期推出促改革、调结构、惠民生的定向刺激政策。本季度逐步落实前期刺激政策，并相机加大定向宽松力度，推动经济稳定发展。领先指数PMI企稳从半年多低点连续回升，幅度大于市场预期。固定资产投资增速继续回落，基建投资增速加快、房地产投资和制造业投资增长继续趋缓。发电量、工业增加值增速等指标有所回升，幅度较小，出口增速继续回升，趋势逐步稳定，物价稳定，房价环比开始下降，呈现出拐点态势，后市还需进一步观察。货币信贷增速改善，社会融资总量增量回升。宏观调控当局经历了去年经济下行及局部微刺激等有效调控后，积累了应对经济下滑挑战的经验，政策储备充足，调控从容不迫，定力较强，对经济短期波动与中长期转型升级的跟踪研究、调控和平衡能力更强，市场对经济软着陆的信心明显增强。本季度内资金面总体略显宽松，年中银行间资金利率几乎没有出现季节性大幅冲高，宽松程度好于预期。人民币汇率双向波动加大，外汇占款流入出现波动，总体略有趋缓，对银行间资金利率影响不大，公开市场逐步投放流动性，一定程度上对冲了资本流入放缓。季度内，银行间7天回购利率平均低于4%，1天回购利率平均低于3%，资金利率水平总体适度、稳定，基本与上季度持平。本季度内，债券市场上涨，中债总财富指数上涨约3.51%，中证可转债指数上涨5.36%，股票市场振荡，可转债和普通债券资产相对表现较好。二季度，我们基于对经济增速有望延续去年一季度以来的回落，货币信贷政策有望加大定向宽松，以及资金面维持中性偏宽松的判断，对债券投资保持谨慎乐观，组合继续坚持稳健的低波动率策略，维持适度偏短久期，增持信用资质较好的高收益债，保持一定水平持有期收益率，获取较为稳定的持有期收益。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"中债总财富指数上涨3.51%;原文明确'对债券投资保持谨慎乐观',增持高收益债"}},{"s":"2014-07-01","e":"2014-09-30","iss":"2014-10-25","rtype":"季报","span":91,"n":771,"kw":{"久期":1,"杠杆":2,"信用":2,"利率债":0,"转债":2,"赎回":0},"txt":"2014年三季度，国内经济增速稍有企稳后又继续下滑，主要宏观指标先上后下，波动加大。宏观调控稳中求进、改革创新，继续坚持稳健货币政策和积极财政政策，延续定向宽松政策，改善货币信贷条件，保持合理流动性。二季度以来，宏观调控当局加大力度推进促改革、调结构、惠民生的定向刺激政策，稳定经济发展。三季度初期，经济领先指数PMI超预期回升，达到今年以来高位，住房市场有所改善，出口增速明显回升，工业增加值改善超出预期，但货币信贷状况恶化。三季度中期以后，经济下行压力加大，固定资产投资增速、出口增速和消费增速都有不同程度的回落，发电量、工业增加值增速等指标大幅低于预期；通胀水平低于预期，中上游价格水平触及五月份以来高点后掉头向下，房价环比继续下降，呈现出拐点态势，后市还需进一步观察；货币信贷增速相对七月份略有回升，幅度不显著。宏观调控当局经历了近两年经济下行波动及区间调控、定向刺激等有效调控后，积累了大量经验，政策储备充足，调控从容不迫，定力较强，经济调控和平衡能力更强。本季度内资金面总体较为宽松，好于预期。人民币汇率水平相对前期较为稳定，贸易顺差较大，而金融机构外汇占款偏少，资金流入趋缓，货币当局通过公开市场及其他创新工具逐步释放流动性，很大程度上对冲了资本流入放缓。季度内，银行间7天回购利率平均低于4%，1天回购利率平均低于3%，资金利率水平总体适度。本季度内，债券市场上涨，中债总财富指数上涨1.62%，中证可转债指数上涨5.3%，股票市场上涨，可转债和信用债券资产相对表现较好。三季度，我们基于对经济增速有望逐步止跌企稳，货币信贷政策有望加大定向宽松，以及资金面维持中性偏宽松的判断，对债券投资保持谨慎乐观，组合继续坚持稳健的低波动率策略，维持适度偏短久期，增持资质较好的信用债，保持一定水平持有期收益率，获取较为稳定的持有期收益。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"中债总财富指数上涨1.62%;原文'对债券投资保持谨慎乐观',增持资质较好信用债"}},{"s":"2014-10-01","e":"2014-12-31","iss":"2015-01-20","rtype":"季报","span":91,"n":732,"kw":{"久期":1,"杠杆":2,"信用":1,"利率债":0,"转债":2,"赎回":0},"txt":"2014年四季度，国内经济增速继续下滑，主要宏观指标总体继续趋缓。宏观调控稳中求进、改革创新，继续坚持稳健货币政策和积极财政政策，改变以往定向宽松政策，进行降息，货币信贷条件进一步改善，利率下降，流动性总体宽裕。三季度以来，宏观调控当局在促改革、调结构、惠民生的基调上，进一步加大货币信贷宽松力度，刺激经济增长。经济领先指数PMI等持续下滑。进一步放开房地产市场限购，下调按揭贷款利率，住房市场持续改善，超出预期。出口和工业增加值增速稳中略有趋缓，符合市场预期。通胀水平持续低于预期，中上游价格水平继续下行，房价仍有下行压力，后市判断还需进一步观察。货币信贷增速相对三季度明显改善，刺激实体经济的效果不明显。宏观调控当局经历了两年经济下行波动及区间调控、定向刺激等有效调控后，积累了大量经验，政策储备充足，平衡能力更强，即使进行了减息，同时也积极推进利率市场化等金融改革，厘清金融市场秩序。本季度内资金面总体稳定，季末有所收紧。人民币汇率波动相对前期略有加大，贸易顺差保持较高水平，然而金融机构外汇占款继续呈现偏少，资金流入不明显，货币当局继续通过公开市场及其他创新工具释放基础货币。季度内，银行间7天回购利率平均低于4%，1天回购利率平均低于3%，资金利率水平总体适度。本季度内，债券市场上涨，中债总财富指数上涨3.22%，中证可转债指数大幅上涨43.15%，股票市场大幅上涨，可转债和股票资产相对表现较好。四季度，我们基于对经济增速有望逐步止跌企稳，货币信贷政策有望加大定向宽松，以及资金面维持中性偏宽松的判断，对债券投资保持谨慎乐观，组合继续坚持稳健的低波动率策略，维持适度偏短久期，增持资质较好的信用债，保持一定水平持有期收益率，获取较为稳定的持有期收益。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"中债总财富指数上涨3.22%;原文'对债券投资保持谨慎乐观',维持适度偏长久期"}},{"s":"2015-01-01","e":"2015-03-31","iss":"2015-04-22","rtype":"季报","span":89,"n":768,"kw":{"久期":0,"杠杆":2,"信用":6,"利率债":3,"转债":0,"赎回":1},"txt":"一季度债券市场总体经历了先上涨后下跌的过程。年初随着市场对基本面和通缩风险的担忧不断加剧，央行先后通过再贷款、MLF续作、降准、降息等货币政策手段托底经济，加上两融监管加强，股市弱势调整，市场风险偏好有所下降，债券市场经历了慢牛行情，债券收益率向下突破去年11月低点。进入3月份以后，债券市场经历了一波较为快速的调整行情，导致调整的原因主要有以下几点：首先，基本面方面，金融数据从去年11月开始，连续4个月好转，尤其是3月份公布的2月信贷数据大幅超预期；财政支出2月开始加快，基建加码，经济有企稳迹象，下行风险有所缓解，部分投资者开始修正对1、2月份过度悲观的经济预期。其次，资金面方面，虽然央行年初以来已经连续降准、降息，但由于人民币贬值压力外汇持续流出、加上降息和利率市场化的共振，银行存款加速流失，银行间回购利率持续维持高位。再次，地方政府巨量债务置换，采用市场化方式发行，供给冲击对利率债和高等级信用债的负面影响较大，配置户投资热情明显降低，一级招标收益持续高于二级，带动收益率节节推高。最后，3月份股市的强势上涨，导致股债大类资产之间的切换较为明显，债券缺乏增量资金推动。经过3月较快的调整，债券市场目前有所企稳，不过市场情绪仍较谨慎，等待基本面和政策面进一步的方向指引。本基金年初大幅加仓了信用债，随着市场不断走好，2月份开始申购不断增加，本着谨慎操作的思路，基金未随着申购的增加同比例增加信用债仓位，信用债仓位被动摊薄。3月份以来市场不确定性加大，基金进一步主动降低了信用债仓位，杠杆也降至较低水平，但基金赎回规模大幅超出了预期，同时市场流动性变差，基金信用债仓位被动提升，组合净值出现较大幅度的调整。利率债方面，本基金1、2月份少量参与了利率债波段操作，并在3月份市场下跌之前进行了减持，对组合净值也构成了一定的正贡献。","sentiment":{"credit_past":"震荡","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"先牛后熊(3月快速调整);基金遭遇大额赎回被动降仓,以应对赎回为主未见明确前瞻方向"}},{"s":"2015-04-01","e":"2015-06-30","iss":"2015-07-20","rtype":"季报","span":90,"n":715,"kw":{"久期":0,"杠杆":0,"信用":3,"利率债":4,"转债":0,"赎回":0},"txt":"二季度债券市场收益率总体经历了先快速下行后缓慢反弹的过程。4月中上旬，债券市场总体延续了3月份以来的弱势震荡格局。中下旬以来伴随加速恶化的经济数据，央行超预期调降准备金率1个百分点，市场情绪迅速逆转，做多热情高涨，收益率快速下行，其中1年期金融债全月下行50-60bp，10年期金融债全月下行30-40bp,收益率初步呈现陡峭化特征。进入5月份，央行再次降息，但市场预期充分，加之地方债供给压力挥之不去，财政政策有加码迹象，同时房地产销售数据良好，国债期货合约跌幅明显，现券除短端跟随资金价格走低而降幅明显外，中长期利率债收益上行。全月来看，1年金融债下行约70bp,10年金融债上行30bp,收益率曲线继续陡峭化。6月初市场在窄幅区间内波动，方向性不强，投资者观望情绪浓厚。6月初PSL消息使得疲弱的市场稍有提振，债券收益率小幅下行。但随后财政部公布增加1万亿地方债额度，市场虽在一定程度上已有所预期，但做多热情明显受到抑制，中长端收益率逐步回调至月初水平。同时，新股发行规模巨大，叠加季末因素，短期资金面趋紧，短端利率承压。临近6月底，市场交投相对清淡，10年期金融债在4.10%附近窄幅震荡，方向不明显。整体看6月份债券市场延续了5月下旬以来的弱势震荡格局。本基金二季度初保持了较高的信用债仓位，随着债券市场止跌回暖，基金申购大幅增加，信用债仓位被动有所降低，考虑到3月份经济数据异常下滑，3月以来对地方债的供给担忧市场已经有充分的预期，本基金在资金申购后大幅加仓了长端利率债，较好的获得了4月中旬降准后收益率大幅下行带来的资本利得收益。随后本基金根据市场情况变化，逐步降低了长端利率债仓位，提高了中等资质信用债的配置仓位。","sentiment":{"credit_past":"震荡","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"收益率先快速下行后缓慢反弹;操作为战术性加减仓,非强方向表态"}},{"s":"2015-07-01","e":"2015-09-30","iss":"2015-10-24","rtype":"季报","span":91,"n":632,"kw":{"久期":0,"杠杆":1,"信用":8,"利率债":8,"转债":0,"赎回":0},"txt":"三季度的债券市场除在8月份汇改期间因担心资金面波动而有所回调外,收益率基本保持单边下行的态势.三季度债券市场面临的基本面和政策面相比二季度而言并未发生太大变化,股市去杠杆引发的风险偏好回落及打新,配资等无风险资产消失带来的大类资产重新配置成为主导三季度债券市场收益率大幅下行的主线.随着经济转型的不断深化,债券市场对基本面疲弱和货币政策适度宽松的预期较为充分,基本面,政策面和资金面的周期性波动明显减弱.债券市场的运行逻辑也较以往发生了显著变化,以往由基本面和政策面边际变化驱动的利率债,高等级信用债,低等级信用债的轮动逻辑逐渐淡化.利率市场化进程中,银行,保险等配置机构成本刚性,对高票息的过分追逐使得三季度债市行情由信用债向利率债轮动的特征较为明显.股灾后打新暂停,配资清理,这部分资金大量涌向货币市场和债券市场.由于银行理财成本下行较慢,利率债无法覆盖理财成本,资质优良的信用债成为最先受益的品种.增量资金推动下中高等级信用债收益率大幅下行,利率债下行较慢,随着相对价值的凸显,利率债收益率开始跟随下行.整体看,在增量资金推动下三季度债券市场各类品种均有较好的表现.本基金三季度规模大幅增加,考虑到中高等级中票与利率债利差较低,公司债风险收益比较差,未进行这两类品种的加仓.在大规模申购后组合主要选择加仓了利率债,短融和城投债.由于城投债交易成本较高,加仓力度不及申购增加,城投债仓位被动下降较多,利率债和短融加仓力度较大,这两类品种仓位相比二季度上升较多.","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"收益率单边下行、各类品种表现较好;规模大幅增加后主动加仓利率债/短融/城投债"}},{"s":"2015-10-01","e":"2015-12-31","iss":"2016-01-22","rtype":"季报","span":91,"n":526,"kw":{"久期":0,"杠杆":0,"信用":5,"利率债":4,"转债":0,"赎回":0},"txt":"四季度债券市场收益率继续下行.10月底在美联储加息预期升温,经济数据企稳预期以及IPO重启多重冲击下,收益率出现一波明显回调.随后持续下行,并突破前低.四季度债券市场基本面并没有太大的变化,经济数据继续疲软.但是政策面上去产能的提出强化了市场对于明年经济的悲观预期.由于部分机构对2016年债券资产继续走好的预期较强,部分资金提前布局,推动收益率在年底出现一波非常明显的下行.同时短期资金面在央行呵护下保持平稳,市场对此充分预期,这也催化了长期收益率的下行和期限利差的缩窄.增量资金仍是不断驱动债市上行的主要力量.二季度股票大幅波动以后,大量资金持续流向货币和债券市场.但是利率市场化下银行,保险等配置机构资金成本相对刚性,下调缓慢.由于利率债无法覆盖成本,资质优良的信用债成为资金追逐的品种,同时由于信用风险持续发酵,市场出现避险情绪,这导致中高等级信用债收益率持续下行,利差被压缩至历史低位;低等级过剩行业信用债利差则迅速拉大.本基金四季度规模继续增加,考虑到中高等级中票与利率债利差较低,公司债风险收益比较差,未进行这两类品种的加仓.在大规模申购后组合主要选择加仓了利率债和短融.四季度基金主要业绩来源于利率债,城投债对组合净值也有一定的正贡献.","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"收益率继续下行突破前低、信用利差压缩至历史低位;继续加仓利率债和短融"}},{"s":"2016-01-01","e":"2016-03-31","iss":"2016-04-21","rtype":"季报","span":90,"n":571,"kw":{"久期":3,"杠杆":2,"信用":6,"利率债":2,"转债":0,"赎回":0},"txt":"2016年一季度市场分歧逐步加大.一月份,供给侧改革造成经济短期阵痛的一致预期,叠加全球股票市场波动带来的风险偏好下移,共同推动长端利率债收益率出现显著下行.二月份以后,经济中的积极信号逐步增多,市场开始出现分歧.首先是一线城市地产价格的快速上升开始向二线城市扩散.在货币宽松和政策支持下,一线城市地产销售的好转反应为价格的快速上升,并开始向部分二线城市传导.一二月份地产的新开工和投资数据均出现较为明显的回升,引发市场对于地产投资回升力度和持续性的关注.其次是大宗商品价格快速上升.一季度主要大宗商品价格包括原油,铁矿石,螺纹钢价格出现明显的上涨,考虑到大宗商品同时连接终端需求和通胀预期,市场对于未来增长和通胀的判断开始出现分歧.最后是农产品价格的居高不下导致通胀预期回升.一季度由于天气原因蔬菜价格出现了大幅上涨,而同时猪肉价格也屡创新高,这也触发了对于未来通胀回升的担忧.逐步增大的市场分歧导致长端无风险利率继续下行受阻,甚至出现了一定程度的回调.而在配置压力推动下,信用债收益率持续下行,信用利差被压缩至历史低位.出于对违约风险的担心,市场仍然偏好高等级信用债和城投债.本基金一季度主要进行了降杠杆和降久期的操作,主要对长久期利率债进行了减持,一季度基金杠杆和久期水平均大幅下降,信用债仓位基本稳定.一季度基金业绩主要由信用债贡献。","sentiment":{"credit_past":"牛市","rate_past":"震荡","credit_future":"中性","rate_future":"悲观","note":"信用债收益率持续下行至历史低位;利率债先牛后受阻回调,组合主动减持长久期利率债、降杠杆降久期"}},{"s":"2016-04-01","e":"2016-06-30","iss":"2016-07-19","rtype":"季报","span":90,"n":578,"kw":{"久期":0,"杠杆":0,"信用":10,"利率债":2,"转债":0,"赎回":4},"txt":"2016年二季度经济继续延续一季度边际改善的态势,基建和地产投资仍然是主要动力.尤其是地产投资中新开工的好转扭转了市场对于地产的悲观预期.三月底开始信用风险事件频发,市场风险偏好迅速下降,信用债收益率快速走高.机构迫于赎回压力,流动性较好的利率债和城投类品种受到冲击,同时叠加营改增以及MPA考核导致的季末流动性紧张影响,利率出现了一波明显的上调.随后在央行公开市场续作加量以及MLF投放等因素影响下,市场情绪有所回暖,推动信用债和利率债收益率转而下行.但是由于基本面仍处于边际改善态势以及对于六月底资金面的担心,利率以震荡整理为主.进入六月后,非农数据孱弱导致美联储加息预期骤降,随后公布的中国5月经济数据不及预期,尤其是地产的销售投资出现回落,市场对于经济前景转向悲观.接着是英国退欧推动全球避险情绪升温,市场对全球央行再宽松的预期加强,推动市场收益率出现了显著下行.信用债自四月份冲击以后,结构分化明显.高等级,城投债收益率出现回落,但是过剩产能行业以及出现信用事件的发行主体收益率仍然维持高位,利差甚至有所扩大.本基金二季度遭遇大规模赎回,基金规模大幅缩水.虽然在大幅赎回之前,基金已提前减仓,预留现金,但赎回规模较大,还是在一定程度上对基金净值造成拖累.二季度组合对持仓信用债进行排查,进一步规避组合整体信用风险.二季度组合净值主要由信用债贡献.","sentiment":{"credit_past":"震荡","rate_past":"震荡","credit_future":"悲观","rate_future":"中性","note":"3月底信用风险事件频发致信用债收益率快速走高、后结构分化;组合主动排查规避信用风险"}},{"s":"2016-07-01","e":"2016-09-30","iss":"2016-10-26","rtype":"季报","span":91,"n":488,"kw":{"久期":1,"杠杆":4,"信用":5,"利率债":2,"转债":0,"赎回":0},"txt":"2016年三季度以来长期利率处于震荡下行态势,尤其是超长期限利率出现明显下行.从经济基本面来看,2016年上半年支撑经济运行的基建和地产在三季度都出现了一定的衰竭迹象.地产投资尤其是新开工一直较为疲软,基建投资也在7月份出现断崖式下跌.另外一方面6月英国退欧公投后全球货币政策的宽松预期也推动了市场收益率的快速下行,关键期限利率逼近甚至突破前低.但是8月以来,房地产销售再度好转,并从一,二线城市向更广泛的区域传导.同时资金面出现明显的波动.一方面全球主要央行的货币政策宽松都大幅低于预期,新兴市场资金回流,人民币的贬值压力抑制了国内流动性的投放;另一方面央行为了控制杠杆滚动风险,试图通过延长投放逆回购的期限来抑制短期杠杆滚动的规模.这导致了资金利率出现一定的抬升,同时波动明显加大.多重利空叠加下,利率债收益率在8月中旬触底后快速回升,随后处于震荡过程当中.期间信用债收益率较为稳定,随着盈利回升和市场情绪改善,过剩产能信用债的信用利差持续压缩.本基金三季度信用债仓位变化不大,利率债仓位有所降低.整体看组合三季度杠杆和久期水平均有所降低.三季度组合净值主要由信用债贡献.","sentiment":{"credit_past":"牛市","rate_past":"震荡","credit_future":"中性","rate_future":"悲观","note":"信用利差持续压缩;利率债震荡下行后8月触底回升,组合主动降低利率债仓位、降杠杆降久期"}},{"s":"2016-10-01","e":"2016-12-31","iss":"2017-01-20","rtype":"季报","span":91,"n":596,"kw":{"久期":1,"杠杆":2,"信用":5,"利率债":2,"转债":0,"赎回":1},"txt":"2016年四季度在国内外多重压力下国内债券市场出现了深度调整.国外方面,11月初美国大选后,新一任总统宣布大规模基建和减税措施后通胀预期上升,推动美国国债利率上升和美元的快速升值.人民币汇率在此影响下被动贬值,资金加速流出.而国内货币政策转向防范地产泡沫和抑制金融杠杆,并未对外汇流出及时对冲,导致国内流动性趋紧,短期利率快速上升.国内方面,三季度以来基本面也出现边际好转态势,前期支撑经济的主要动力基建投资仍然保持稳定.尽管房地产销售下滑,但是由于库存较低,房地产投资和新开工反而有所上升.持续下滑的制造业投资也出现了边际回暖迹象,大宗商品价格的持续上涨带来的补库存需求也对经济产生正面提振.另一方面,中央经济工作会议提出货币政策稳健中性,着力防控资产泡沫的要求,加剧了市场对于货币政策转向的担忧.此外,从市场结构来看,过去两年债券市场的上涨吸引了大量资金进入,产生较大的配置压力,期限利差和信用利差都相对较低,交易较为拥挤,因此在出现外部流动性冲击后市场回调较为明显.12月下旬汇率贬值压力减轻,央行投放流动性后市场情绪出现缓解,短期收益率和长期收益率出现快速下行,信用债调整较为缓慢,信用利差扩大.本基金四季度及时对利率债和部分信用债进行了减仓操作,但由于投资者大额赎回,在收益率快速上行的行情中,市场缺乏流动性,组合信用债仓位,杠杆水平和组合久期被动上升,导致四季度组合净值回撤较大.","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"悲观","rate_future":"悲观","note":"'深度调整',短端利率快速上升、信用利差扩大;赎回负反馈致组合被动加仓,四季度净值回撤较大"}},{"s":"2017-01-01","e":"2017-03-31","iss":"2017-04-21","rtype":"季报","span":89,"n":324,"kw":{"久期":2,"杠杆":1,"信用":1,"利率债":1,"转债":0,"赎回":0},"txt":"2017年一季度债券市场整体下跌。基本面方面，经济延续回升态势。基建投资快速扩张，房地产和制造业投资稳中有升。受总需求平稳以及企业补库存影响，工业生产持续向好。政策方面，在抑制资产泡沫和防范金融风险背景下，央行继续实施稳健中性的货币政策，两次上调公开市场操作利率，并在一季度末对银行体系实施宏观审慎评估体系考核。资金面方面，一季度资金面多数时间呈现紧平衡状态，资金利率中枢上升，月末季末等关键时点资金价格波动较大。一季度基本面、政策面和资金面对债券市场均较为不利，导致债券市场收益率大幅上升。组合一季度持仓以短久期信用债为主，同时维持较低的杠杆水平，并积极参与长久期利率债波段交易增厚收益。在债券市场整体下跌的市场环境下，组合仍然获得可观的正收益。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"中性","rate_future":"中性","note":"债券市场整体下跌、收益率大幅上升;组合维持短久期低杠杆防御,无强前瞻表态"}},{"s":"2017-04-01","e":"2017-06-30","iss":"2017-07-21","rtype":"季报","span":90,"n":339,"kw":{"久期":1,"杠杆":1,"信用":3,"利率债":0,"转债":0,"赎回":1},"txt":"2017年二季度债券市场波动较大。首先是4月公布的3月经济数据大幅好于市场预期，同时银行监管集中发文，大行委外资金赎回预期加剧，资金面也由于缴税因素从月初的短暂宽松恢复紧张局面，导致收益率快速上行。5月债市在监管趋严背景下延续调整，收益率曲线大幅平坦化，信用债利差也逐步扩大。进入6月份，监管协调不断加强，货币政策也有所缓和，央行通过公开市场提前投放流动性大幅缓解了市场对季末资金面的担忧，银行同业存单的发行利率也从高位开始快速回落。同时叠加5月份的经济数据有所回落，市场对于经济复苏的前景出现分歧。多重因素叠加下，无风险利率高位回落，信用债收益率也快速下行，信用利差有所收窄。二季度本基金债券部分整体维持偏短久期和偏低杠杆，在4、5月份债券市场大幅下跌中避免了净值的大幅波动。","sentiment":{"credit_past":"震荡","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"5月延续调整、6月无风险利率高位回落信用利差收窄;维持偏短久期偏低杠杆防御"}},{"s":"2017-07-01","e":"2017-09-30","iss":"2017-10-26","rtype":"季报","span":91,"n":543,"kw":{"久期":1,"杠杆":0,"信用":3,"利率债":6,"转债":0,"赎回":0},"txt":"三季度债券市场基本呈现弱势震荡格局，收益率曲线在季初小幅陡峭化之后重新回归平坦化，以金融债为代表的利率债在季末甚至出现了10年期和3、5年期的倒挂。季初，在财政存款投放推动下市场流动性整体较为充裕，叠加监管政策逐渐明朗化以及债券通正式实施等，市场情绪改善明显，收益率延续了六月份以来的下行趋势，尤其以中短端利率债和信用债下行较多，表现为收益率曲线陡峭化和信用利差的压缩。七月中旬开始，在缴税因素扰动下，资金转紧，虽然央行进行了大量投放对冲，但资金面持续紧张，收益率下行趋势中止。同时七月公布的六月经济数据大幅超预期，市场对经济的悲观预期有所修复，长端利率债有所调整但幅度不大。但是七月经济数据再次意外大幅下滑，固定资产投资和工业增加值均出现非常明显的下行。八月数据有所反弹，但是反弹力度不及预期，市场对于经济下滑的担心又开始加剧，做多热情有所修复。但八九月份持续的资金紧张，短端收益率居高不下，加上融资数据仍然强势，表内贷款持续超预期，尤其是居民部门的贷款量一直处于高位，整体的社会融资总量也相对较好，都在一定程度上制约了长端利率债的下行空间，长端利率债仍未摆脱区间震荡的格局。三季度本基金主要以短久期信用债为底仓，以获得较为确定的持有期回报为主，并适时进行利率债波段操作增厚组合收益。","sentiment":{"credit_past":"震荡","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"'弱势震荡格局',信用利差局部压缩;短久期信用债为底仓+利率债波段操作"}},{"s":"2017-10-01","e":"2017-12-31","iss":"2018-01-19","rtype":"季报","span":91,"n":469,"kw":{"久期":1,"杠杆":1,"信用":3,"利率债":1,"转债":0,"赎回":1},"txt":"2017年四季度债券市场收益率再次出现较为明显的上行。基本面上，市场对于中长期经济增长前景和通胀前景预期有所修复。一方面是基建投资并未出现明显下滑，地方政府基建投资的冲动并未受到明显抑制；另一方面是房地产整体库存偏低，拿地热情仍然较高，地产投资短期内仍然存在较强的支撑。此外持续偏强的融资数据也表明经济短期的韧性较强。通胀方面，油价和工业品价格持续攀升，叠加上食品价格也有所回升，引发市场对于未来通胀上升的担忧。从十九大报告和中央经济工作会议看，防范和化解金融风险是今后三年都要重点抓好的攻坚战，市场对金融监管持续深化的预期得以强化。同时四季度流动性一直处于偏紧的状态，同业存单利率持续上行贯穿整个四季度，并一度突破上半年高点，这也反映了在流动性持续偏紧状态下银行负债端的压力不断显现，这也是触发这一轮市场调整的重要因素。在市场收益率的大幅上行中，信用利差也有所走阔，但是整体信用利差仍然处于中性偏低位置。本基金在四季度初及时减仓了利率债和部分期限较长的信用债持仓，及时降低了组合久期和杠杆水平，降低了市场收益率大幅上行对组合净值的影响。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"悲观","rate_future":"悲观","note":"收益率再次明显上行、信用利差走阔;组合及时减仓利率债和长期限信用债、主动降久期降杠杆"}},{"s":"2018-01-01","e":"2018-03-31","iss":"2018-04-23","rtype":"季报","span":89,"n":435,"kw":{"久期":0,"杠杆":1,"信用":2,"利率债":0,"转债":0,"赎回":0},"txt":"2018年一季度债券市场利率在快速上行后出现了较大程度的回落。1月份由于经济数据表现良好，微观产品价格不断上升，市场对于经济的乐观预期逐步升温，加上市场对于金融监管的担忧以及权益市场的持续火爆，债券利率继续上升。2月初开始海外资本市场的大幅波动造成国内股票市场的大幅回撤，市场风险偏好有所回落。另外一方面人民银行维护春节前资金面稳定，流动性持续处于宽松状态，债券市场收益率有所下行。3月开始多重因素刺激下，市场对于未来经济预期转向悲观。一方面是大宗商品由于库存积累，下游开工较晚，价格出现明显下跌，也带动权益市场的相关板块出现回撤。同时在3月下旬中美贸易摩擦进一步升温，考虑到出口是2017年支撑经济的重要因素，这也加剧了市场对于未来经济下行的担忧。此外融资条件的收紧，地方政府债务管理的进一步深入也增加了市场对于未来经济的悲观预期。这带动债券收益率快速大幅下行，在宽松的流动性支持下，信用债收益率也出现回落，信用利差收窄。本基金在一季度适当增加了杠杆，增厚了组合收益。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"3月起收益率快速大幅下行、信用利差收窄;组合适当增加杠杆增厚收益"}},{"s":"2018-04-01","e":"2018-06-30","iss":"2018-07-19","rtype":"季报","span":90,"n":348,"kw":{"久期":1,"杠杆":1,"信用":10,"利率债":2,"转债":0,"赎回":0},"txt":"2018年二季度债券市场波动较大，但整体来看利率债和高评级信用债各期限收益率都较季初显著下行，中低等级信用债则出现了较为严重的分化。4月伊始，资金面延续一季度的宽松，加上经济数据回落、中美贸易摩擦渐起、叙利亚等外部因素冲击，风险资产持续承压，债券收益率延续一季度的走势持续下行。5月在降准后超预期紧张的资金面、海外债券收益率快速走高等因素影响下，债券收益率快速反弹，这个过程中民企信用违约开始集中出现，中低评级信用利差迅速扩大。6月开始信用收缩和贸易摩擦再度恶化导致的经济悲观预期和政策放松预期重新主导市场，同时叠加季末流动性整体平稳，债市重新走强，尤其是利率债和高等级信用债收益率下行明显，中低等级信用债利差继续扩大，分化严重。本基金在二季度增加了杠杆和久期水平，并对持仓信用债进行了结构优化。","sentiment":{"credit_past":"震荡","rate_past":"牛市","credit_future":"中性","rate_future":"乐观","note":"利率债与高评级信用债显著下行,但中低等级信用债严重分化;组合增加杠杆久期同时对信用债结构优化(警惕分化)"}},{"s":"2018-07-01","e":"2018-09-30","iss":"2018-10-24","rtype":"季报","span":91,"n":454,"kw":{"久期":1,"杠杆":1,"信用":3,"利率债":1,"转债":0,"赎回":0},"txt":"2018年三季度债券市场经历了较大幅度的波动。随着前期融资环境收紧的影响逐步体现，三季度经济下行压力逐步显现，同时中美贸易摩擦升温也进一步加剧市场对于未来经济下行的担忧。同时货币政策持续宽松，流动性充裕，7月份债券收益率大幅下行。但7月下旬国务院常务会议召开，前期偏紧的财政政策出现调整，同时也开始强调宽货币到宽信用的转化，表内信贷投放明显增多，社会融资总量增速也有所企稳。在稳增长政策预期下，市场对于政策效果的期待明显上升。同时由于美国经济表现强劲，带动美债利率创出新高，人民币汇率贬值压力大幅上升，前期过度宽裕的资金面也出现了一些修正。此外叠加大宗商品表现强势，猪肉和蔬菜价格上涨，市场对于通胀的回升也有所担心。多重因素共同推动债券市场在8月份开始出现明显的回调。尽管表内信贷投放加速，但是在风险偏好快速下降背景下，实体企业面临的流动性仍然偏紧，三季度违约事件频发，信用风险仍在继续发酵。本基金在三季度小幅增加了信用债仓位，小幅降低了利率债仓位，总体杠杆和久期水平较二季度变化不大，重点是持仓结构的调整。","sentiment":{"credit_past":"熊市","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"三季度违约事件频发、信用风险发酵;组合仅小幅调整仓位,无强方向表态"}},{"s":"2018-10-01","e":"2018-12-31","iss":"2019-01-22","rtype":"季报","span":91,"n":344,"kw":{"久期":1,"杠杆":1,"信用":1,"利率债":1,"转债":0,"赎回":0},"txt":"2018年四季度债券市场收益率再次出现大幅下行，尤其是长端利率债收益率下行明显，收益率曲线呈现牛平走势。四季度伊始，受经济数据快速下行，大宗商品价格下跌通胀预期下行，股票市场下挫带动风险偏好回落等利多因素影响，从10月开始，债券收益率开始快速下行，长端收益率明显回落。随后，随着贸易战的缓和以及放松地产、基建等刺激政策预期开始发酵，市场对于稳增长、宽信用开始担忧，加之收益率快速下行后获利盘止盈压力较大，12月中上旬，收益率出现快速调整。中下旬后，虽然年末资金面趋于紧张，但受经济高频数据下行和股票市场悲观情绪共同影响，市场风险偏好进一步下降，债券市场重新走强，收益率在年末创出新低。本基金四季度总体保持偏积极的操作，维持较高杠杆和中性偏长久期，同时注重调整组合结构，提升组合整体流动性。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"收益率大幅下行、长端利率债尤为明显,曲线牛平;组合保持偏积极操作,维持较高杠杆和中性偏长久期"}},{"s":"2019-01-01","e":"2019-03-31","iss":"2019-04-18","rtype":"季报","span":89,"n":261,"kw":{"久期":2,"杠杆":1,"信用":3,"利率债":1,"转债":0,"赎回":0},"txt":"2019年一季度，债券收益率先下后上，全季度来看收益率有所上行。年初在较差的经济增长预期和货币政策宽松影响下，债券收益率延续了2018年的下行趋势并创出新低。此后虽然资金面仍处于宽松格局，但社融大幅增长和PMI数据超预期回升使得市场风险偏好提升，股票市场出现系统性上涨。中长端债券收益率震荡上行，收益率曲线陡峭化。受益于实体经济流动性改善以及化解地方政府债务措施出台，行业龙头企业发行的产业债和城投债信用利差出现明显压缩。本基金一季度逐步降低了组合中久期偏长的信用债，降低了组合杠杆和整体久期，并小幅参与了利率债波段操作。","sentiment":{"credit_past":"牛市","rate_past":"熊市","credit_future":"中性","rate_future":"悲观","note":"利率债收益率净体上行,信用债(城投/产业债)利差明显压缩,走势背离;组合主动降低久期偏长信用债、降杠杆降久期"}},{"s":"2019-04-01","e":"2019-06-30","iss":"2019-07-19","rtype":"季报","span":90,"n":406,"kw":{"久期":1,"杠杆":1,"信用":1,"利率债":1,"转债":0,"赎回":0},"txt":"2019年二季度，债市收益率先上后下，波动明显加大，全季来看收益率整体上行。经济方面，4月公布的一季度经济数据较好，3月份各项经济数据超预期好转，尤其是工业增加值和地产投资上行明显，叠加通胀预期升温，打破了前期市场对经济下半年才会见底的一致预期。政策方面，货币政策重新强调“把好货币总闸门”、4月中央政治局会议强调“结构性去杠杆”和“房住不炒”，市场对货币收紧担忧上升，不仅是长端利率持续上行，连一季度并未明显上行的短端利率也出现了明显的抬升。进入5月后，中美贸易摩擦超预期恶化，推动避险情绪上升，央行加大货币投放、宣布定向降准稳定市场预期，加上4月份主要经济指标开始回落，债券收益率重回下行通道。5月下旬以来，包商事件打破同业刚兑信仰，持续发酵下央行加大了流动性投放力度，但流动性分层现象显现，市场风险偏好快速下降，推动长端收益率进一步下行。报告期内，本基金增加了信用债仓位和久期，并小幅参与了利率债波段操作。","sentiment":{"credit_past":"震荡","rate_past":"熊市","credit_future":"乐观","rate_future":"中性","note":"收益率整体上行(波动大);组合主动增加信用债仓位和久期,对利率债无强表态"}},{"s":"2019-07-01","e":"2019-09-30","iss":"2019-10-24","rtype":"季报","span":91,"n":343,"kw":{"久期":0,"杠杆":1,"信用":3,"利率债":2,"转债":1,"赎回":0},"txt":"三季度，债券市场收益率整体先下后上，全季来看收益率整体有所下行。三季度资金面从二季度末的极度宽松状态回归正常，不过这种不松不紧的状态整体并未超出市场预期，市场走势主要由基本面预期驱动。7月份收益率以整体小幅下行为主。8月份开始，受全球央行“鸽派”宽松，风险资产波动加大，基本面不及预期及政府对房地产调控不断加强的影响，债券收益率快速下行，期限利差和信用利差均大幅压缩，长端利率债收益率创今年新低，中低等级城投债利差也大幅收窄。8月中下旬开始，受专项债扩容担忧、通胀预期升温、货币政策宽松预期转弱、海外债券收益率反弹等因素影响，债券市场出现回调。即使9月降准也未能扭转债券市场弱势调整的态势。报告期内，本基金规模大幅增长，信用债仓位有小幅下降，利率债以波段操作为主，杠杆水平整体维持中性。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"中性","rate_future":"中性","note":"收益率整体下行、中低等级城投利差大幅收窄;信用债小幅减仓、利率债波段操作,杠杆维持中性"}},{"s":"2019-10-01","e":"2019-12-31","iss":"2020-01-18","rtype":"季报","span":91,"n":313,"kw":{"久期":1,"杠杆":1,"信用":1,"利率债":1,"转债":0,"赎回":0},"txt":"四季度，债券收益率整体先上后下呈现倒“V”型走势，全季来看收益率整体下行，曲线呈现陡峭化特征。季度初猪价大幅上涨，推升通胀预期，加之海外风险偏好回升，海外利率大幅反弹，推动国内债券收益率快速上行。猪肉价格快速飙升引发了市场对央行边际收紧货币政策的担忧，跟随利率债上行，信用债收益率也快速反弹，不仅是长端利率上行，短端利率也快速反弹。债券市场的调整随着11月5日央行意外下调MLF利率而终结，11月18日央行继而下调了公开市场7天逆回购操作利率，债券收益率开始重新进入下行通道。季末资金面超预期宽松、降准预期、债券基金集中发行及机构“抢跑”行为等，助推了这一行情的延续。报告期内，本基金仓位变化不大，但久期相比上个季度有所降低。","sentiment":{"credit_past":"震荡","rate_past":"牛市","credit_future":"中性","rate_future":"中性","note":"倒V型走势净体下行;信用债先跌后涨弱于利率债;仓位变化不大,久期略降"}},{"s":"2020-01-01","e":"2020-03-31","iss":"2020-04-21","rtype":"季报","span":90,"n":489,"kw":{"久期":2,"杠杆":1,"信用":4,"利率债":5,"转债":0,"赎回":0},"txt":"2020年一季度，在新冠疫情的影响下，市场对经济衰退预期强烈，避险情绪浓厚，债券收益率整体大幅震荡下行。年初，在CPI低于预期和较为宽松的资金面的双重推动下，收益率震荡下行。春节后，在国内疫情爆发推升避险情绪的影响下，长端收益率在春节后第一个交易日单日下行接近20BP，信用债收益率也跟随利率出现了非常明显的下行。随后，由于国内疫情逐渐好转复工预期升温、权益市场走势强劲，在收益率大幅下行之后，债市一直处于小幅震荡调整模式。到3月初，在海外疫情超预期爆发的背景下，美联储紧急超预期降息，加之油价暴跌，推动长端收益率再次开始大幅下行。在全球股市暴跌引发流动性危机之后，美联储在3月末开启了无限流动性支持，而此时国内降息预期也在持续发酵，引发长端收益率继续下行。整个季度来看，10年期国债和国开债收益率分别下行55BP和63BP。信用债收益率整体走势类似于利率债，但受到流动性宽松影响，短端收益率下行幅度较长端更大，但幅度较利率债更小，因而信用利差整体走阔。报告期内，本基金规模增长较快，组合自春节后系统性提高了杠杆和久期水平，在保证流动性的前提下，增持高等级信用债和长久期利率债。","sentiment":{"credit_past":"震荡","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"疫情冲击收益率大幅震荡下行,信用利差走阔(信用债相对承压);组合系统性提高杠杆久期,双双增持"}},{"s":"2020-04-01","e":"2020-06-30","iss":"2020-07-21","rtype":"季报","span":90,"n":388,"kw":{"久期":1,"杠杆":2,"信用":3,"利率债":3,"转债":0,"赎回":0},"txt":"债券市场方面，二季度收益率先下后上，整体波动很大。季度初，海内外疫情影响仍在持续，市场风险偏好仍处于相对低位。清明节期间央行实行定向降准、下调超额准备金利率等操作，资金面整体较为宽松，长端收益率震荡下行。但到5月上旬，货币政策进一步宽松不及预期叠加五一消费复苏经济修复延续，长端收益率开始上行。随后，社融放量强化经济修复预期，收益率进一步大幅上行，且短端上行幅度更大，曲线呈现出熊平趋势。进入6月，货币环境仍未好转，叠加首批1000亿元特别国债发行但央行无配套动作，市场情绪进一步悲观，继续推动长端收益率上行。直到半年末，央行适时开启逆回购呵护半年末流动性，市场情绪有所恢复，长端收益率趋于稳定。信用债走势与利率债类似，全季来看收益率整体大幅上行，长端信用利整体走阔。报告期内，本基金规模变化较大，组合在5月大幅降低了杠杆和久期水平，信用债仓位保持稳定，利率债以波段操作为主。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"悲观","rate_future":"悲观","note":"曲线熊平、收益率大幅上行,长端信用利差走阔;组合5月大幅降低杠杆和久期水平防御"}},{"s":"2020-07-01","e":"2020-09-30","iss":"2020-10-28","rtype":"季报","span":91,"n":456,"kw":{"久期":1,"杠杆":0,"信用":4,"利率债":2,"转债":0,"赎回":0},"txt":"债券市场方面，三季度在经济持续修复、央行货币政策向常态化回归、市场风险偏好逐渐抬升的背景下，债券收益率呈现震荡上行的态势。7月市场主要受风险偏好变化的影响，表现出明显的“股债跷跷板”效应，月初股市大涨，债券情绪较弱，长端利率快速上行，下半月随着风险偏好的回落和部分配置力量出现，债市有所回暖，长端利率向下修复。8月后，经济中观指标短期呈现出较好的改善，同时银行超储率处于偏低水平、同业存单发行利率快速上行，引发市场对流动性的担忧，中短端利率上行幅度大于长端，债券收益率曲线演绎熊平行情。直到月末附近，资金面紧张态势才有所好转，短端利率上行斜率才略有趋缓。进入9月后，经济基本面仍在改善、信用扩张继续，同业存单利率持续上行，同时债市供给增加、季末资金面趋紧，债市继续弱势运行。整个季度来看，10年期国债和国开债收益率分别大幅上行30BP和60BP，信用债亦跟随无风险利率整体震荡上行，且上行幅度更大，信用利差整体走阔。报告期内，本基金规模变化较大，组合进一步降低了久期水平，信用债仓位保持稳定，以获取票息收益为主。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"中性","rate_future":"悲观","note":"10年国债/国开债大幅上行30/60bp,信用利差跟随走阔且幅度更大;组合进一步降低久期,信用仓位维持不变"}},{"s":"2020-10-01","e":"2020-12-31","iss":"2021-01-21","rtype":"季报","span":91,"n":410,"kw":{"久期":1,"杠杆":2,"信用":8,"利率债":2,"转债":0,"赎回":1},"txt":"四季度初债市延续三季度的表现，市场缺乏明确主线，交投清淡;随后公布的三季度GDP数据不及预期，市场解读为基本面利空短期出尽，叠加债券供给压力缓和，债市有所回暖，长端利率向下修复。进入11月，受永煤违约事件的影响，市场风险偏好骤降，公募债基遭遇较大的赎回压力，债券收益率曲线演绎熊平行情，中短端利率上行幅度大于长端，信用利差走阔。直到月末，国务院金融委对信用风险的表态，使得市场情绪开始有所平复，叠加央行超预期、大规模投放MLF，同时通过持续投放逆回购来呵护流动性，资金面整体宽松，收益率快速下行，出现一波明显的估值修复。整个季度来看，收益率先上后下，10年期国债和国开债收益率分别下行1BP和19BP，信用债走势与无风险利率有所分化，高评级信用债收益率下行、中低评级收益率上行，信用利差整体走阔。报告期内，本基金规模变化较大，季末在收益率下行过程中组合进一步降低了杠杆和久期水平，信用债仓位小幅下降，以获取票息收益为主。","sentiment":{"credit_past":"震荡","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"10年国债/国开债净体基本持平(先熊后牛);信用债高低评级分化、利差走阔;组合季末小幅降杠杆降久期防御"}},{"s":"2021-01-01","e":"2021-03-31","iss":"2021-04-19","rtype":"季报","span":89,"n":459,"kw":{"久期":1,"杠杆":1,"信用":3,"利率债":3,"转债":0,"赎回":0},"txt":"一季度债券收益率呈现区间震荡走势，春节前后受到资金面及通胀预期的扰动收益率出现阶段性走高，随后在配置力量的推动下缓慢修复。具体来看，年初债市延续宽松格局，短端大幅下行，长端区间震荡。至1月下旬，一方面考虑到就地过年的取现需求下降，央行并未如往年大量投放流动性，另一方面一月缴税走款与财政存款投放存在一定时间差，导致资金面短期内骤然收紧，引发市场调整，并延续至春节放假。节后大宗商品价格上涨引发市场对通胀的担忧，债市延续弱势。但自3月以来，虽然高频数据显示经济动能表现仍超预期，央行公开市场操作也维持中性，但宽松的资金面及权益市场调整导致的市场风险偏好下降，推动收益率小幅缓慢下行。整个季度来看，收益率呈现窄幅震荡走势，截至季末10年期国债和国开债收益率与去年底基本持平。而在市场配置力量的驱动下，中高等级信用利差持续压缩，信用分化的格局愈发明显，同时如永续债、私募债等品种的流动性溢价也出现了显著压缩。报告期内，组合规模有所增长，仍维持偏低的杠杆及久期水平，持仓高等级信用债以获取票息收益，同时择机参与利率债波段操作。","sentiment":{"credit_past":"牛市","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"国债/国开债收益率与去年底基本持平、区间震荡;中高等级信用利差持续压缩;组合维持偏低杠杆久期"}},{"s":"2021-04-01","e":"2021-06-30","iss":"2021-07-20","rtype":"季报","span":90,"n":436,"kw":{"久期":2,"杠杆":2,"信用":3,"利率债":2,"转债":0,"赎回":0},"txt":"二季度债券收益率呈现震荡下行的走势。4-5月流动性环境相对宽松，市场担忧的地方债供给加速迟迟没有出现，同时信用市场的一级供给也弱于往年同期水平。在机构杠杆与久期水平普遍偏低的情况下，“资产荒”使得机构的配置需求较为旺盛。6月初开始，地方债供给开始增多，资金价格上行，引发市场对流动性的担忧，同时债券在经历前期上涨后赔率有所下降，收益率小幅回调。但在央行持续表态维持流动性稳定的背景下，叠加5月经济数据表现偏弱，债券收益率再次下行，并持续到季末。整个季度来看，经济修复进程中内外需分化明显，内需修复高度不及预期，市场对后续基本面走势出现较大分歧，流动性成为短期债券市场的重要主导因素。流动性持续宽松推动收益率曲线陡峭化下行，1Y和10Y国开债分别较一季度末下行25bp和8bp，高等级信用债走势基本跟随无风险利率，而机构的配置需求推动流动性溢价品种利差持续压缩。报告期内，本基金规模稳定，杠杆及久期水平提升至中性，持仓高等级信用债以获取票息收益，同时择机参与利率债波段操作。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"1Y/10Y国开债分别下行25bp/8bp,高等级信用债跟随下行;组合杠杆久期提升至中性,转向积极"}},{"s":"2021-07-01","e":"2021-09-30","iss":"2021-10-27","rtype":"季报","span":91,"n":607,"kw":{"久期":3,"杠杆":3,"信用":8,"利率债":4,"转债":0,"赎回":0},"txt":"债券市场方面，7月央行超预期全面降准后，市场做多情绪高涨，当月金融和经济数据的走弱，显示信用收缩对经济的下行压力逐步体现，这推动收益率曲线平行下行，10年期国债收益率最低触及2.83%。8月上旬，曲线长短端走势开始分化。随着央行公开市场保持中性平稳操作、降息预期落空、MLF(中期借贷便利)到期及地方债发行持续消耗超储，资金面并未实质性转松，7天回购利率始终围绕OMO(公开市场操作)上下波动，估值明显偏贵的曲线短端显著回调，1年期国债收益率自最低点反弹超过20bp;而与此相对，在疫情防控升级、房地产调控从严以及生产供给受限的背景下，悲观的经济预期对于债券市场仍是较为有力的支撑，曲线长端区间震荡。信用债方面，7-8月在市场机构配置需求强烈的推动下，中高等级信用利差持续压缩至历史极低水平。8月下旬，受到银行理财估值整改及过渡期临近结束的影响，信用债开始调整，其中长久期信用债及银行资本补充品种利差走阔较为显著。全季来看，债券收益率整体下行，1年和10年国债收益率分别下行10bp和20bp，1年和5年AAA信用债收益率分别下行12bp和26bp。报告期内，组合规模小幅下降。7月，组合维持中性杠杆及久期水平;8月以来债券收益率低位波动，资金面维持宽松，信用利差及流动性溢价均压缩至历史极低水平，组合逐步降低杠杆及久期至中性偏低。整体来看，操作期内组合持仓高等级信用债以获取票息收益，同时择机参与利率债波段操作。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"中性","rate_future":"中性","note":"1年/10年国债、AAA信用债收益率均下行;组合8月起逐步降杠杆降久期至中性偏低,转谨慎"}},{"s":"2021-10-01","e":"2021-12-31","iss":"2022-01-21","rtype":"季报","span":91,"n":606,"kw":{"久期":2,"杠杆":2,"信用":4,"利率债":3,"转债":0,"赎回":0},"txt":"债券市场方面，四季度收益率先上后下。十月以来，海外大宗商品价格迅速上涨，国内在限电限产政策的影响下煤炭价格持续高涨，PPI(生产价格指数)的抬升及基本面下行压力的增加引发市场“类滞涨”担忧。同时央行自7月降准之后并未有进一步宽松政策，也使得市场的乐观预期有所修正，债券市场调整，10年期国债收益率上行到3.04%。自10月下旬开始，在一系列保供稳价政策下，煤炭价格快速回落至合理区间，通胀压力缓解，市场关注点重回经济增长情况。多重压力下制造业PMI(采购经理指数)快速回落，同时房地产行业的下滑幅度也超出市场预期，基本面压力加大，收益率重回下行趋势。随着12月二次降准的提前落地，市场持续交易宽松预期，在配置资金的推动下，债市保持牛市行情直到年底。综合来看，四季度债券市场在经历了国庆节后两周左右的调整之后，整体处于牛市环境，收益率收至全年最低点附近，1年和10年国债收益率分别下行9bp和10bp。信用债方面，全季度演绎结构性资产荒行情，1年和5年AAA信用债收益率分别下行10bp和25bp，信用利差持续压缩;银行资本补充工具等溢价品种在经历了9-10月理财整改的事件性冲击后，利差再次显著压缩，收益率下行至全年最低点。报告期内，组合规模有所增长。三季度末杠杆及久期水平偏低，在10月收益率调整过程中，逐步将久期提升至中性，杠杆提升至偏高水平。持仓以高等级信用债为主获取票息收益，同时择机参与利率债波段操作。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"'整体处于牛市环境',收益率收至全年低点,信用利差持续压缩;组合逐步提升久期至中性、杠杆至偏高"}},{"s":"2022-01-01","e":"2022-03-31","iss":"2022-04-22","rtype":"季报","span":89,"n":475,"kw":{"久期":2,"杠杆":2,"信用":7,"利率债":2,"转债":0,"赎回":2},"txt":"一季度伊始，稳增长压力较大，货币政策率先发力，公开市场7天回购利率和1年期中期借贷便利利率均在1月中旬调降10bp，叠加1月下旬央行偏宽松表态，激发了市场对货币政策进一步宽松的预期，收益率曲线快速陡峭化下行。但春节后1月社融数据远超预期，各地因城施策的地产政策陆续出台，市场对宽信用的担忧逐渐发酵，叠加海外加息预期快速升温，收益率快速反弹，十年国债利率从2.68%一路反弹至2.80%以上。3月份俄乌战争持续发酵，在打压全球风险偏好的同时，大幅推升了全球的通胀预期，市场对滞涨的担忧逐渐升温，叠加疫情爆发、民企地产主体信用风险频发，权益市场大幅调整，引发了混合型产品的集中赎回，信用利差快速走扩。总体来看，一季度债券收益率先下后上，窄幅波动，信用债波动幅度更大，信用利差有所走扩。报告期内，组合持仓以高等级信用债为主获取票息收益，同时择机参与利率债波段操作，关注信用风险，对持仓进行结构性调整。组合在年初保持较高的杠杆和中性偏长的久期水平，春节后社融数据超预期后组合大幅减仓，3月中下旬观察赎回结束后重新加仓，但季度末来看，仓位和久期均低于年初水平。","sentiment":{"credit_past":"震荡","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"收益率先下后上窄幅波动,信用利差走扩;组合杠杆久期动态调整,季末低于年初水平,无强方向"}},{"s":"2022-04-01","e":"2022-06-30","iss":"2022-07-20","rtype":"季报","span":90,"n":497,"kw":{"久期":1,"杠杆":1,"信用":4,"利率债":2,"转债":0,"赎回":0},"txt":"二季度海外通胀水平继续抬升，货币政策进一步收紧，资本市场出现较大幅度的波动。国内经济受到疫情的扰动，服务业、物流甚至生产和地产销售等均受到不同程度的影响。从资产表现上来看，债券表现有所分化，短端在资金宽松的推动下大幅下行，长端受疫情和稳增长预期扰动维持震荡。4月中下旬债券市场因降准幅度不及预期、社融数据超预期等因素出现短暂调整，但上海及北京疫情的扩散打断了经济增长的节奏，PMI(采购经理指数)连续三个月低于荣枯线，央行将银行间资金利率维持在大幅低于政策利率的水平，这带动收益率曲线陡峭化下行。直至5月末上海和北京疫情得到控制，复工复产后经济快速修复，稳增长政策频出，债券市场再度回调。整个季度来看，短端下行幅度在10-20bp不等，长端基本维持窄幅震荡格局，收益变化不大;在配置力量和资金面宽松带动下，信用利差大幅压缩，信用债整体表现好于利率债。报告期内，本基金规模有所下降。我们认为市场资金利率大幅低于政策利率的状态并不是常态，所以随着收益率的下行，组合降低了杠杆和久期水平。整体上组合持仓仍以高等级信用债为主获取票息收益，同时择机参与利率债波段操作，关注信用风险，对持仓进行结构性调整。","sentiment":{"credit_past":"牛市","rate_past":"震荡","credit_future":"中性","rate_future":"悲观","note":"短端大幅下行长端窄幅震荡(利率分化);信用利差大幅压缩表现好于利率债;组合主动降低杠杆和久期"}},{"s":"2022-07-01","e":"2022-09-30","iss":"2022-10-26","rtype":"季报","span":91,"n":668,"kw":{"久期":1,"杠杆":2,"信用":3,"利率债":4,"转债":0,"赎回":0},"txt":"三季度内需整体较二季度有所好转，但仍明显低于潜在增速水平。消费和地产恢复缓慢，唯有基建维持较强的力度和两位数以上的增速水平。三季度最大的宏观变化是出口。疫情以来，在外需和份额双重提振下，出口保持了长达两年的高增长，但随着海外货币紧缩对需求的制约逐渐显现，出口在三季度出现了较大幅度的下行。海外增长已经在快速下行，但在供给制约、地缘政治事件频发背景下，通胀维持较强的粘性，欧美央行在三季度变得更加鹰派，全球衰退对出口的拖累或许会成为未来我们面临的越来越凸显的宏观问题。债券市场整体波动较大。首先是季度初疫情平稳后经济活动出现一定的修复，同时公开市场操作缩量，债券收益率出现短暂的上行。之后疫情出现反复，同时银行间回购利率在公开市场缩量后仍保持低位，债券收益率快速转向下行。尤其是8月中旬，央行意外调降公开市场操作利率，债券收益率加速下行，打破了年初以来的震荡格局。但9月以来，在海外央行超预期紧缩、人民币贬值压力加大、国内准财政和地产政策频出、季节性资金转紧等因素共同作用下，债券收益率又重新转为上行。但整个三季度来看，各期限债券收益率均较二季度出现不同程度的下行，其中下行幅度来看，信用债好于国开债，国开债好于国债，利差在较低的水平上进一步压缩。报告期内，本基金规模有所下降。考虑到流动性宽松、资金利率在较长时间内处于政策利率下方，经济内生增长动能疲弱，地产恢复偏缓、出口处于下行初期，组合在报告期提升了杠杆和久期水平。整体上组合持仓以高等级信用债为主获取票息收益，同时择机参与利率债波段操作，关注信用风险，持续对持仓个券进行优化调整。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"各期限收益率均下行,信用债表现好于国开债;组合提升杠杆和久期水平"}},{"s":"2022-10-01","e":"2022-12-31","iss":"2023-01-20","rtype":"季报","span":91,"n":416,"kw":{"久期":1,"杠杆":1,"信用":5,"利率债":1,"转债":0,"赎回":1},"txt":"四季度经济整体承压。一方面，疫情快速扩散对国内经济活动带来严重影响，叠加居民信心疲软压制地产销售，内需明显回落；另一方面，外需走弱对经济拖累也越来越明显，仅基建投资在政策性金融工具支持下保持一定韧性。虽然现实的经济状况仍然非常疲弱，但四季度地产政策继续边际放松叠加疫情防控政策优化措施出台，市场对于经济回暖的预期明显上行，债券市场出现大幅调整，其中短端收益率上行幅度大于长端，曲线迅速熊平。本轮债市迅速回调还引发了理财赎回的负反馈效应，这进一步加剧了债券市场波动，信用债利差在前期的低位水平上大幅走扩。报告期内，本基金规模下降较多。考虑到前期对经济影响较大的地产和疫情政策已出现显著调整，政策效果短期无法证伪，组合在报告期减持了长端利率债，降低了组合久期，但考虑到利差大幅走阔后的信用债持有价值提升，组合保持了较高的信用债仓位和杠杆水平。整体上组合持仓仍以高等级信用债为主获取票息收益，同时关注信用风险，持续对持仓个券进行优化调整。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"乐观","rate_future":"悲观","note":"理财赎回负反馈致曲线熊平、信用利差大幅走扩;组合减持长端利率债防御,但逆势保持较高信用债仓位和杠杆(判断'利差走阔后信用债持有价值提升')"}},{"s":"2023-01-01","e":"2023-03-31","iss":"2023-04-21","rtype":"季报","span":89,"n":1000,"kw":{"久期":2,"杠杆":3,"信用":5,"利率债":2,"转债":0,"赎回":0},"txt":"开年以来，在内外部因素共同带动下，宏观经济整体出现超预期回升。一方面，随着疫情缓解，国内的工业生产和居民消费快速恢复;另一方面，去年四季度以来出台的一系列防范化解房地产优质主体风险相关政策开始见效，居民购房信心改善带动地产销售出现好转。外部来看，在全球供应链压力缓解等因素支撑下，发达国家增长出现阶段性企稳回升，中国面临的外需环境也随之改善。但3月以来，市场对增长动能持续性的担忧加剧。国内来看，一方面场景恢复带来的消费恢复基本兑现，但居民内生的消费意愿受到制约，整体消费增速距离疫情前仍然有差距(尤其是汽车等不受益于场景放开的可选品消费恢复不及预期);另一方面，聚焦高质量发展的要求使得市场对经济的预期出现一定程度修正。海外方面，美国爆发了中小银行危机事件并不断发酵，在高通胀的环境下，美国货币政策可能难以及时应对，这也加剧了市场对海外货币紧缩效应的担忧。一季度债券市场表现分化，利率债、同业存单等基础利率普遍上行，信用债受益于前期较高的信用利差，收益率下行为主，但具体节奏上一波三折。经济修复预期在春节前主导市场走势，债券收益率全面上行。春节期间的宏观数据表现差强人意，春节后市场走势出现一定程度逆转，风险资产稍显疲弱，债市则迎来喘息。进入3月，市场对增长动能持续性的担忧加剧，叠加海外风险事件的冲击，在降准预期发酵以及最终兑现的情况下，债市表现偏强。往后看，在居民收入尚未明显修复、杠杆率高企的大背景下，家庭部门对经济贡献的高度和持续性存在较大不确定性，而企业部门和政府部门扩张的意愿并不强烈，外需则同时面临供给冲击回补结束和海外经济动能减弱的压力，这意味着二季度经济的动能相比一季度大概率将边际减弱，但仍有望维持弱复苏的状态。海外方面，美国经济进入增长转弱、通胀韧性、风险频发的宏观情景，银行业的问题从急症转向顽症，3月份央行意外降准应对海外可能的风险冲击，流动性料将保持相对平稳的状态。在这样的宏观场景下，结合资产估值的位置，债券资产继续以票息策略应对，关注可以做多的拐点。报告期内，本基金规模有所下降。一季度经济环比改善，组合久期和杠杆水平有所下降，3月海外加息诱发中小银行风险事件发酵、国内降准后预计流动性保持平稳，组合增持中短久期信用债、杠杆再度提升至中性偏高水平，同时择机参与了利率债波段交易。整体上组合持仓以高等级信用债为主获取票息收益，关注信用风险，持续对持仓个券进行优化调整。","sentiment":{"credit_past":"牛市","rate_past":"熊市","credit_future":"乐观","rate_future":"中性","note":"利率债/同业存单普遍上行,信用债受益前期高利差收益率下行(走势背离);组合增持中短久期信用债并提升杠杆至偏高"}},{"s":"2023-04-01","e":"2023-06-30","iss":"2023-07-20","rtype":"季报","span":90,"n":668,"kw":{"久期":1,"杠杆":1,"信用":2,"利率债":0,"转债":0,"赎回":0},"txt":"二季度政策定力增强，稳经济政策力度退坡，叠加内生需求不足的状态并没有得到扭转，这使得国内经济在二季度快速降温，消费、投资、出口全方位走弱。消费方面，场景恢复对消费的支撑基本兑现，居民内生消费意愿依然疲软，未能接力推动消费修复。投资方面，地产政策停滞，前期相对有效的“保主体”、“房贷利率”等政策没有进一步加码，地产在一季度短暂修复后重新转向下行;而财政力度在二季度明显退坡，基建也未能有效对冲经济放缓压力。出口方面，海外制造业景气仍处回落趋势，叠加疫后出口份额回补效应消退，出口景气度同样回落。6月中旬以来，面对增长压力，政策层面开始进行应对，但政策尚处出台过程中，见效仍需时日，这一轮稳增长政策对经济支撑效果需要到三季度才能看到。“弱现实+弱预期”的组合下，风险偏好回落，债券市场情绪高涨，收益率全面下行。4月，在经济数据走弱、实体融资需求疲弱、降准落地改善流动性、理财规模回流等因素共同推动下，收益率顺畅下行;进入5月，市场对基本面走弱阶段性充分定价后，赔率制约显现，做多热情放缓，但由于基本面持续低迷，降息预期渐起，市场于6月初再次开启一轮上涨，并在OMO(公开市场操作)/MLF(中期借贷便利)降息兑现后达到情绪高点，随后在稳增长预期扰动下阶段性回调，但幅度有限。报告期内，本基金规模保持稳定。二季度经济环比走弱、市场对政策出台的预期开始强化，流动性宽松、资金利率走低，组合保持略偏低久期和较高的杠杆水平，积极对期限结构和持仓个券进行优化调整，以获取票息和骑乘收益。组合持仓仍以中高等级信用债为主，关注信用风险，改善组合流动性。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"中性","rate_future":"中性","note":"风险偏好回落、收益率全面下行;组合以票息和骑乘策略为主,维持偏低久期较高杠杆,非强方向表态"}},{"s":"2023-07-01","e":"2023-09-30","iss":"2023-10-25","rtype":"季报","span":91,"n":631,"kw":{"久期":0,"杠杆":1,"信用":2,"利率债":0,"转债":0,"赎回":0},"txt":"在经历二季度的下行后，三季度宏观经济总体保持企稳态势。需求侧来看，基建投资企稳以及出口的边际改善是主要推动力，反映政策逆周期调节力度加大和海外制造业景气好转的拉动。同时，去库存行为有所缓解，也对生产有一定积极影响。但地产和消费对经济向上的空间带来制约，经济内生修复动力依然较弱。地产方面，虽然中共中央政治局会议以来中央和地方各种政策频出，但非一线城市的地产销售以及整体地产投资仍未见起色，一方面居民信心尚未见明显好转，另外政策在地产企业融资支持方面仍然比较有定力。就业和收入疲软对居民消费意愿也仍然有制约。三季度债券市场在“预期与现实”博弈下，走势一波三折，收益率先下后上，绝大部分品种、期限收益率均有上行。具体看，行情可分为两个阶段：第一阶段为6月降息后至8月下旬，债券市场博弈属性明显增强。两次降息的利多影响与稳增长政策逐步落地的利空影响相互交织，债市呈现出震荡但波动加大格局。第二阶段为8月下旬至9月末，债市出现快速回调。二次降息后资金反而收紧，叠加稳增长政策力度加大，尤其是房地产政策边际优化背景下经济修复预期回升，收益率上行明显，短债回调幅度大于长端，曲线走出熊平格局。报告期内，本基金规模小幅下降。三季度央行连续降准降息、表现出宽松的货币政策取向，组合保持了较高的杠杆水平，积极对期限结构和持仓个券进行优化调整，以获取票息和骑乘收益。同时组合在市场调整的过程中，择机参与利率波段逆势操作。组合持仓仍以中高等级信用债为主，关注信用风险，改善组合流动性。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"中性","rate_future":"中性","note":"先下后上,绝大部分品种期限收益率上行、曲线熊平;组合逆势择机参与利率波段操作,但未见明确乐观表述"}},{"s":"2023-10-01","e":"2023-12-31","iss":"2024-01-19","rtype":"季报","span":91,"n":582,"kw":{"久期":3,"杠杆":1,"信用":5,"利率债":4,"转债":0,"赎回":0},"txt":"四季度债券收益率整体先上后下，10年国债收益率运行在2.56%-2.72%之间，四季度末收于2.56%，较三季度末下行约12BP。信用债方面，整体走势与利率债类似，但在城投化债预期的支撑下，整体表现强于利率债，其中又以中长久期和中低等级信用债表现尤其亮眼。具体来看，四季度1年、3年和5年AAA中票收益率分别下行2BP、16BP和15BP，1年、3年和5年AAA-银行二级资本债收益率分别下行2BP、15BP和21BP，1年、3年和5年AA(2)城投收益率分别下行2BP、44BP和36BP。具体来看，行情演绎可分为两个主要阶段：第一阶段为10月初至11月下旬，在利率债供给压力增加、汇率维稳、监管关注资金空转现象等因素的共同影响下，资金面偏紧，债市承压，曲线整体平坦化上移;第二阶段为12月初至年底，在重要会议落地、MLF(中期借贷便利)大量净投放、银行存款利率下调等利好因素支撑下，债券收益率出现明显下行，曲线过于平坦化的形态呈现一定修复。四季度本基金变更了基金经理，期间规模略有降低但基本维持稳定，业绩表现平稳，保持了较好的风险收益特征。操作上，组合在交接后维持了相对稳健的配置，具体交易以调整个券和行业集中度为主，12月中旬，组合开始逐步提高杠杆和久期水平，重点增加了2年信用利差久期的暴露，较好获取了12月中下旬收益率下行和曲线陡峭化带来的资本利得收益。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"10年国债收益率净体下行12BP,信用债(中长久期/中低等级)表现尤其亮眼;组合12月起逐步提高杠杆和久期水平"}},{"s":"2024-01-01","e":"2024-03-31","iss":"2024-04-20","rtype":"季报","span":90,"n":439,"kw":{"久期":2,"杠杆":2,"信用":0,"利率债":2,"转债":0,"赎回":0},"txt":"一季度债券市场走出较为明显的牛市行情，各品种、各期限债券收益率均出现明显下行，10年期国债收益率运行在2.27%至2.56%之间，一季度末收于2.29%，较去年四季度末下行约27BP。具体来看，行情可分为两个阶段：第一阶段为1月至3月初，在基本面偏弱、政策未明显超预期、资金面偏宽松以及配置需求旺盛等因素的共同支撑下，债券市场走出较为顺畅的牛市行情，各类品种收益率均明显下行;第二阶段为3月初至3月末，债券收益率在迅速下行过后赔率有所下降，且随着连续几年发行万亿超长期特别国债的确认、汇率贬值压力增加、基本面有一定转好迹象等利空因素的扰动，债市波动性明显增强，转入震荡格局。本季度组合规模有较大增长，但期间业绩表现平稳且回撤控制较好，保持了不错的风险收益特征。具体操作上，组合在1-2月份维持了高于基准的久期和杠杆水平，较好获取了期间债券收益率快速下行带来的资本利得收益，进入3月为降低波动、控制回撤，组合逐步将久期调整至中性，同时大幅降低杠杆，以期为投资人提供更好的持有体验。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"中性","rate_future":"中性","note":"'较为明显的牛市行情',10年国债净体下行27BP;组合1-2月维持高杠杆久期,3月转为中性并大幅降杠杆,后段转谨慎"}},{"s":"2024-04-01","e":"2024-06-30","iss":"2024-07-18","rtype":"季报","span":90,"n":427,"kw":{"久期":1,"杠杆":1,"信用":2,"利率债":2,"转债":0,"赎回":0},"txt":"二季度债券市场在经过4月下旬的调整后，延续了前期的牛市行情，各品种、各期限债券收益率均出现明显下行，10年国债收益率运行在2.21%至2.35%之间，二季度末收于2.21%，较今年一季度末下行约9BP。具体来看，行情可分为三个阶段：第一阶段为4月初至4月底，在资金面宽松和经济数据边际走弱等因素的支撑下，收益率震荡下行;第二阶段为4月底至5月中旬，受央行频繁提示长债风险叠加地产政策宽松预期等因素影响，市场担忧情绪显现，债市阶段性调整;第三阶段为5月中旬至6月底，非银资金大幅宽松叠加政府债供给节奏依旧较缓等因素均对多头情绪产生积极影响，推动债券收益率顺畅下行并突破关键点位。二季度组合规模保持稳健增长，业绩表现相对平稳，维持了较好的风险收益特征。具体操作上，组合在本季度大部分时间均维持了相对中性的杠杆和久期水平，积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"中性","rate_future":"中性","note":"延续前期牛市、各品种明显下行;组合大部分时间维持相对中性杠杆久期,未见强方向加仓"}},{"s":"2024-07-01","e":"2024-09-30","iss":"2024-10-25","rtype":"季报","span":91,"n":503,"kw":{"久期":1,"杠杆":1,"信用":5,"利率债":4,"转债":0,"赎回":0},"txt":"三季度债券市场一波三折，10年国债收益率运行在2.04%至2.29%之间，三季度末收于2.15%，较今年二季度末下行约5BP，信用债受制于机构行为及流动性影响整体表现弱于利率债，信用利差扩大明显。具体来看，行情可分为五个阶段：第一阶段为7月初，央行宣布开展国债借入操作，并确认已与金融机构签订信用借入协议，收益率迅速大幅回调;第二阶段为7月中旬至8月初，央行接连下调政策利率，助力债市向好，收益率重新回归下行趋势;第三阶段为8月中旬，央行通过主管媒体提示长债风险并对部分农商行启动自律调查，债券收益率迅速回调，债市交易趋冷;第四阶段为8月中旬至9月底，基本面数据偏弱，叠加美联储超预期降息引发国内市场对降准和降息预期升温，收益率震荡下行至2.04%低位;最后阶段为9月底，稳增长政策集中出台，政治局会议罕见研究经济问题，股市连日大涨，股债跷跷板效应明显，债券收益率大幅回调。投资操作上，基于对经济基本面和资金利率走势的判断，组合在报告期内灵活地调整了久期和杠杆水平，并积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。","sentiment":{"credit_past":"震荡","rate_past":"震荡","credit_future":"中性","rate_future":"中性","note":"'一波三折'净体小幅下行5BP,信用债表现弱于利率债、信用利差扩大明显;组合灵活调整无强方向"}},{"s":"2024-10-01","e":"2024-12-31","iss":"2025-01-21","rtype":"季报","span":91,"n":412,"kw":{"久期":1,"杠杆":1,"信用":3,"利率债":3,"转债":0,"赎回":0},"txt":"四季度在货币宽松幅度加码的强烈预期下，各品种、期限的债券收益率均有较大幅度的下行，以10年国债为例，收益率运行在1.68%-2.19%之间，四季度末收于1.68%，较三季度末下行约48BP，信用债走势整体与利率债相似，也呈现出顺畅下行行情。具体来看，行情可分为两个阶段：第一阶段为10月初至11月20日左右，债券市场在经历9月底的大幅调整后，随着增量政策的逐步落地及权益市场趋于平稳后，债券收益率重回震荡下行的趋势;第二阶段为11月下旬至年底，在同业活期存款利率调降、中央经济工作会议关于货币政策的表述明显宽松等利多因素的支撑下，债市情绪升温，各品种、各期限债券收益率均加速下行。投资操作上，基于对经济基本面、政策面和资金利率走势的判断，组合在报告期内保持了相对灵活的久期和杠杆操作，并积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"各品种收益率大幅下行48BP,信用债'顺畅下行'走势与利率债相似;组合保持灵活操作,市场氛围明确偏牛"}},{"s":"2025-01-01","e":"2025-03-31","iss":"2025-04-22","rtype":"季报","span":89,"n":461,"kw":{"久期":1,"杠杆":1,"信用":4,"利率债":3,"转债":0,"赎回":0},"txt":"一季度债券市场整体走出较为明显的收益率曲线上行及平坦化行情，各品种、各期限债券收益率有所上行，以10年国债为例，收益率运行在1.60%-1.90%之间，一季度末收于1.81%，较去年四季度末上行约14BP，信用债走势整体与利率债相似，信用利差边际小幅压缩。具体来看，行情可分为三个阶段：第一阶段为1月至2月初，1月中旬以来流动性维持紧平衡状态，导致债券长端和短端表现分化，曲线形态大幅平坦化;第二阶段为2月中旬至3月中旬，春节后资金面未如预期转松，同时科技板块引领权益市场上涨叠加基本面数据有所回暖，债券调整由短端到长端且幅度有所加大;第三阶段为3月中下旬至3月末，央行公开市场净投放叠加大型商业银行净融出低位回升，资金价格有所企稳，债券收益率整体小幅波动下行。投资操作上，基于对经济基本面、政策面和资金利率走势的判断，组合在报告期内维持了相对灵活的久期操作，杠杆水平维持中性偏低，并积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"中性","rate_future":"中性","note":"收益率曲线上行及平坦化,10年国债上行14BP,信用债走势与利率债相似;组合维持中性偏低杠杆,灵活久期操作"}},{"s":"2025-04-01","e":"2025-06-30","iss":"2025-07-21","rtype":"季报","span":90,"n":493,"kw":{"久期":1,"杠杆":2,"信用":4,"利率债":3,"转债":0,"赎回":0},"txt":"二季度债券市场在中美关税博弈、资金避险情绪提升以及央行系列货币宽松政策落地催化下，收益率由高位回落后转向震荡，10年国债收益率运行在1.62%-1.81%之间，二季度末收于1.65%，较今年一季度末下行约17BP，信用债市场表现更好，信用利差继续压缩。具体来看，行情可分为四个阶段：第一阶段为4月初，受美国宣布对华加征34%“对等关税”影响，10年国债收益率快速大幅下行;第二阶段为4月中旬至4月底，美国关税政策反复叠加中共中央政治局会议召开，债市博弈加剧，收益率震荡小幅上行;第三阶段为5月初至5月底，降准、降息政策落地后短期利多出尽，叠加中美关税缓和远超市场预期，债券收益率继续震荡上行;第四阶段为5月底至6月底，央行公告买断式逆回购并在全月保持积极资金投放，叠加基本面数据边际走弱，债市利好因素累积增多，收益率重回下行通道。投资操作上，基于对经济基本面、政策面和资金利率走势的判断，组合在报告期内维持了相对灵活的久期操作，杠杆水平略有提升，并积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。","sentiment":{"credit_past":"牛市","rate_past":"牛市","credit_future":"乐观","rate_future":"乐观","note":"收益率由高位回落转震荡,净体下行17BP,信用债表现更好、利差继续压缩;组合杠杆水平略有提升"}},{"s":"2025-07-01","e":"2025-09-30","iss":"2025-10-28","rtype":"季报","span":91,"n":561,"kw":{"久期":1,"杠杆":1,"信用":4,"利率债":4,"转债":0,"赎回":1},"txt":"三季度以来，债市步入逆风阶段，10年国债收益率运行在1。64%到1。90%之间，三季末收于1。86%，较今年二季末上行约21BP，信用债表现更弱，信用利差整体以走阔为主。具体来看，行情可分为三个阶段：第一阶段为7月初至7月中旬，跨季后资金面维持宽松，机构继续挖掘品种利差机会，但收益率整体继续下行动力不足，另外随着股债联动效应逐渐显现，债券收益率小幅上行;第二阶段为7月中旬至8月底，股市连续上涨并突破前期高点，市场风险偏好显著提升，对债券市场构成持续压制，期间尽管经济和金融数据表现平平，但市场对此定价有限，10年期国债活跃券收益率上行明显;第三阶段为9月初至9月底，央行重启买债操作预期不断升温，虽为市场提供一定支撑，但《公开募集证券投资基金销售费用管理规定(征求意见稿)》出台，让市场对于潜在赎回压力的担忧情绪逐步发酵，叠加股市情绪依然偏强及“反内卷”政策预期延续，债市整体氛围依旧偏空，10年期国债活跃券收益率突破1。80%关键点位后维持高位震荡。投资操作上，基于对经济基本面、政策面和资金利率走势的判断，组合在报告期内维持了相对灵活的久期操作，杠杆水平偏低以应对规模波动，并积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。","sentiment":{"credit_past":"熊市","rate_past":"熊市","credit_future":"悲观","rate_future":"悲观","note":"原文明确'步入逆风阶段',10年国债上行21BP,信用债表现更弱、利差走阔;组合杠杆水平偏低以应对规模波动"}},{"s":"2025-10-01","e":"2025-12-31","iss":"2026-01-22","rtype":"季报","span":91,"n":573,"kw":{"久期":1,"杠杆":1,"信用":4,"利率债":6,"转债":0,"赎回":2},"txt":"四季度债券市场收益率先下后上，而后维持高位震荡格局。10年期国债收益率运行在1.79%至1.87%之间，四季度末收于1.85%，较三季度末下行约1BP。信用债走势与利率债相似，但表现更好，信用利差整体小幅压缩。具体来看，行情可分为三个阶段：第一阶段为10月初至11月3日，中美贸易再出变数，同时随着二十届四中全会落下帷幕，央行宣布重启国债买卖操作，叠加股市经过前期快速上涨后进入震荡盘整期，债券收益率在以上因素支撑下震荡下行;第二阶段为11月4日至12月4日，央行公布的10月净买入国债金额不及市场预期，叠加三季度货币政策报告重提“跨周期调节”，且消息层面公募基金销售新规带来负债端赎回压力上升，债市情绪整体转为谨慎，收益率呈上行态势;第三阶段为12月5日至年底，基本面、资金面继续对债市形成支撑，但债券收益率在机构行为扰动下整体处于高位震荡格局，其中最重要的影响因素即市场对超长债供给和银行承接力出现一定担忧，30年期与10年期国债利差出现重估。投资操作上，基于对经济基本面、政策面和资金利率走势的判断，组合在报告期内维持了相对灵活的久期操作，考虑到相对稳定且偏低的资金价格，杠杆水平整体有所提高，同时组合积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。","sentiment":{"credit_past":"震荡","rate_past":"震荡","credit_future":"乐观","rate_future":"乐观","note":"先下后上后维持高位震荡,10年国债净体几乎持平(-1BP),信用债表现更好、利差小幅压缩;组合杠杆水平整体提高"}},{"s":"2026-01-01","e":"2026-03-31","iss":"2026-04-22","rtype":"季报","span":89,"n":496,"kw":{"久期":1,"杠杆":1,"信用":4,"利率债":5,"转债":0,"赎回":0},"txt":"2026年一季度债券市场收益率整体呈现震荡下行格局，10年期国债收益率波动区间为1.78%-1.90%，季末收于1.82%，较2025年四季度末下行约3个基点;信用债市场表现相对优于利率债，信用利差普遍小幅收窄。从运行节奏看，年初至1月7日为第一阶段，权益与商品市场延续强势，股债跷跷板效应压制债市情绪，10年期国债收益率快速上行并一度触及1.90%;1月8日至春节前为第二阶段，权益市场上涨动能趋缓，叠加央行结构性政策工具利率下调及持续维持较低资金价格，债市震荡修复，10年期国债收益率春节前下探至1.79%左右;春节后至3月末为第三阶段，收益率曲线呈现显著分化走势，中短端品种收益率受益于资金面持续宽松而稳步下行，长端品种收益率则面临经济数据向好及通胀预期升温等因素冲击而维持震荡回调态势。投资操作上，基于对经济基本面、政策面和资金利率走势的判断，组合在报告期内维持了相对灵活的久期操作，考虑到相对稳定且偏低的资金价格，组合杠杆水平整体有所提高，同时积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。","sentiment":{"credit_past":"牛市","rate_past":"震荡","credit_future":"乐观","rate_future":"乐观","note":"震荡下行格局,10年国债净体小幅下行3BP,信用债表现相对优于利率债、利差普遍收窄;组合杠杆水平整体提高"}}],"annual":[{"s":"2012-01-01","e":"2012-12-31","iss":"2013-03-30","rtype":"年报","span":365,"n":1010,"kw":{"久期":2,"杠杆":3,"信用":15,"利率债":2,"转债":0,"赎回":0},"txt":"走过了波澜起伏的2011年，2012年的债券市场走势相比更加平稳。一季度，市场小幅震荡，收益率上行；二季度开始，国内经济明显走弱，CPI增速处于低位，货币政策在本季度放松，在经历了一次降准和两次降息之后，债券市场重燃做多的热情，收益率显著回落。在此期间，信用债收益率下行幅度更大，且中低评级信用债的表现好于高评级，信用利差显著收窄。进入第三季度，海外经济继续疲弱，美国国债收益率创出历史新低，我国央行则在货币政策上转为谨慎，资金面在三季度趋于紧张，债券市场的收益率在三季度开始上行，信用利差小幅扩大；第四季度，央行采用每周续作逆回购的方式来维持银行体系的流动性，银行间资金面总体维持了较为宽松的水平。2012年四季度中国经济并未延续二、三季度的疲弱态势，而是出现了企稳回暖的趋势，工业增加值月度数据频频超出预期，PPI也从低位回升，PMI数据有明显改善；虽然信贷总量低于预期，但是社会融资总量继续表现出了走强的态势。宏观数据的不断改善强化了市场对未来经济继续回暖的预期，对债券市场尤其是利率产品市场造成了较大的冲击。虽然四季度通胀数据有所缓解，但这基本在市场预期之内，因而并未对债券市场走势构成方向性的影响。信用产品方面，经济的回升使得市场对企业整体盈利能力好转的预期有所增强，部分低评级债券的成功兑付也在一定程度上缓解了市场对信用风险的担忧情绪，加上市场对持有期收益的普遍追求，四季度中低评级的信用债表现良好，信用利差不断收窄，并已回归至历史均值或者以下水平。城投债较高的收益率也吸引了不少机构的买入兴趣，收益率快速回落。而短融收益率则在四季度银行类机构需求明显减少、市场对年末资金担忧情绪上升等因素影响下出现平坦化上移。　　报告期内，我们根据市场的变化灵活调整债券杠杆及组合久期。本基金于5月3日成立，封闭期内做了较大比例的同业存款，获取了较为确定的投资收益，同时逐渐建仓。封闭期结束后，基金规模逐渐稳定，本基金始终坚持较为稳健的债券投资策略，主要采取“低久期信用债+适当杠杆”的投资策略，在三季度债券市场收益率上行调整过程中，保持了较低的波动率。四季度本基金少量配置了一些资质较好的城投债，注重风险控制、个券选择，以提高持有期收益为主。报告期内本基金还根据宏观经济和债券市场运行情况适当对利率债券进行了波段操作，获得了较好的投资收益。总体看，报告期内本基金运作较为稳健，基金净值保持稳步增长，波动率控制在较低水平。"},{"s":"2013-01-01","e":"2013-06-30","iss":"2013-08-28","rtype":"半年报","span":180,"n":750,"kw":{"久期":1,"杠杆":3,"信用":2,"利率债":0,"转债":0,"赎回":0},"txt":"2013年上半年，中国国内经济复苏态势由强转弱，经济增长动力一季度表现强于二季度，主要宏观指标逐步趋缓，经济增长下滑的风险加大，通缩风险增强。期间，宏观调控政策有所调整。具体的，一季度前期，货币信贷政策维持较为宽松的环境；两会召开前夕，出台新一轮房地产调控；两会明确释放出保持经济平稳增长，提高经济质量，有序推进改革的信号；一季度末，有关监管当局对银行理财产品、地方融资平台进行规范、整顿，货币信贷政策略有收紧迹象。二季度，新的领导集体积极有序推进改革，强调经济增长质量，政策基调稳中求进，继续调控房地产，整顿影子银行、规范债券市场，加强监管地方融资平台，抑制产能过剩行业不合理扩张。货币信贷状况，特别是资金面波动加大，政策总体略有收紧。本期内，资金面前松后紧，波动加大，春节前后公开市场净投放资金近万亿，一季度外汇占款流入较大，公开市场不完全对冲，资金利率总体处于较低水平，债券市场表现较好。二季度资金利率波动明显加大，相对一季度收紧，前期略松，5月初中国人民银行重启央票发行，加强外汇头寸监管，外汇占款等资金流入减速。6月份受贷款增长较快、企业所得税集中清缴、外汇市场变化、补缴法定准备金等多种因素叠加影响，货币市场利率急升，高居不下，市场恐慌，债券市场急跌，收益率曲线倒挂，股票市场也冲高快速回落。上半年内，基金根据对经济走势、政策以及资金面的变化判断，灵活调控组合资产配置。具体的，一季度，基于对经济弱复苏，政策由宽松趋向中性，以及资金面由宽松取中性的判断，基金以信用债持仓为主，杠杆水平年初较高，在市场上涨过程中逐步减持债券降低杠杆水平。二季度，基于经济复苏偏弱、货币信贷政策略有收紧，以及资金面由松趋紧，组合继续坚持稳健的投资策略，维持较短久期，较低杠杆水平，持有信用债以获取持有期收益。"},{"s":"2013-01-01","e":"2013-12-31","iss":"2014-03-28","rtype":"年报","span":364,"n":847,"kw":{"久期":1,"杠杆":4,"信用":3,"利率债":2,"转债":1,"赎回":1},"txt":"2013年，中国国内经济政策波动风险，经济增长动力一季度较好，二季度较差，三季度超预期回升，四季度缓慢回落，速度低于预期，总体增长稳定，通胀温和。期间，宏观调控政策相机抉择，一季度前期，货币信贷政策维持较为宽松的环境；两会召开前夕，出台新一轮房地产调控；两会明确释放出保持经济平稳增长，有序推进改革的信号；一季度末，有关监管当局对银行理财产品、地方融资平台进行规范整顿。二季度，政策基调稳中求进，继续调控房地产，整顿影子银行、规范债券市场，加强监管地方融资平台，抑制产能过剩行业不合理扩张。货币信贷及资金面波动加大，政策总体略有收紧。三季度政策略有倾向稳定和局部刺激经济增长，防止经济增长下滑突破下限。四季度政策积极推进改革，并在三中全会中提出超预期全面深化改革的方针政策。本期内，资金面前松后紧，波动加大，债券市场收益率曲线上升，国债和银行间回购利率突破近十年高点。一般性债券与可转债双双大幅下跌，协议存款等货币市场工具表现最好。具体分季度，一季度，受宽松的货币政策和外围资本持续大量流入驱动，债券市场供给受限，高息票债券也有正面表现。二季度，4月前后，房地产调控等政策调整剧烈，市场急转而下，债券市场查整代持等事件对市场和业务操作也造成了负面影响。6月份“钱荒”，债券剧烈下跌。三季度，资金面的情况与上半年表现明显偏紧，债券市场继续下跌，10年期国债一度突破4.7%，达到近十年高点。进入四季度，债券市场再次出现剧烈调整，主要表现在城投债等高收益债券市场大幅下跌，利差有所扩大，市场开放式基金赎回急速增多。本期内，基金根据对经济走势、政策以及资金面的变化判断，灵活调控组合资产配置。具体的，一季度，基金以信用债持仓为主，杠杆水平年初较高，在市场上涨过程中逐步减持债券降低杠杆水平。二季度，组合继续坚持稳健的投资策略，维持较短久期，较低杠杆水平，持有信用债以获取持有期收益。三季度，组合审慎投资，减持债券，维持一定协议存款投资比例。四季度，组合调整结构，增加流动性强债券，及货币市场投资工具。"},{"s":"2014-01-01","e":"2014-06-30","iss":"2014-08-27","rtype":"半年报","span":180,"n":857,"kw":{"久期":0,"杠杆":0,"信用":1,"利率债":0,"转债":1,"赎回":0},"txt":"2014年上半年，中国国内经济增速下滑，经济增长动力趋缓，二季度表现略好于一季度，主要宏观指标总体下滑，一季度经济增速下滑风险偏大，二季度经济增速稳中趋缓。宏观调控政策灵活调整，稳中有进。具体的，一季度货币信贷政策维持稳健，外汇占款流入明显；一季度后期，宏观调控政策逐步更强调把经济运行保持在合理区间，并提早于市场预期推出促改革、调结构、惠民生的定向刺激政策，推动经济稳定发展。二季度，宏观调控稳中求进、改革创新，坚持稳健货币政策和积极财政政策的前提下，积极推出并加大定向宽松政策，改善货币信贷条件，加大棚户区改造、基建投资力度。宏观调控当局经历了去年经济下行及局部微刺激等有效调控后，积累了应对经济下滑挑战的经验，政策储备充足，调控从容不迫，定力较强，对经济短期波动的调控和平衡能力更强，市场对经济软着陆的信心增强。本期内，资金面总体略显宽松，波动较小。春节前，中国人民银行采取灵活操作模式，向市场投放资金，缓释银行间市场短期资金压力，并于节后陆续回笼，一季度人民币币值保持相对强势，外汇占款流入较多。年中银行间资金利率几乎没有出现季节性大幅冲高，宽松程度好于预期。人民币汇率双向波动加大，外汇占款流入出现波动，总体略有趋缓，对银行间资金利率影响不大，公开市场逐步投放流动性，一定程度上对冲了资本流入放缓。期间，债券类资产表现较好，可转债和股票表现次之。上半年内，基金根据对经济走势、政策以及资金面的变化判断，灵活调整组合资产配置。具体的，一季度，基于对经济增速有望延续去年四季度以来的回落，货币信贷政策维持稳健，以及资金面弱平衡的判断，组合继续坚持稳健的低波动率策略。组合调整交易所债券持仓，将其相对于银行间收益率曲线的估值浮亏兑现，增加组合流动性，导致净值下跌。二季度，基于对经济增速有望延续一季度以来的回落，货币信贷政策有望加大定向宽松，以及资金面维持中性偏宽松的判断，对债券投资保持谨慎乐观，组合继续坚持稳健的低波动率策略，增持信用资质较好的高收益债，保持一定水平持有期收益率，获取较为稳定的持有期收益。"},{"s":"2014-01-01","e":"2014-12-31","iss":"2015-03-27","rtype":"年报","span":364,"n":971,"kw":{"久期":0,"杠杆":4,"信用":3,"利率债":1,"转债":0,"赎回":0},"txt":"2014年债券市场经历了一波较为可观的牛市行情，中债财富总指数全年上涨11.23%。首先是，经济疲弱、低通胀压力贯穿全年。其次，国务院将降低社会融资成本作为一项重要工作，央行态度和行为较2013年下半年发生了根本性变化。第三，非标业务在监管和银行风险偏好下降的双重影响下大幅萎缩。2014年上半年经济总体保持弱势格局。一季度宏观经济在去年四季度的基础上继续走弱，尤其是1-2月份经济下滑的幅度超出了市场的预期。虽然经济在3月份稳增长措施出台后小幅反弹，但4月份又重新减速。经过政府一系列微刺激措施后，经济从5月份开始又有所企稳。市场方面，受益于疲弱的经济增长、宽松的资金面及定向宽松的货币政策，债券市场收益率高位回落。从品种看，利率债及交易所高收益债在上半年有所反复，涨跌震荡较大，但总体收益率仍下行较多，而城投债收益率上半年基本保持单边下行的态势，收益下行幅度也较大。2014年下半年债券市场波动加大。先是三季度初公布的6月社融数据增长幅度较大，M2同比增速14.7%，远超市场预期和13%的目标值。市场对三季度经济平稳回升的预期以及对央行货币政策转向的担忧因此有所加剧，叠加7月份资金季节性紧张、IPO重启等因素使得债券收益率从6月份低点迅速反弹，收益率曲线陡峭化上行30bp以上。之后7、8月份金融、经济数据异常走低，经济持续走弱，央行先后通过下调公开市场回购利率、SLF投放基础货币、降息等价格和数量手段并用的方式释放宽松信号，债券收益率快速下行。但进入12月份市场情绪迅速逆转，收益率快速掉头向上。首先在年末季节性因素叠加天量新股双重影响下资金面异常紧张，回购利率显著抬升。其次，股票市场在降息后的惊人表现导致资金持续流出债券市场。最后，中证登公布了企业债质押新规，大幅提高了入库标准，机构去杠杆集中抛售进一步推高了债券收益率。信用利差在12月份收益率上行过程中迅速扩大。操作上，上半年基于对经济增速有望延续去年四季度以来的回落，货币信贷政策维持稳健，以及资金面有所缓和的判断，组合继续坚持稳健的低波动率策略，调整了交易所债券持仓，增加了组合流动性。下半年基于对经济增速有望逐步止跌企稳，货币信贷政策有望加大定向宽松，以及资金面维持中性偏宽松的判断，对债券投资保持谨慎乐观，增持了一部分资质较好的信用债，以获取较为稳定的持有期收益。"},{"s":"2015-01-01","e":"2015-06-30","iss":"2015-08-26","rtype":"半年报","span":180,"n":713,"kw":{"久期":0,"杠杆":0,"信用":6,"利率债":5,"转债":0,"赎回":1},"txt":"一季度债券市场总体经历了先上涨后下跌的过程。年初随着市场对基本面和通缩风险的担忧不断加剧，央行先后通过再贷款、MLF续作、降准、降息等货币政策手段托底经济，加上两融监管加强，股市弱势调整，市场风险偏好有所下降，债券市场经历了慢牛行情，债券收益率向下突破去年11月低点。进入3月份以后，在地方债债务置换和股市快速上涨带来的大类资产切换推动下债券市场经历了一波较为快速的调整行情，收益率从低点快速反弹。二季度债券市场收益率总体经历了先快速下行后缓慢反弹的过程。4月中上旬，债券市场总体延续了3月份以来的弱势震荡格局。中下旬以来伴随加速恶化的经济数据，央行超预期调降准备金率1个百分点，市场情绪迅速逆转，做多热情高涨，收益率快速下行。进入5月份，央行再次降息，但市场预期充分，加之地方债供给压力挥之不去，财政政策有加码迹象，同时房地产销售数据良好，债券除短端跟随资金价格走低而降幅明显外，中长期利率债收益震荡上行。本基金年初大幅加仓了信用债仓位，并适当加仓了长端利率债仓位，3月份市场不确定性加大，本基金在市场大幅下跌之前减持了利率债，并降低了信用债仓位，但基金赎回规模大幅超出了预期，同时市场流动性变差，基金信用债仓位被动提升，组合净值在3月份出现较大幅度的调整。本基金二季度初保持了较高的信用债仓位，随着债券市场止跌回暖，基金申购大幅增加，信用债仓位被动有所降低，考虑到3月份经济数据异常下滑，3月以来对地方债的供给担忧市场已经有充分的预期，本基金在资金申购后大幅加仓了长端利率债，较好的获得了4月中旬降准后收益率大幅下行带来的资本利得收益。随后本基金根据市场情况变化，逐步降低了长端利率债仓位，提高了中等资质信用债的配置仓位。"},{"s":"2015-01-01","e":"2015-12-31","iss":"2016-03-25","rtype":"年报","span":364,"n":1306,"kw":{"久期":0,"杠杆":0,"信用":9,"利率债":10,"转债":0,"赎回":1},"txt":"2015年债券市场再次延续牛市格局，中债总财富指数全年上涨8%，长期国债收益率也达到2009年以来的新低。债券市场连续两年的牛市较为少见，一方面是由于经济低迷，通胀下行，经济中的传统动力持续疲弱，社会融资需求出现较大的萎缩；而央行货币政策持续宽松，数次降准降息保证了流动性的供给。另一方面是年中股票市场的大幅波动，大量资金从权益类相关资产中撤出，流入债券市场，这也推动了债券收益率的快速下行。2015年上半年债券利率波动较大。一季度工业增加值加速下滑，同时央行为了对冲外汇占款流失和经济下滑及时推出了降准降息措施，这带动债券收益率出现一波显著的下行。但是3月地方债置换消息传出，由于担心供给冲击，市场收益率大幅反弹。随着情绪修复以及央行通过降准方式大量释放流动性支持地方债发行，收益率再次回落到前期低点。5月开始股票市场的快速上涨对于债券资金形成了明显的分流，很多和权益类挂钩的类固收产品对于债券市场形成了一定的挤压，此外叠加第二批地方债发行以及金融数据的好转，这导致债券收益率再次上扬。2015年下半年开始债券市场走出单边的牛市。三季度核心驱动在于股票市场的大幅波动造成的大类资产配置转移，大量资金涌入债券类资产，推动债券资产价格加速上涨。11月在IPO重启，美国加息预期以及经济数据好转的叠加冲击下，债市出现调整，但是很快回落。四季度债券市场基本面并没有太大的变化，经济数据继续疲软。但是政策面上去产能的提出强化了市场对于明年经济的悲观预期。由于对于2016年债券资产的看好，部分资金提前布局，推动收益率在年底出现一波非常明显的下行。同时短期资金面在央行呵护下保持平稳，市场对此充分预期，这也催化了长期收益率的下行和期限利差的缩窄。本基金2015年初大幅加仓了信用债，并适当加仓了长端利率债，3月份市场不确定性加大，本基金在市场大幅下跌之前减持了利率债，并降低了信用债仓位，但基金赎回规模远远超出了预期，同时市场流动性变差，基金信用债仓位被动提升，组合净值在3月份出现较大幅度的调整。本基金二季度初保持了较高的信用债仓位，随着债券市场止跌回暖，基金申购大幅增加，信用债仓位被动有所降低，考虑到3月份经济数据异常下滑，3月以来对地方债的供给担忧市场已经有充分的预期，本基金在资金申购后大幅加仓了长端利率债，较好的获得了4月中旬降准后收益率大幅下行带来的资本利得收益。本基金三季度规模大幅增加，考虑到中高等级中票与利率债利差较低，公司债风险收益比较差，未进行这两类品种的加仓。在大规模申购后组合主要选择加仓了利率债、短融和城投债。由于城投债交易成本较高，加仓力度不及申购增加，城投债仓位被动下降较多，利率债和短融加仓力度较大，这两类品种仓位相比二季度上升较多。本基金四季度规模继续增加，同样考虑到中高等级中票与利率债利差较低，公司债风险收益比较差，仍未进行这两类品种的加仓，而是继续加仓利率债和短融。四季度基金主要业绩来源于利率债，城投债对组合净值也有一定的正贡献。总体来看，本基金虽然全年规模波动幅度较大，但我们仍根据市场情况和规模变动情况进行了及时的调仓，总体较好的把握了债券市场的机会，大幅跑赢了业绩基准。"},{"s":"2016-01-01","e":"2016-06-30","iss":"2016-08-24","rtype":"半年报","span":181,"n":1139,"kw":{"久期":3,"杠杆":2,"信用":16,"利率债":3,"转债":0,"赎回":4},"txt":"2016年上半年债券市场收益率并未出现明显的趋势，总体呈现震荡态势。一月份，市场对于供给侧改革带来经济短期阵痛形成一致预期，叠加全球股票市场波动带来的风险偏好下移，共同推动长债收益率出现显著下行。但是二月份以后，随着股票市场企稳，风险偏好逐步修复，同时经济中的积极信号逐步增多，市场开始出现分歧。首先是一线城市地产价格的快速上升开始向二线城市扩散。在货币宽松和政策支持下，一线城市地产销售的好转反应为价格的快速上升，并开始向部分二线城市传导。一二月份地产的新开工和投资数据均出现较为明显的回升，引发市场对于地产投资回升力度和持续性的关注。其次是大宗商品价格快速上升。一季度主要大宗商品价格包括原油、铁矿石、螺纹钢价格出现明显的上涨，考虑到大宗商品同时连接终端需求和通胀预期，市场对于未来增长和通胀的判断开始出现分歧。最后是农产品价格的居高不下导致通胀预期回升。一季度由于天气原因蔬菜价格出现了大幅上涨，而同时猪肉价格也屡创新高，这也触发了对于未来通胀回升的担忧。逐步增大的市场分歧导致长端无风险利率继续下行受阻，甚至出现了一定程度的回调。而在配置压力推动下，信用债收益率持续下行，信用利差被压缩至历史低位。处于对违约风险的担心，市场仍然偏好高等级信用债和城投债。三月底开始信用风险事件频发，市场风险偏好迅速下降，信用债收益率快速走高。机构迫于赎回压力，流动性较好的利率债和城投类品种受到冲击，同时叠加营改增以及宏观审慎评估体系(MPA)考核导致的季末流动性紧张影响，利率出现了一波明显的上调。随后在央行公开市场续作加量以及中期借贷便利(MLF)投放等因素影响下，市场情绪有所回暖，推动信用债和利率债收益率转而下行。但是由于基本面仍处于边际改善态势以及对于六月底资金面的担心，利率以震荡整理为主。进入六月后，非农数据孱弱导致美联储加息预期骤降，随后公布的中国5月经济数据不及预期，尤其是地产的销售投资出现回落，市场对于经济前景转向悲观。接着是英国退欧推动全球避险情绪升温，市场对全球央行再宽松的预期加强，推动市场收益率出现了显著下行。信用债自四月份冲击以后，结构分化明显。高等级、城投债收益率出现回落，但是过剩产能行业以及出现信用事件的发行主体收益率仍然维持高位，利差甚至有所扩大。本基金一季度主要进行了降杠杆和降久期的操作，主要对长久期利率债进行了减持，一季度基金杠杆和久期水平均大幅下降，信用债仓位基本稳定。一季度基金业绩主要由信用债贡献。本基金二季度遭遇大规模赎回，基金规模大幅缩水。虽然在大幅赎回之前，基金已提前减仓，预留现金，但赎回规模较大，还是在一定程度上对基金净值造成拖累。二季度组合对持仓信用债进行排查，进一步规避组合整体信用风险。二季度组合净值主要由信用债贡献。"},{"s":"2016-01-01","e":"2016-12-31","iss":"2017-03-31","rtype":"年报","span":365,"n":894,"kw":{"久期":5,"杠杆":6,"信用":4,"利率债":2,"转债":0,"赎回":3},"txt":"2016年全年国内生产总值(GDP)增长6.7%。具体来看，一季度经济出现较多积极因素，进入二、三季度之后，增长略显乏力，但微观数据下半年开始逐渐走强，并从四季度的主要经济指标中逐步反映出来。投资方面，一季度投资数据受十三五开年计划的影响较为强劲，但经济增长依然内生乏力，受到制造业投资的拖累，以及地产投资持续维持在低位的影响，二季度投资数据大幅下滑。三季度制造业投资企稳，随后在基建投资的持续发力下，四季度投资数据整体呈现出较为强劲的企稳迹象。受到2016年初以来房地产去库存政策的影响，地产销售数据出现了较大幅度的上涨，在9月30日之后，十六个重点城市依次推出了相应的地产调整政策，调控城市的销售金额和销量大幅下滑。但是全年房地产投资保持了相对平稳的走势，受销售的波动影响较小。全年来看，通胀比较温和。中上游价格则呈现大幅上涨的态势，但是对下游传导较弱。2016年全年债券市场出现了较大幅度震荡，无风险收益方面，由于一季度的经济预期较好和信用事件冲击，债券市场收益率4月份出现了快速上行。权威人士讲话出台后，债市情绪更是大幅转向。此后英国退欧事件引发避险情绪及货币宽松预期上升，伴随6月末配置需求开始释放，推动收益率再度明显下行，中长端利率债收益率一度快速下行。四季度经济复苏预期增强伴随着海外利率上升造成的冲击，11月以来银行间市场流动性不断收紧，导致回购利率持续攀升。在债市收益率上升的背景下，由于资产端收缩传导的链条较长，去杠杆过程带来的市场调整剧烈程度超出预期。12月下旬在汇率贬值压力减轻，央行投放流动性后市场情绪出现缓解，短期和长期收益率出现快速下行，信用债调整较为缓慢，信用利差扩大。本基金一季度主要进行了降杠杆和降久期的操作，对长久期利率债进行了减持，基金杠杆和久期水平均大幅下降；二季度基金遭遇大规模赎回，虽然基金已提前减仓，预留现金，但由于赎回规模较大，还是在一定程度上对基金净值造成拖累；三、四季度继续降低了组合的杠杆和久期水平，但由于投资者大额赎回，在收益率快速上行的行情中，市场缺乏流动性，组合信用债仓位、杠杆水平和久期被动上升，导致四季度组合净值回撤较大。"},{"s":"2017-01-01","e":"2017-06-30","iss":"2017-08-29","rtype":"半年报","span":180,"n":606,"kw":{"久期":2,"杠杆":1,"信用":3,"利率债":1,"转债":0,"赎回":1},"txt":"2017年一季度债券市场整体下跌。基本面方面，经济延续回升态势。基建投资快速扩张，房地产和制造业投资稳中有升。受总需求平稳以及企业补库存影响，工业生产持续向好。政策方面，在抑制资产泡沫和防范金融风险背景下，央行继续实施稳健中性的货币政策，两次上调公开市场操作利率，并在一季度末对银行体系实施宏观审慎评估体系考核。资金面方面，一季度资金面多数时间呈现紧平衡状态，资金利率中枢上升，月末季末等关键时点资金价格波动较大。一季度基本面、政策面和资金面对债券市场均较为不利，导致债券市场收益率大幅上升。2017年二季度债券市场继续大幅波动。首先是4月公布的3月经济数据大幅好于市场预期，同时银行监管集中发文，大行委外资金赎回预期加剧，资金面也由于缴税因素从月初的短暂宽松恢复紧张局面，导致收益率快速上行。5月债市在监管趋严背景下延续调整，收益率曲线大幅平坦化，信用债利差也逐步扩大。进入6月，监管协调不断加强，货币政策也有所缓和，央行通过公开市场提前投放流动性大幅缓解了市场对季末资金面的担忧，银行同业存单的发行利率也从高位开始快速回落。同时，5月的经济数据有所回落，市场对于经济复苏的前景出现分歧。在多重因素叠加作用下，无风险利率高位回落，信用债收益率也快速下行，信用利差有所收窄。上半年本基金整体以稳健操作为主，维持较低的杠杆和较短的久期，并积极参与长久期利率债波段交易增厚收益，在市场大幅下跌中避免了净值的大幅波动。"},{"s":"2017-01-01","e":"2017-12-31","iss":"2018-03-30","rtype":"年报","span":364,"n":514,"kw":{"久期":1,"杠杆":2,"信用":2,"利率债":0,"转债":0,"赎回":1},"txt":"2017年经济相对2016年继续改善，且保持了较强的韧性。一方面是房地产市场的持续景气超出了市场预期，尤其是三、四线城市房地产销售出现了大幅增长，库存得到有效去化，相关上游产业链出现明显回升；另一方面是海外经济持续回暖对于国内经济的拉动作用也非常显著。虽然地方融资限制不断加大，但基建投资并未出现明显下滑。通胀方面，非食品价格持续处于高位，但是食品价格疲软，拖累整体通胀水平低于预期。但临近年末随着油价和工业品价格持续攀升，叠加食品价格也有所回升，引发了市场对于未来通胀上升的担忧。2017年全年债券市场收益率出现大幅上行。首先是上半年，在经济回升势头较强，政策着重防风险去杠杆的背景下，央行两次上调公开市场操作利率，资金面整体维持紧平衡态势。同时监管集中发文，银行委托赎回预期加剧，收益率快速上行。三季度随着金融监管协调推进，资金面较上半年也有所好转，债券收益率整体窄幅震荡为主。但四季度以来，随着市场对经济和金融监管预期差的修复，债券收益率再次出现一波非常明显的上行。全年来看，在无风险利率上行过程中信用利差也有所走阔，但是整体信用利差仍然处于中性偏低位置。2017年本基金全年基本保持较短的久期和偏低的杠杆，票息策略为主。"},{"s":"2018-01-01","e":"2018-06-30","iss":"2018-08-28","rtype":"半年报","span":180,"n":378,"kw":{"久期":1,"杠杆":1,"信用":6,"利率债":1,"转债":0,"赎回":0},"txt":"2018年上半年债券市场波动较大。年初经济数据表现良好，微观产品价格不断上升，市场对于经济的乐观预期逐步升温，加上金融监管文件密集出台，市场对金融监管的担忧不断强化，债券延续了2017年四季度以来的下跌行情。3月开始多重因素刺激下，市场对于未来经济的预期转向悲观。一方面是大宗商品由于库存积累，价格出现明显下跌，权益市场的相关板块也出现一定回撤。同时3月下旬中美贸易摩擦进一步升温，进一步加剧了市场对于未来经济下行的担忧。之后市场主线基本由贸易战和信用收缩主导，民企违约集中出现，市场的风险偏好大幅降低。在货币政策转向和资金面宽松不断确认下，利率债和高等级信用债出现较大涨幅，中低等级信用债则出现了较为严重的分化，民企和城投平台债收益率大幅上行，融资困难，低等级信用利差大幅扩张。本基金在报告期内逐渐增加了组合杠杆和久期水平，并对持仓信用债进行了结构优化。"},{"s":"2018-01-01","e":"2018-12-31","iss":"2019-03-28","rtype":"年报","span":364,"n":396,"kw":{"久期":1,"杠杆":1,"信用":2,"利率债":0,"转债":0,"赎回":0},"txt":"2018年债券市场整体先抑后扬。年初经济数据表现良好，微观产品价格不断上升，市场对于经济的乐观预期逐步升温，加上金融监管文件密集出台，市场对金融监管的担忧不断强化，债券延续了17年四季度以来的下跌行情。3月开始多重因素刺激下，市场对于未来经济的预期转向悲观。一方面是大宗商品由于库存积累，价格出现明显下跌，权益市场的相关板块也出现一定回撤。同时3月下旬中美贸易摩擦进一步升温，进一步加剧了市场对于未来经济下行的担忧。之后市场主线基本由贸易战和信用收缩主导，市场的风险偏好大幅降低，债券收益率逐级走低。虽然三季度债市一度受稳增长、宽信用政策出台，中美利差，原油价格走高及地方债集中发行等影响，有所回调。但四季度在上述影响因素消退后，债券收益率重新进入下行通道，并在年末创出新低。本基金在年初操作较为保守，杠杆和久期水平均较低，随着对经济回落的不断确认，逐步进行加仓，下半年一直保持偏积极的操作。"},{"s":"2019-01-01","e":"2019-06-30","iss":"2019-08-24","rtype":"半年报","span":180,"n":637,"kw":{"久期":3,"杠杆":2,"信用":4,"利率债":2,"转债":0,"赎回":0},"txt":"2019年上半年债券市场跟随经济基本面和政策变化，整体震荡较大。年初在较差的经济增长预期和货币政策宽松影响下，债券收益率延续了18年的下行趋势并创出新低。此后虽然资金面仍处于宽松格局，但社融大幅增长和PMI数据超预期回升使得市场风险偏好提升，股票市场出现系统性上涨。中长端债券收益率震荡上行，收益率曲线陡峭化。受益于实体经济流动性改善以及化解地方政府债务措施出台，行业龙头企业发行的产业债和城投债信用利差出现明显压缩。二季度债券收益率波动明显加大。经济方面，4月公布的一季度经济数据较好，3月份各项经济数据超预期好转，尤其是工业增加值和地产投资上行明显，叠加通胀预期升温，打破了前期市场对经济下半年才会见底的一致预期。政策方面，货币政策重新强调“把好货币总闸门”、4月中央政治局会议强调“结构性去杠杆”和“房住不炒”，市场对货币收紧担忧上升，不仅是长端利率持续上行，连一季度并未明显上行的短端利率也出现了明显的抬升。进入5月后，中美贸易摩擦超预期恶化，推动避险情绪上升，央行加大货币投放、宣布定向降准稳定市场预期，加上4月份主要经济指标开始回落，债券收益率重回下行通道。5月下旬以来，包商事件打破同业刚兑信仰，持续发酵下央行加大了流动性投放力度，但流动性分层现象显现，市场风险偏好快速下降，推动长端收益率进一步下行。本基金一季度逐步降低了组合中久期偏长的信用债，降低了组合杠杆和整体久期，并小幅参与了利率债波段操作。二季度增加了信用债仓位和久期，并小幅参与了利率债波段操作。"},{"s":"2019-01-01","e":"2019-12-31","iss":"2020-03-31","rtype":"年报","span":364,"n":577,"kw":{"久期":4,"杠杆":2,"信用":8,"利率债":5,"转债":0,"赎回":0},"txt":"2019年债券市场表现分化，利率债区间震荡，信用债利差压缩。年初在较差的经济增长预期和货币政策宽松推动下，债券收益率延续了18年的下行趋势并创出新低。但由于4月公布的一季度社融、经济数据较好，叠加央行重提“把好货币总闸门”，引发市场对货币收紧的担忧，推动长端收益率上行。5月至8月上旬，中美贸易摩擦超预期变化、避险情绪升温，央行定向降准稳定市场预期，同时主要经济指标出现回落，长端收益率重回下行通道，期限利差和信用利差均大幅压缩，长端利率收益创出今年新低。但自8月中下旬开始，受专项债扩容担忧、通胀预期升温、货币政策宽松预期转弱、海外债券收益率反弹等因素影响，债券市场出现回调。债市调整延续到11月5日央行意外下调MLF利率，随后叠加货币宽松超预期、债券基金集中发行等因素，债券收益率开始重新进入下行通道。全年来看，10年期国债和国开债分别下行9BP和7BP，以区间震荡为主但略有下行。信用债走势与利率相似，但收益率中枢明显下移，表现强于利率债，且中低评级下行幅度更大，信用利差整体普遍收窄。本基金一季度逐步降低了组合中久期偏长的信用债，降低了组合杠杆和整体久期，二季度债券市场调整后重新增加了信用债仓位和久期。三季度基金规模大幅增长，信用债仓位有小幅下降，杠杆水平整体维持中性。四季度组合久期继续有所降低。全年积极参与利率债波段操作，较好增厚组合收益。"},{"s":"2020-01-01","e":"2020-06-30","iss":"2020-08-28","rtype":"半年报","span":181,"n":486,"kw":{"久期":3,"杠杆":1,"信用":3,"利率债":5,"转债":0,"赎回":0},"txt":"2020年上半年，债券收益率先下后上，债券市场走出了一波非常快速的牛熊切换行情。年初，突如其来的新冠疫情，打破了市场原有节奏。从2月开始，央行货币政策的边际放松，提供了充足的超额流动性，隔夜资金利率一度下探至1%以下的历史低位。由于海外疫情的爆发，避险情绪大幅升温，短端资金利率下行后带动长端跟随，利率债收益率大幅下行，10年国债收益率从疫情前1月末的3.0%，下行至4月初的低点2.5%。信用利差跟随下行。进入二季度，疫情和经济在边际好转，社融也持续高增，货币政策也逐渐有所变化，开始强调直达实体经济，打击金融“空转套利”。央行的连续暂停公开市场操作，也使得隔夜资金利率从1%以下快速上行至2%左右的水平。与央行边际收紧相伴，债市也经历了5-6月的连续调整。“熊平”行情中大幅回吐了前期涨幅，10年国债收益率回到了3%以上的水平。报告期内，组合规模有所增长，组合在一季度系统性提升杠杆和久期至中性偏高水平，增持高等级信用债和长久期利率债;随着经济基本面的改善及货币政策向常态化的转变，组合自5月逐步降低了仓位和久期水平，信用债以票息收益为主，择机参与利率债波段交易机会。"},{"s":"2020-01-01","e":"2020-12-31","iss":"2021-03-30","rtype":"年报","span":365,"n":674,"kw":{"久期":4,"杠杆":3,"信用":10,"利率债":7,"转债":0,"赎回":0},"txt":"2020年利率债演绎了完整的牛熊切换行情，信用债利差先扩大后压缩，四季度在永煤等信用风险事件冲击下，信用利差整体走阔，在央行流动性呵护下高等级信用债利差率先回落、中低等级信用债利差则维持高位。具体来看，1-4月，疫情的冲击使得实体经济被迫按下暂停键，经济基本面恶化的情况下，央行实施超宽松的货币政策，引发了一轮债市牛市，10年期国债收益率创历史新低。二季度之后，国内外疫情形势趋于缓和，经济进入修复阶段。与此同时，以5月15日缩量续作MLF为开端，央行多次释放出货币政策回归常态化的明确信号，致使短端利率急剧调整，收益率曲线大幅平坦化上行。三季度之后，经济渐进企稳，货币政策不再边际放松成为一致预期，长端利率进入震荡上行阶段，市场缺乏明确主线，交投相对清淡。直到四季度中下旬，永煤违约事件给市场带来流动性冲击，叠加国内外疫情的反复，央行重新开始投放流动性，12月长端收益率出现明显下行，并一直持续到年末收官。全年来看，10年期国债和国开债分别下行1BP和6BP，收益率先下后上波动幅度较大。信用债走势与利率债大体相似，同样先下后上，但在永煤等信用风险事件冲击后，评级间利差显著扩大。报告期内，组合规模波动较大，组合在一季度系统性提升杠杆和久期至中性偏高水平，增持高等级信用债和长久期利率债;随着经济基本面的改善及货币政策向常态化的转变，组合自5月逐步降低了杠杆和久期至偏低水平，持仓高等级信用债以获取票息收益为主，择机参与利率债波段交易机会;年末受到永煤等风险事件冲击，债券市场发生较大幅调整，组合择机提升久期及杠杆水平，在年末大幅申购后有所摊薄。"},{"s":"2021-01-01","e":"2021-06-30","iss":"2021-08-28","rtype":"半年报","span":180,"n":406,"kw":{"久期":2,"杠杆":2,"信用":3,"利率债":2,"转债":0,"赎回":0},"txt":"2021年上半年，债券市场整体以窄幅震荡为主，无风险利率变化不大，但信用利差收窄，结构性机会较多。春节前资金面超预期收紧，叠加节后大宗商品价格上涨引发经济强劲增长预期和通胀加息担忧，债券市场收益率快速上行。随后权益市场调整导致市场风险偏好下降，避险情绪升温，同时银行间流动性持续宽松，推动收益率小幅缓慢下行。进入二季度，债券一级供给节奏不及预期，机构久期和杠杆普遍偏低，“资产荒”使得机构的配置需求较为旺盛。在央行继续释放出较为明确的流动性维稳信号、二季度经济数据开始呈现增长边际动能放缓的背景下，债市情绪较为乐观，配置需求推动收益率缓慢下行至半年末。整体来看，上半年债券收益率先上后下，1年和10年期国债收益率分别较去年底下行4bp和6bp，信用利差和流动性溢价持续压缩。报告期内，本基金规模有所增长，一季度组合久期和杠杆水平偏低，二季度提升至中性，持仓高等级信用债以获取票息收益，同时择机参与利率债波段操作。"},{"s":"2021-01-01","e":"2021-12-31","iss":"2022-03-30","rtype":"年报","span":364,"n":403,"kw":{"久期":0,"杠杆":1,"信用":5,"利率债":3,"转债":0,"赎回":0},"txt":"2021年宏观经济逐步呈现出下行压力，这种压力首先表现在上半年财政支出力度的退坡，下半年随着房地产市场快速下滑，经济下行压力愈发加大，并成为主导资本市场的重要变量。外需方面，出口全年保持强劲，有效对冲了内需下滑对经济的冲击。政策方面，财政政策上半年对经济的拖累较大，下半年有所发力，但力度依然比较温和;货币政策在上半年整体保持平稳，下半年随着经济下行压力加大，央行在7月和12月两次降准，释放宽松信号。债券市场整体表现强劲，除在一季度和四季度初出现阶段性调整外，全年收益率下行明显，其中10年国债和国开债收益率分别下行40bp、49bp，3-5年期限高等级信用债收益率下行50-60bp不等，高等级信用利差压缩明显，中低等级信用利差则出现明显的分化格局。报告期内，组合规模有所增长。组合保持一定的杠杆水平，持仓以高等级信用债为主获取票息收益，同时择机参与利率债波段操作，关注信用风险，对持仓进行结构性调整。"},{"s":"2022-01-01","e":"2022-06-30","iss":"2022-08-30","rtype":"半年报","span":180,"n":715,"kw":{"久期":2,"杠杆":2,"信用":7,"利率债":2,"转债":0,"赎回":1},"txt":"上半年海外政策和资产围绕通胀展开，国内经济则由于疫情的持续影响，下行压力凸显，稳增长压力贯穿始终。上半年财政发力明显，地方债发行前置，财政支出也较为积极，叠加年初宽信用的一系列举措，开年社会融资规模大幅超出市场预期，加上各地因城施策的房地产政策陆续出台，经济预期逐步好转。但二季度地缘政治事件频发，国内疫情影响持续存在，服务业、物流甚至生产和地产销售等均受到不同程度的影响，叠加海外通胀进一步走高，引发海外货币政策进一步收紧，海外增长前景迅速恶化，也引发了市场对外需的担忧，经济预期转弱。二季度末疫情影响逐步消退后，经济重新从底部缓慢抬升。资产表现来看，年初机构配置需求较强，叠加央行宽松的政策取向，债券收益率延续去年四季度以来的下行趋势。但春节后各种利空因素叠加，债券出现了上半年以来最大的一波调整，其中信用债调整幅度最大，信用利差走扩。但二季度开始，债券市场情绪逐步企稳回暖，尤其是疫情扩散后，银行间资金利率大幅低于政策利率并维持较长时间，收益率曲线迅速陡峭化，信用利差也出现了持续的压缩。整个上半年来看，短端债券和信用债表现最佳，长端利率债则同时受疫情和稳增长预期影响维持窄幅震荡的格局。报告期内，组合以高等级信用债为主获取票息收益，同时择机参与利率债波段操作，持续对持仓信用债进行结构调整和优化。组合在年初保持较高的杠杆和中性偏长的久期水平，春节后社会融资规模数据超预期后组合大幅减仓，三月中下旬观察赎回结束后重新加仓，五六月份认为市场资金利率大幅低于政策利率的状态并不是常态，所以随着收益率的下行，又重新降低了杠杆和久期水平。整体看，基于赔率和拥挤度的考虑，组合在上半年操作相对较为谨慎，以赚取确定性票息和骑乘机会为主。"},{"s":"2022-01-01","e":"2022-12-31","iss":"2023-03-30","rtype":"年报","span":364,"n":741,"kw":{"久期":4,"杠杆":3,"信用":5,"利率债":2,"转债":0,"赎回":2},"txt":"2022年，在疫情反复、地产疲软、外需回落等因素压制下，国内经济面临较大下行压力。与此同时，地缘政治冲突、全球流动性大幅紧缩对风险偏好也产生冲击。在估值和盈利双重拖累下，权益市场持续低迷，仅在5-6月经济短暂修复、11月政策调整后有阶段性反弹，最终主要宽基指数录得20%-30%的跌幅。债券市场则在疲弱的基本面与稳增长政策带来的预期改善之间摇摆，走势一波三折。整体来看，收益率变动幅度有限，年末十年国债收益率基本持平2021年，信用债收益率则高于2021年。但由于收益率上行集中兑现于11-12月，这给投资应对带来较大难度，并导致了债券部分普遍录得近几年最弱表现。具体来看，前三季度，市场先后经历了三轮“宽货币发力”到“宽信用政策推升预期”再到“稳增长效果有限”的情景。期间，除了短端品种受流动性支撑实现了中枢下移外，中长端品种始终未能走出明显趋势。进入四季度，国内政策调整引发基本面预期显著反转，债券市场快速走弱，由此导致的银行理财赎回冲击进一步放大了市场跌幅。报告期内，组合以高等级信用债为主获取票息收益，同时择机参与利率债波段操作，持续对持仓信用债进行结构调整和优化。组合在年初保持较高的杠杆和中性偏长的久期水平，春节后社融数据超预期后组合大幅减仓，三月中下旬观察赎回结束后重新加仓，五、六月份认为市场资金利率大幅低于政策利率的状态并不是常态，所以随着收益率的下行，组合又重新降低了杠杆和久期水平。下半年，地产恢复偏缓、出口处于下行初期，经济内生增长动能疲弱，而资金利率持续低于政策利率的时长和幅度在历史来看已经缺乏参考时期，因此组合久期逐步回归中性，杠杆策略积极。四季度，随着地产和防疫政策的逐步明朗，经济修复的预期增强，组合久期有所下降，并随信用利差大幅走阔进行结构调整。"},{"s":"2023-01-01","e":"2023-06-30","iss":"2023-08-30","rtype":"半年报","span":180,"n":759,"kw":{"久期":3,"杠杆":3,"信用":4,"利率债":3,"转债":0,"赎回":0},"txt":"2023年上半年，国内经济整体处于疫后恢复的通道上，但修复节奏变化明显，呈现先冲高后回落的走势。一季度，在内外部因素共同推动下，经济超预期回升，国内工业生产、居民消费、地产、出口等领域均出现改善。但进入二季度，内生需求不足的问题逐步凸显，国内经济快速降温。消费方面，场景恢复的支撑基本兑现，居民内生消费意愿却依然疲软;投资方面，“保主体”等政策未完全落实到位，地产在短暂修复后重回下行，而财政政策力度在二季度明显退坡，基建也未能有效对冲经济放缓压力。出口方面，海外经济衰退风险虽然走低，但尚未走出下行趋势，叠加疫后出口份额回补效应消退，出口明显承压。上半年债市呈现全面上涨行情，节奏上先弱后强，拐点出现在3月初，早于基本面拐点。具体看，经济修复预期在春节前主导市场走势，债券收益率全面上行。春节期间的宏观数据表现差强人意，市场阶段性盘整。进入3月，政策预期弱化，市场对增长动能持续性的担忧走强，“弱预期”逐步形成，叠加海外风险事件的影响，债券收益率下行趋势初现端倪。而4月以来，经济快速降温，市场演绎“弱现实+弱预期”的逻辑，风险偏好全面回调，债券收益率顺畅下行。6月中旬以来，稳增长预期抬头，债市略有回调，但幅度有限。结构方面，受益于年初高位的信用利差，一季度有明显的信用利差压缩行情，这也使得上半年信用债表现明显强于利率债。报告期内，本基金规模有所下降。年初经济环比改善，组合久期和杠杆有所下降，3月降准后银行间流动性宽松、海外中小银行爆发风险事件，组合通过利率债提升久期、杠杆亦有所回补，二季度观察到银行间资金利率走低、基本面有所回落，组合维持偏高的杠杆水平，但出于对后续稳增长政策的考虑，久期仍维持偏低配，组合持仓以高等级信用债为主获取票息收益，积极参与利率债波段交易、并持续对期限结构及持仓个券进行优化调整。"},{"s":"2023-01-01","e":"2023-12-31","iss":"2024-03-29","rtype":"年报","span":364,"n":774,"kw":{"久期":1,"杠杆":1,"信用":2,"利率债":4,"转债":0,"赎回":0},"txt":"2023年我国经济曲折修复，一季度脉冲式反弹后，二季度超预期下行，三季度再度修复，年底则有所回落，全年GDP(国内生产总值，下同)增长5.2%，经济总量超126万亿元。具体来看：一季度我国经济社会生活逐步回归正常，经济快速反弹，一季度GDP增速升至4.5%;二季度以来，随着积压需求释放完毕，经济压力显现，GDP增速低于市场预期;7月中共中央政治局研究部署经济工作，稳增长政策陆续出台，经济再度修复，三季度GDP增速升至4.9%;四季度，受外需走弱、地产持续下行、居民消费缓慢等影响，经济修复再度放缓。2023年的债券市场，收益率先下后上，整体仍然处于牛市的环境中。去年底债券市场的深度调整为今年初奠定了较好的配置基础，同时，经济修复从强预期转向弱现实，叠加央行连续降准、降息，带来了利率的持续下行，10年期国债收益率从年初的2.82%下行至8月21日的年内低点2.54%，累计降幅高达约30BP。8月底至11月底，在政策开始调整、地方政府再融资债大量供给、资金价格回升等因素影响下，债券市场出现以短端利率回升驱动的调整行情，1年期国债收益率从8月21日的1.87%回升至11月30日的2.34%，10年期国债收益率也有13BP的回升至2.67%，期限利差对应明显收窄。进入12月，随着资金面边际转松，叠加经济和金融数据结构性偏弱，市场对降准、降息预期升温，债券收益率再度转为下行，10年期国债收益率年底收在2.56%。利差方面，在市场整体面临资产荒的大背景下，投资者不断寻找估值洼地，信用利差和期限利差全年均有较大幅度的压缩。投资操作上，基于对经济基本面和资金利率走势的判断，组合在报告期内灵活地调整了久期和杠杆水平，资产配置以投资级信用债为主，并通过积极的类属利差波段交易以及基于期限结构和个券的精细化管理，努力为组合积累稳健且持续的超额收益。"},{"s":"2024-01-01","e":"2024-06-30","iss":"2024-08-30","rtype":"半年报","span":181,"n":584,"kw":{"久期":1,"杠杆":1,"信用":7,"利率债":3,"转债":0,"赎回":0},"txt":"2024年上半年债券收益率整体下行明显，10年国债收益率运行在2.21%至2.56%之间，半年末收于2.21%，较2023年末下行35BP。信用债方面，整体走势与利率债相同，其中，中长期限品种表现要好于短期限品种，中低评级品种表现要好于高评级品种，1年、3年、5年和10年隐含评级AAA中票收益率分别下行50BP、58BP、67BP和57BP，而对应期限的隐含评级AA+中票收益率分别下行51BP、62BP、79BP和83BP。具体来看，行情主要分为三个阶段：第一阶段为年初至3月初，在央行总量政策加码、财政和地产政策推进偏慢、资金价格回落等诸多利好因素的共同推动下，债券收益率快速下行，长期和超长期品种表现尤其亮眼;第二阶段为3月初至4月底，债券收益率大幅下行后投资者担忧赔率下降，且随着两会召开后政策预期落地，叠加央行提示长债风险，市场波动性明显增强，转入震荡格局;第三阶段为5月至6月，经济和金融数据较一季度有所走弱，同时非银资金大幅宽松叠加政府债供给节奏依旧趋缓，均对多头情绪产生积极影响，推动债券收益率顺畅下行并突破关键点位。投资操作上，基于对经济基本面和资金利率走势的判断，组合在报告期内灵活地调整了久期和杠杆水平，并积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。"},{"s":"2024-01-01","e":"2024-12-31","iss":"2025-03-31","rtype":"年报","span":365,"n":641,"kw":{"久期":1,"杠杆":1,"信用":3,"利率债":5,"转债":0,"赎回":0},"txt":"2024年，我国国内生产总值同比于上一年度增长5%，圆满达成全年经济增长速度目标。在较高基数的背景下，相较于上一年度经济增速仅微降0.2个百分点，这充分彰显出中国经济呈现稳中有进的运行态势。从季度数据维度审视，全年经济整体呈现“U型”走势，第一至第四季度国内生产总值同比增速依次为5.3%、4.7%、4.6%和5.4%。其中，第一季度政策发力前置，经济顺利实现“开门红”;第二、三季度受总需求不足、预期偏弱等因素影响，经济增速有所趋缓;第四季度在2024年9月24日推出的一揽子新政提振下，社会预期显著增强，资本市场与房地产市场活跃度提升，经济明显回暖，增速达到全年峰值。2024年，债券市场迎来一轮强劲的牛市行情。10年期国债收益率从年初的2.56%降至12月末的1.68%，下行幅度达88个基点(BP)。从利率债期限利差层面剖析，不同期限段表现存在差异。国债10年–1年利差呈震荡扩大态势，从年初的40BP左右扩大至年末的60BP左右;而国债30年–10年利差震荡略有收窄，全年基本在10-30BP区间波动。从信用利差角度来看，各个品种基本呈现出1-8月趋势性收窄、9-10月大幅扩大、11-12月在波动中略有下降的特征。投资操作方面，基于对经济基本面、政策面以及资金利率走势的研判，投资组合在报告期内维持相对灵活的久期与杠杆操作，并积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并依据信用利差水平以及波段交易需求对利率债仓位进行调整。"},{"s":"2025-01-01","e":"2025-06-30","iss":"2025-08-30","rtype":"半年报","span":180,"n":577,"kw":{"久期":1,"杠杆":1,"信用":5,"利率债":4,"转债":0,"赎回":0},"txt":"2025年上半年债市告别单边收益率下行趋势，整体呈现倒“V”型走势。10年期国债收益率运行在1.60%-1.90%之间，上半年末收于1.65%，较2024年年末小幅下行约3BP。信用债方面，各品种、各期限信用债整体走势基本与利率债一致。具体来看，行情主要分为三个阶段：第一阶段(1月初至3月17日)，受海外因素及资金面扰动较为明显，央行释放强烈稳汇率信号，且春节后资金面未如预期转松，科技板块引领权益市场上涨，基本面数据亦有所回暖，利率债调整由短及长，曲线走平并带动信用利差走扩;第二阶段(3月18日-4月7日)，资金面转松，叠加4月初美国超预期“对等关税”冲击，债市避险情绪开始发酵，收益率快速下行;第三阶段(4月8日-6月底)，债市快速定价关税冲击后转为持续横盘，4月末PMI走弱对债市形成支撑，随后“双降”落地，市场交易出利多出尽逻辑，叠加中美经贸谈判出现积极信号，债市出现一定回调，而进入6月，由于利好因素累积增多，收益率再度下行，但止盈情绪升温及权益市场跷跷板效应制约债市进一步上涨空间。投资操作上，基于对经济基本面、政策面和资金利率走势的判断，组合在报告期内维持了相对灵活的久期操作，杠杆水平略有提升，并积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并根据信用利差水平以及波段交易需求调整利率债仓位。"},{"s":"2025-01-01","e":"2025-12-31","iss":"2026-03-31","rtype":"年报","span":364,"n":636,"kw":{"久期":1,"杠杆":1,"信用":4,"利率债":6,"转债":0,"赎回":0},"txt":"2025年既是“十四五”收官之年，也是实现2035年远景规划的首个五年收官之年。作为承上启下的关键一年，我国全年GDP为1401879亿元，比上年增长5.0%，主要经济指标在政策支持下保持韧性，如期完成全年增长目标。分季度来看，一季度国内生产总值同比增长5.4%，二季度同比增长5.2%，三季度同比增长4.8%，四季度同比增长4.5%，呈现“前高后低”态势，主要因为上半年财政政策靠前发力与“抢出口”效应共振，激活经济热度，而下半年伴随“两新”政策效果退坡，有效需求不足问题逐渐放大，经济增长放缓趋势显现。2025年债券市场未能延续2024年的单边上行趋势，收益率整体上行，10年期国债收益率从年初1.61%左右上行至1.85%附近，且表现为“高波动、宽震荡”格局。期限利差方面，10年期国债与1年期国债利差年内呈现“V”型走势，从年初的54BP左右，先收窄至年中的20BP以下，随后在资金面宽松但长端多重利空冲击的背景下，震荡走阔至55BP左右;30年期国债与10年期国债利差则从年初的23BP左右走阔至年末的40BP以上。信用债表现稍好，全年短端普通信用债利差、二永债(二级资本债和永续债)利差多呈现收窄的特征。投资操作方面，基于对经济基本面、政策面以及资金利率走势的研判，投资组合在报告期内维持相对灵活的久期与杠杆操作，并积极运用类属配置、个券选择、期限选择等策略获取超额收益。组合持仓债券以投资级信用债为主，并依据信用利差水平以及波段交易需求对利率债仓位进行调整。"}],"n_q":55,"n_a":27,"n_sentiment":55,"sentiment_note":"★2026-07-23用户新增,替换原关键词计数曲线。方法论C:Claude通读全部55条季报原文人工判断打标(非公式化算法),静态缓存不调用任何在线API。局限:不会随新季报自动扩展,需要重新通读手动追加(见_sentiment.py文件头注释)。"},"managers":[{"nm":"马喜德","start":"2012-05-03","leave":"2013-04-22","current":false,"gender":"男","birthyear":"1979","edu":"博士","escrow":null,"escrow_start":null,"escrow_leave":null,"post":"易方达公司决定暂停马喜德基金经理职务。从2013年4月20日起由胡剑、刘琦代为基金经理职责。","resume":"经济学搏士。曾任中国工商银行总行资金营运部人民币交易处投资经理、金融市场部固定收益处高级投资经理、易方达基金管理有限公司固定收益部投资经理、易方达稳健收益债券型证券投资基金基金经理(2008年7月1日至2012年2月28日)，任易方达货币市场基金基 /* ★2026-07-21新增:②净值走势&回撤 / ③滚动业绩稳定性 的时间窗口交互(今年以来/近一年/近3年/近5年/成立以来)
   nav_curve是"成立以来累计收益"序列(inception=0起算),窗口内不能只是从右侧截一段——那样看到的仍是相对成立时的
   累计幅度,看不出该窗口内真实的涨跌节奏,故窗口切换时以窗口起点重新归零(rebase);回撤则由归零后的净值重新算,
   保证"近1年最大回撤"是近1年内真实的峰谷差,而不是背着成立以来的历史峰值。*/
const WIN_OPTS=[["ytd","今年以来"],["1y","近一年"],["3y","近3年"],["5y","近5年"],["all","成立以来"]];
function winCutoff(winKey,asofStr){
  const asof=new Date(asofStr);
  if(winKey==="ytd")return new Date(asof.getFullYear()+"-01-01");
  const yrs={"1y":1,"3y":3,"5y":5}[winKey];
  if(!yrs)return null;
  const d=new Date(asof);d.setFullYear(d.getFullYear()-yrs);return d;
}
function windowSlice(points,winKey,asofStr){
  if(winKey==="all"||!points||!points.length)return points;
  const cutoff=winCutoff(winKey,asofStr);
  let idx=points.findIndex(p=>new Date(p[0])>=cutoff);
  if(idx<0)idx=points.length-1;
  if(idx>0)idx--;   // 多带一个窗口前的点作为rebase基准,避免窗口第一天就是0导致视觉上"从0起跳"的假象
  return points.slice(idx);
}
function rebaseCumReturn(points){
  if(!points||!points.length)return points;
  let base=null;for(const p of points){if(p[1]!=null){base=p[1];break;}}
  if(base==null)return points;
  return points.map(p=>p[1]==null?p:[p[0],(1+p[1])/(1+base)-1]);
}
function drawdownFrom(rebasedNav){
  let peak=-Infinity;
  return rebasedNav.map(p=>{
    if(p[1]==null)return p;
    const lvl=1+p[1];peak=Math.max(peak,lvl);
    return [p[0],lvl/peak-1];
  });
}
function winTabs(cur,onPick){
  const t=document.createElement("div");t.className="wtabs";
  WIN_OPTS.forEach(([k,l])=>{const b=document.createElement("div");
    b.className="wtab"+(k===cur?" on":"");b.textContent=l;
    b.onclick=()=>onPick(k);t.appendChild(b);});
  return t;
}

/* ---------- SVG helpers ---------- */
const NS="http://www.w3.org/2000/svg";
function svg(w,h){const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("class","chart");return s;}
function E(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function sc(d0,d1,r0,r1){if(d1===d0)d1=d0+1;return v=>r0+(v-d0)/(d1-d0)*(r1-r0);}
function ticks(mn,mx,n=5){const sp=mx-mn||1;let st=Math.pow(10,Math.floor(Math.log10(sp/n)));const er=n*st/sp;
 if(er<.15)st*=10;else if(er<.35)st*=5;else if(er<.75)st*=2;const s=Math.ceil(mn/st)*st,t=[];
 for(let v=s;v<=mx+st*.5;v+=st)t.push(+v.toFixed(10));return t;}

/* 经理换届竖线叠加(★2026-07-21新增,供 lineChart/stackArea 共用)
   mgrLines: FUND.mgr_study.timeline (每段起点画竖线,独任实线/共管虚线)
   mgrSensitive: FUND.mgr_study.sensitive (敏感事件红竖线+红点,悬停显示原文) */
function mgrOverlay(s,X,x0,x1,ytop,ybot,mgrLines,mgrSensitive){
  if(mgrLines&&mgrLines.length){
    mgrLines.forEach((m,i)=>{
      if(i===0)return;   // 第0段起点=经理历史起点,通常等于图表最左端,不用再画一条
      const t=+new Date(m.s);if(t<x0||t>x1)return;
      const x=X(t);
      E("line",{x1:x,y1:ytop,x2:x,y2:ybot,stroke:"#8a5a10","stroke-width":1,
        "stroke-dasharray":m.kind==="共管"?"3 3":"none",opacity:.5},s);
      const hw=E("rect",{x:x-4,y:ytop,width:8,height:Math.max(1,ybot-ytop),fill:"transparent"},s);
      hw.style.cursor="pointer";
      hw.addEventListener("mousemove",ev=>showTT(`<b>${esc(m.who_label)}</b> 上任<br>${m.s} 起${m.kind==="共管"?"（共管/代管期开始）":""}`,ev));
      hw.addEventListener("mouseleave",hideTT);
    });
  }
  if(mgrSensitive&&mgrSensitive.length){
    mgrSensitive.forEach(sv=>{
      const t=+new Date(sv.e);if(t<x0||t>x1)return;   // ★用事件段的"止"(sv.e)定位:敏感事由(如"暂停职务")发生在该任期结束时,而非上任的sv.s
      const x=X(t);
      E("line",{x1:x,y1:ytop,x2:x,y2:ybot,stroke:"#c1313a","stroke-width":1.6,opacity:.85},s);
      const c=E("circle",{cx:x,cy:ytop+6,r:5,fill:"#c1313a",stroke:"#fff","stroke-width":1.3},s);
      c.style.cursor="pointer";
      c.addEventListener("mousemove",ev=>showTT(`<b style="color:#ff9b9b">⚠ ${esc(sv.nm)}</b><br>${sv.s}~${sv.e}<br>${esc(sv.note)}`,ev));
      c.addEventListener("mouseleave",hideTT);
    });
  }
}

/* X轴刻度自适应(★2026-07-23修复:窗口切换到"近1年/今年以来"时,原来"每自然年一条线"的刻度
   在窄窗口下可能只剩1条甚至0条,中间几个月完全没有时间参照)。
   跨度>~1.5年→按年;跨度>40天→按月(YY-MM);更短→按约6等分的天(MM-DD)。lineChart()全部调用方自动受益。 */
function xTicks(x0,x1){
  const spanDays=(x1-x0)/864e5,out=[];
  if(spanDays>550){
    const y0=new Date(x0).getFullYear(),y1=new Date(x1).getFullYear();
    for(let y=y0;y<=y1;y++)out.push({t:+new Date(y+"-01-01"),lbl:""+y});
  }else if(spanDays>40){
    let d=new Date(x0);d.setDate(1);
    while(+d<=x1){out.push({t:+d,lbl:`${String(d.getFullYear()).slice(2)}-${String(d.getMonth()+1).padStart(2,"0")}`});
      d.setMonth(d.getMonth()+1);}
  }else{
    const step=Math.max(1,Math.round(spanDays/6));
    for(let t=x0;t<=x1;t+=step*864e5){const d=new Date(t);
      out.push({t,lbl:`${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`});}
  }
  return out;
}

function lineChart(series,{w=680,h=230,pad=[12,16,26,46],pctY=true,zero=false,unit="",mgrLines=null,mgrSensitive=null,forceX=null}={}){
  const s=svg(w,h),[pt,pr,pb,pl]=pad;
  const all=series.flatMap(x=>x.points).filter(p=>p[1]!=null);
  if(!all.length)return s;
  const xs=all.map(p=>+new Date(p[0])),ys=all.map(p=>p[1]);
  let x0=forceX?forceX.x0:Math.min(...xs),x1=forceX?forceX.x1:Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(zero){y0=Math.min(y0,0);y1=Math.max(y1,0);}
  const py=(y1-y0)||1;y0-=py*.08;y1+=py*.08;
  const X=sc(x0,x1,pl,w-pr),Y=sc(y0,y1,h-pb,pt);
  ticks(y0,y1,5).forEach(t=>{const y=Y(t);E("line",{x1:pl,y1:y,x2:w-pr,y2:y,class:"grid"},s);
    E("text",{x:pl-6,y:y+3,"text-anchor":"end",class:"axlbl"},s).textContent=pctY?(t*100).toFixed(Math.abs(t*100)<10?1:0)+"%":(+t).toFixed(2)+unit;});
  if(zero){E("line",{x1:pl,y1:Y(0),x2:w-pr,y2:Y(0),class:"zero"},s);}
  xTicks(x0,x1).forEach(tk=>{const x=X(tk.t);
    if(x<pl-2||x>w-pr+2)return;E("text",{x,y:h-pb+15,"text-anchor":"middle",class:"axlbl"},s).textContent=tk.lbl;});
  E("line",{x1:pl,y1:h-pb,x2:w-pr,y2:h-pb,class:"axis"},s);
  series.forEach(se=>{let d="",st=false;
    se.points.forEach(p=>{if(p[1]==null){st=false;return;}d+=`${st?"L":"M"}${X(+new Date(p[0])).toFixed(1)} ${Y(p[1]).toFixed(1)}`;st=true;});
    if(se.fill){const b=Y(zero?0:y0);E("path",{d:d+`L${X(x1)} ${b}L${X(x0)} ${b}Z`,fill:se.fill,opacity:se.fillOp||.14,stroke:"none"},s);}
    E("path",{d,fill:"none",stroke:se.color,"stroke-width":se.width||1.6,"stroke-linejoin":"round",
      "stroke-dasharray":se.dash||"none"},s);});
  const hit=E("rect",{x:pl,y:pt,width:w-pr-pl,height:h-pb-pt,fill:"transparent"},s);
  const vl=E("line",{x1:pl,y1:pt,x2:pl,y2:h-pb,stroke:"#9aa4b0","stroke-width":1,opacity:0},s);
  hit.addEventListener("mousemove",ev=>{const r=s.getBoundingClientRect(),sx=(ev.clientX-r.left)/r.width*w;
    const t=x0+(sx-pl)/(w-pr-pl)*(x1-x0);vl.setAttribute("x1",sx);vl.setAttribute("x2",sx);vl.setAttribute("opacity",1);
    const rows=series.map(se=>{let b=null,bd=1e18;se.points.forEach(p=>{if(p[1]==null)return;const dd=Math.abs(+new Date(p[0])-t);if(dd<bd){bd=dd;b=p;}});
      return b?`<span style="color:${se.color}">●</span> ${se.name}: <b>${pctY?pctS(b[1]):num(b[1])+unit}</b>`:"";});
    showTT(`<div style="opacity:.7">${new Date(t).toISOString().slice(0,10)}</div>`+rows.filter(Boolean).join("<br>"),ev);});
  hit.addEventListener("mouseleave",()=>{hideTT();vl.setAttribute("opacity",0);});
  mgrOverlay(s,X,x0,x1,pt,h-pb,mgrLines,mgrSensitive);
  return s;
}

/* 双Y轴折线图(★2026-07-23新增,⑲被FOF持有情况:只数+市值合并展示) */
function dualAxisChart(leftS,rightS,{w=680,h=220,forceX=null}={}){
