  const ylL=allL.map(p=>p[1]),y0L=0,y1L=(Math.max(...ylL)||1)*1.15;
  const ylR=allR.map(p=>p[1]),y0R=0,y1R=(Math.max(...ylR)||1)*1.15;
  const X=sc(x0,x1,pl,w-pr),YL=sc(y0L,y1L,h-pb,pt),YR=sc(y0R,y1R,h-pb,pt);
  ticks(y0L,y1L,5).forEach(t=>{const y=YL(t);E("line",{x1:pl,y1:y,x2:w-pr,y2:y,class:"grid"},s);
    E("text",{x:pl-6,y:y+3,"text-anchor":"end",class:"axlbl",style:`fill:${leftS.color}`},s).textContent=t.toFixed(0)+(leftS.unit||"");});
  ticks(y0R,y1R,5).forEach(t=>{const y=YR(t);
    E("text",{x:w-pr+6,y:y+3,"text-anchor":"start",class:"axlbl",style:`fill:${rightS.color}`},s).textContent=t.toFixed(1)+(rightS.unit||"");});
  xTicks(x0,x1).forEach(tk=>{const x=X(tk.t);if(x<pl-2||x>w-pr+2)return;
    E("text",{x,y:h-pb+15,"text-anchor":"middle",class:"axlbl"},s).textContent=tk.lbl;});
  E("line",{x1:pl,y1:h-pb,x2:w-pr,y2:h-pb,class:"axis"},s);
  const drawLine=(pts,Y,color)=>{let d="",st=false;
    pts.forEach(p=>{if(p[1]==null){st=false;return;}d+=`${st?"L":"M"}${X(+new Date(p[0])).toFixed(1)} ${Y(p[1]).toFixed(1)}`;st=true;});
    E("path",{d,fill:"none",stroke:color,"stroke-width":1.8,"stroke-linejoin":"round"},s);};
  drawLine(leftS.points,YL,leftS.color);
  drawLine(rightS.points,YR,rightS.color);
  const hit=E("rect",{x:pl,y:pt,width:w-pr-pl,height:h-pb-pt,fill:"transparent"},s);
  const vl=E("line",{x1:pl,y1:pt,x2:pl,y2:h-pb,stroke:"#9aa4b0","stroke-width":1,opacity:0},s);
  hit.addEventListener("mousemove",ev=>{const r=s.getBoundingClientRect(),sx=(ev.clientX-r.left)/r.width*w;
    const t=x0+(sx-pl)/(w-pr-pl)*(x1-x0);vl.setAttribute("x1",sx);vl.setAttribute("x2",sx);vl.setAttribute("opacity",1);
    const nearest=pts=>{let b=null,bd=1e18;pts.forEach(p=>{if(p[1]==null)return;const dd=Math.abs(+new Date(p[0])-t);if(dd<bd){bd=dd;b=p;}});return b;};
    const bl=nearest(leftS.points),br=nearest(rightS.points);
    let html=`<div style="opacity:.7">${new Date(t).toISOString().slice(0,10)}</div>`;
    if(bl)html+=`<span style="color:${leftS.color}">●</span> ${leftS.name}: <b>${num(bl[1])}${leftS.unit||""}</b><br>`;
    if(br)html+=`<span style="color:${rightS.color}">●</span> ${rightS.name}: <b>${num(br[1],2)}${rightS.unit||""}</b>`;
    showTT(html,ev);});
  hit.addEventListener("mouseleave",()=>{hideTT();vl.setAttribute("opacity",0);});
  return s;
}

/* 堆叠面积(风格漂移) */
function stackArea(rows,keys,{w=680,h=260,mgrLines=null,mgrSensitive=null}={}){
  const s=svg(w,h),pl=46,pr=16,pt=10,pb=26;
  const xs=rows.map(r=>+new Date(r.dt));
  const tot=rows.map(r=>keys.reduce((a,k)=>a+(r[k]||0),0));
  const y1=Math.max(...tot)*1.05,y0=0;
  const X=sc(Math.min(...xs),Math.max(...xs),pl,w-pr),Y=sc(y0,y1,h-pb,pt);
  ticks(y0,y1,5).forEach(t=>{E("line",{x1:pl,y1:Y(t),x2:w-pr,y2:Y(t),class:"grid"},s);
    E("text",{x:pl-6,y:Y(t)+3,"text-anchor":"end",class:"axlbl"},s).textContent=t.toFixed(0)+"%";});
  [...new Set(rows.map(r=>r.dt.slice(0,4)))].forEach(yr=>{const x=X(+new Date(yr+"-01-01"));
    if(x<pl-2||x>w-pr+2)return;E("text",{x,y:h-pb+15,"text-anchor":"middle",class:"axlbl"},s).textContent=yr;});
  const base=rows.map(()=>0);
  keys.forEach(k=>{let d="";
    rows.forEach((r,i)=>{const y=base[i]+(r[k]||0);d+=`${i?"L":"M"}${X(xs[i]).toFixed(1)} ${Y(y).toFixed(1)}`;});
    for(let i=rows.length-1;i>=0;i--)d+=`L${X(xs[i]).toFixed(1)} ${Y(base[i]).toFixed(1)}`;
    d+="Z";E("path",{d,fill:SC[k],opacity:.82,stroke:"none"},s);
    rows.forEach((r,i)=>base[i]+=(r[k]||0));});
  E("line",{x1:pl,y1:Y(100),x2:w-pr,y2:Y(100),stroke:"#c20000","stroke-width":1.2,"stroke-dasharray":"4 3"},s);
  E("text",{x:w-pr-2,y:Y(100)-4,"text-anchor":"end",class:"axlbl",style:"fill:#c20000;font-weight:600"},s).textContent="100%净值线(以上=杠杆)";
  const hit=E("rect",{x:pl,y:pt,width:w-pr-pl,height:h-pb-pt,fill:"transparent"},s);
  hit.addEventListener("mousemove",ev=>{const r=s.getBoundingClientRect(),sx=(ev.clientX-r.left)/r.width*w;
    const t=X.invert?0:null;let bi=0,bd=1e18;
    xs.forEach((x,i)=>{const dd=Math.abs(X(x)-sx);if(dd<bd){bd=dd;bi=i;}});
    const row=rows[bi];
    showTT(`<div style="opacity:.7">${row.dt}</div>`+keys.map(k=>`<span style="color:${SC[k]}">●</span> ${SCN[k]}: <b>${num(row[k])}%</b>`).join("<br>")
      +`<br><span style="opacity:.7">债券合计 ${num(row.bond)}% · 杠杆 ${num(row.lev)}x · 净资产 ${num(row.na)}亿</span>`,ev);});
  hit.addEventListener("mouseleave",hideTT);
  mgrOverlay(s,X,Math.min(...xs),Math.max(...xs),pt,h-pb,mgrLines,mgrSensitive);
  return s;
}

/* 柱状(可正负) */
function barChart(rows,key,{w=680,h=200,color="#4E79A7",unit="亿"}={}){
  const s=svg(w,h),pl=46,pr=16,pt=10,pb=26;
  const xs=rows.map(r=>+new Date(r.dt)),vs=rows.map(r=>r[key]||0);
  let y0=Math.min(0,...vs),y1=Math.max(0,...vs);const py=(y1-y0)||1;y0-=py*.08;y1+=py*.08;
  const X=sc(Math.min(...xs),Math.max(...xs),pl,w-pr),Y=sc(y0,y1,h-pb,pt);
  ticks(y0,y1,5).forEach(t=>{E("line",{x1:pl,y1:Y(t),x2:w-pr,y2:Y(t),class:"grid"},s);
    E("text",{x:pl-6,y:Y(t)+3,"text-anchor":"end",class:"axlbl"},s).textContent=t.toFixed(1);});
  E("line",{x1:pl,y1:Y(0),x2:w-pr,y2:Y(0),class:"zero"},s);
  [...new Set(rows.map(r=>r.dt.slice(0,4)))].forEach(yr=>{const x=X(+new Date(yr+"-01-01"));
    if(x<pl-2||x>w-pr+2)return;E("text",{x,y:h-pb+15,"text-anchor":"middle",class:"axlbl"},s).textContent=yr;});
  const bw=Math.max(2,(w-pr-pl)/rows.length*.6);
  rows.forEach((r,i)=>{const v=r[key]||0,x=X(xs[i]),yt=Y(Math.max(v,0)),hh=Math.abs(Y(v)-Y(0));
    const rc=E("rect",{x:x-bw/2,y:yt,width:bw,height:Math.max(1,hh),fill:v>=0?color:"#c0392b",opacity:.85,rx:1},s);
    rc.addEventListener("mousemove",ev=>showTT(`${r.dt}<br><b>${num(v)}${unit}</b>`,ev));
    rc.addEventListener("mouseleave",hideTT);});
  return s;
}

/* 堆叠柱状(正负值分别向上/向下堆叠,★2026-07-25新增,⑯收益来源结构用)
   keyMeta: {key:{color,label}}；lineKey(可选): 额外叠一条细线(如净利润)做对照 */
function stackedBarChart(rows,keys,keyMeta,{w=680,h=240,unit="亿",lineKey=null,lineColor="#c20000",lineLabel=""}={}){
  const s=svg(w,h),pl=50,pr=16,pt=10,pb=26;
  const xs=rows.map(r=>+new Date(r.dt));
  const posSum=rows.map(r=>keys.reduce((a,k)=>a+Math.max(r[k]||0,0),0));
  const negSum=rows.map(r=>keys.reduce((a,k)=>a+Math.min(r[k]||0,0),0));
  const lineVals=lineKey?rows.map(r=>r[lineKey]||0):[];
  let y0=Math.min(0,...negSum,...(lineKey?lineVals:[0])),y1=Math.max(0,...posSum,...(lineKey?lineVals:[0]));
  const py=(y1-y0)||1;y0-=py*.08;y1+=py*.08;
  const X=sc(Math.min(...xs),Math.max(...xs),pl,w-pr),Y=sc(y0,y1,h-pb,pt);
  ticks(y0,y1,5).forEach(t=>{E("line",{x1:pl,y1:Y(t),x2:w-pr,y2:Y(t),class:"grid"},s);
    E("text",{x:pl-6,y:Y(t)+3,"text-anchor":"end",class:"axlbl"},s).textContent=t.toFixed(1);});
  E("line",{x1:pl,y1:Y(0),x2:w-pr,y2:Y(0),class:"zero"},s);
  xTicks(Math.min(...xs),Math.max(...xs)).forEach(tk=>{const x=X(tk.t);
    if(x<pl-2||x>w-pr+2)return;E("text",{x,y:h-pb+15,"text-anchor":"middle",class:"axlbl"},s).textContent=tk.lbl;});
  const bw=Math.max(2,(w-pr-pl)/rows.length*.6);
  rows.forEach((r,i)=>{
    const x=X(xs[i]);let posBase=0,negBase=0;
    keys.forEach(k=>{
      const v=r[k]||0,col=keyMeta[k].color;
      let yt,yb;
      if(v>=0){yt=Y(posBase+v);yb=Y(posBase);posBase+=v;}
      else{yt=Y(negBase);yb=Y(negBase+v);negBase+=v;}
      const rc=E("rect",{x:x-bw/2,y:yt,width:bw,height:Math.max(0,yb-yt),fill:col,opacity:.88,rx:1},s);
      rc.addEventListener("mousemove",ev=>showTT(`${r.dt}<br><span style="color:${col}">●</span> ${keyMeta[k].label}: <b>${num(v)}${unit}</b>`,ev));
      rc.addEventListener("mouseleave",hideTT);
    });
  });
  if(lineKey){let d="";
    rows.forEach((r,i)=>{const v=r[lineKey]||0;d+=`${i?"L":"M"}${X(xs[i]).toFixed(1)} ${Y(v).toFixed(1)}`;});
    E("path",{d,fill:"none",stroke:lineColor,"stroke-width":2},s);
    rows.forEach((r,i)=>{const v=r[lineKey]||0,x=X(xs[i]),y=Y(v);
      const c=E("circle",{cx:x,cy:y,r:3,fill:lineColor,stroke:"#fff","stroke-width":1},s);
      c.addEventListener("mousemove",ev=>showTT(`${r.dt}<br><span style="color:${lineColor}">●</span> ${lineLabel}: <b>${num(v)}${unit}</b>`,ev));
      c.addEventListener("mouseleave",hideTT);});
  }
  return s;
}

/* 基金经理任期时间轴(甘特条) */
function mgrTimeline(MG,{w=660,rowH=26}={}){
  const pl=64,pr=90,pt=22,valid=MG.filter(m=>m.start);
  const h=pt+valid.length*rowH+8, s=svg(w,h);
  const asof=new Date(META.asof);
  const t0=Math.min(...valid.map(m=>+new Date(m.start)));
  const t1=+asof;
  const X=sc(t0,t1,pl,w-pr);
  // 年份网格
  const y0=new Date(t0).getFullYear(), y1=asof.getFullYear();
  for(let y=Math.ceil(y0/2)*2;y<=y1;y+=2){const x=X(+new Date(y+"-01-01"));
    E("line",{x1:x,y1:pt-4,x2:x,y2:h-6,class:"grid"},s);
    E("text",{x,y:pt-8,"text-anchor":"middle",class:"axlbl"},s).textContent=y;}
  const PAL=["#4E79A7","#59A14F","#B07AA1","#F28E2B","#E15759","#76B7B2","#EDC948"];
  valid.forEach((m,i)=>{
    const y=pt+i*rowH+4, bh=rowH-9;
    const xs=X(+new Date(m.start)), xe=X(m.leave?+new Date(m.leave):t1);
    const col=m.current?"#c1313a":PAL[i%PAL.length];
    const r=E("rect",{x:xs,y,width:Math.max(xe-xs,3),height:bh,rx:3,fill:col,opacity:m.current?.95:.62},s);
    E("text",{x:pl-8,y:y+bh/2+4,"text-anchor":"end",class:"axlbl",style:"fill:var(--ink);font-weight:600"},s).textContent=m.nm;
    E("text",{x:xe+6,y:y+bh/2+4,class:"axlbl",style:"fill:"+(m.current?"#c1313a":"#6b7684")},s)
      .textContent=m.current?"现任":"";
    const yrs=((m.leave?+new Date(m.leave):t1)-(+new Date(m.start)))/(365.25*864e5);
    r.addEventListener("mousemove",ev=>showTT(
      `<b>${esc(m.nm)}</b> ${m.gender||""}${m.birthyear?" · "+m.birthyear+"年生":""}${m.edu?" · "+m.edu:""}<br>`+
      `任期 ${m.start} ~ ${m.leave||"至今"}（${yrs.toFixed(1)}年）${m.current?" · <span style='color:#ff9b9b'>现任</span>":""}`+
      (m.escrow?`<br>代任: ${esc(m.escrow)} (${m.escrow_start}~${m.escrow_leave||"?"})`:"")+
      (m.resume?`<br><span style="opacity:.7;font-size:11px">${esc(m.resume.slice(0,90))}…</span>`:""),ev));
    r.addEventListener("mouseleave",hideTT);
  });
  return s;
}

/* 雷达图(★2026-07-21新增,经理风格指纹用) —— 统一0~100分位刻度,多边形叠加对比
   axes:[{key,label}]  series:[{name,color,vals:{key:0~100},raw:{key:显示用原始值字符串}}] */
function radarChart(axes,series,{w=300,h=300}={}){
  const s=svg(w,h),cx=w/2,cy=h/2-4,R=Math.min(w,h)/2-48,n=axes.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  [25,50,75,100].forEach(p=>{let d="";
    for(let i=0;i<=n;i++){const a=ang(i%n),r=R*p/100;
      d+=`${i?"L":"M"}${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`;}
    E("path",{d,fill:"none",stroke:"#e4e7ec","stroke-width":1},s);
    if(p<100)E("text",{x:cx+2,y:cy-R*p/100-2,class:"axlbl",style:"font-size:9.5px"},s).textContent=p;});
  axes.forEach((ax,i)=>{const a=ang(i),x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    E("line",{x1:cx,y1:cy,x2:x,y2:y,stroke:"#e4e7ec","stroke-width":1},s);
    const lx=cx+(R+15)*Math.cos(a),ly=cy+(R+15)*Math.sin(a);
    E("text",{x:lx,y:ly+4,"text-anchor":Math.abs(Math.cos(a))<.25?"middle":(Math.cos(a)>0?"start":"end"),
      class:"axlbl",style:"fill:var(--ink);font-weight:600;font-size:11.5px"},s).textContent=ax.label;});
  series.forEach(se=>{let d="";
    axes.forEach((ax,i)=>{const v=se.vals[ax.key],r=(v==null?0:v)/100*R,a=ang(i);
      d+=`${i?"L":"M"}${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`;});
    d+="Z";
    E("path",{d,fill:se.color,opacity:.15,stroke:se.color,"stroke-width":1.8,"stroke-linejoin":"round"},s);
    axes.forEach((ax,i)=>{const v=se.vals[ax.key];if(v==null)return;
      const r=v/100*R,a=ang(i),x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
      const c=E("circle",{cx:x,cy:y,r:3.4,fill:se.color,stroke:"#fff","stroke-width":1.2},s);
      c.addEventListener("mousemove",ev=>showTT(`<span style="color:${se.color}">●</span> <b>${esc(se.name)}</b><br>${esc(ax.label)}：<b>${v.toFixed(0)}分位</b>${se.raw&&se.raw[ax.key]!=null?`（实际值 ${esc(se.raw[ax.key])}）`:""}`,ev));
      c.addEventListener("mouseleave",hideTT);});});
  return s;
}

/* 季报评述情感分析热力条(★2026-07-23新增,替换原"关键词提及次数"折线图)
   4行(信用/利率 × 回顾/展望) × N季度,颜色编码类别标签;数据来自 _sentiment.py 静态人工标注(见m9溯源note) */
const SENT_PAST_COLOR={"牛市":"#0e8a52","震荡":"#c9a227","熊市":"#c0392b"};
const SENT_FUTURE_COLOR={"乐观":"#0e8a52","中性":"#c9a227","悲观":"#c0392b"};
function sentimentGrid(quarterly,{w=680,rowH=26}={}){
  const rows=[
    {key:"credit_past",label:"信用·回顾",map:SENT_PAST_COLOR},
    {key:"rate_past",label:"利率·回顾",map:SENT_PAST_COLOR},
    {key:"credit_future",label:"信用·展望",map:SENT_FUTURE_COLOR},
    {key:"rate_future",label:"利率·展望",map:SENT_FUTURE_COLOR},
  ];
  const pl=76,pr=10,pt=22,pb=6;
  const data=quarterly.filter(r=>r.sentiment);
  const h=pt+rows.length*rowH+pb,s=svg(w,h);
  const n=data.length,cw=(w-pl-pr)/Math.max(n,1);
  const seenYr=new Set();
  data.forEach((r,i)=>{const yr=r.e.slice(0,4);if(seenYr.has(yr))return;seenYr.add(yr);
    const x=pl+i*cw;
    E("text",{x,y:pt-8,"text-anchor":"start",class:"axlbl"},s).textContent=yr;
    E("line",{x1:x,y1:pt-3,x2:x,y2:h-pb,class:"grid"},s);});
  rows.forEach((row,ri)=>{
    const y=pt+ri*rowH;
    E("text",{x:pl-8,y:y+rowH/2+4,"text-anchor":"end",class:"axlbl",style:"fill:var(--ink);font-weight:600;font-size:11px"},s).textContent=row.label;
    data.forEach((r,i)=>{
      const val=r.sentiment[row.key];
      const x=pl+i*cw;
      const col=row.map[val]||"#c3cad2";
      const rc=E("rect",{x:x+.5,y:y+2,width:Math.max(1,cw-1),height:rowH-4,fill:col,opacity:.85,rx:1.5},s);
      rc.style.cursor="pointer";
      rc.addEventListener("mousemove",ev=>showTT(
        `<b>${r.s}~${r.e}</b>　季报<br>${row.label}：<b style="color:${col}">${esc(val)}</b><br><span style="opacity:.8;font-size:11px">${esc(r.sentiment.note)}</span>`,ev));
      rc.addEventListener("mouseleave",hideTT);
    });
  });
  return s;

/* 因子相关性矩阵热力图(超标格高亮) */
function corrMatrix(FCR,{w=660,cell=44}={}){
  const n=F5.length,pl=88,pt=26,s=svg(w,pt+n*cell+8);
  const th=FCR.threshold;
  F5.forEach((f,j)=>E("text",{x:pl+j*cell+cell/2,y:pt-9,"text-anchor":"middle",class:"axlbl"},s)
      .textContent=META.factor_cn[f].replace(/\(.*\)/,""));
  F5.forEach((f1,i)=>{
    E("text",{x:pl-8,y:pt+i*cell+cell/2+4,"text-anchor":"end",class:"axlbl",
              style:"fill:var(--ink)"},s).textContent=META.factor_cn[f1].replace(/\(.*\)/,"");
    F5.forEach((f2,j)=>{
      const v=FCR.matrix[f1][f2], x=pl+j*cell, y=pt+i*cell, diag=(i===j);
      const bad=!diag&&Math.abs(v)>=th;
      // 颜色: 相关性绝对值越大越深; 超标用红框标出
      const a=Math.min(Math.abs(v)/0.5,1);
      const fill=diag?"#eef1f5":(v>=0?`rgba(193,49,58,${0.10+a*0.55})`:`rgba(43,90,160,${0.10+a*0.55})`);
      const r=E("rect",{x:x+2,y:y+2,width:cell-4,height:cell-4,fill,rx:3,
                        stroke:bad?"#c1313a":"#e4e7ec","stroke-width":bad?2.2:1},s);
      E("text",{x:x+cell/2,y:y+cell/2+4,"text-anchor":"middle",class:"axlbl",
                style:`fill:${a>.55?"#fff":"var(--ink)"};font-weight:${bad?700:500}`},s)
        .textContent=diag?"1":(+v).toFixed(2);
      if(bad) E("text",{x:x+cell-7,y:y+13,"text-anchor":"middle",style:"font-size:10px"},s).textContent="⚠";
      if(!diag){
        r.addEventListener("mousemove",ev=>showTT(
          `${META.factor_cn[f1]} ~ ${META.factor_cn[f2]}<br>相关性 = <b>${(+v).toFixed(3)}</b><br>`+
          (bad?`<span style="color:#ff9b9b">⚠ 超出阈值 ${th}，两因子不够独立</span>`:`✅ 达标 (|corr| &lt; ${th})`),ev));
        r.addEventListener("mouseleave",hideTT);
      }
    });
  });
  return s;
}

/* 瀑布(贡献分解) */
function waterfall(c,{w=660,h=240}={}){
  const s=svg(w,h),pl=20,pr=16,pt=14,pb=40;
  const comps=[["利率",c.level,FC.level],["斜率",c.slope,FC.slope],["凸度",c.curve,FC.curve],
    ["信用",c.credit,FC.credit],["违约",c.default,FC.default],["Alpha",c.alpha,"#7f8c8d"],["残差",c.resid,"#c3cad2"]];
  let cum=0;const steps=[];
  comps.forEach(x=>{const v=x[1]||0;steps.push({n:x[0],v,col:x[2],f:cum,t:cum+v});cum+=v;});
  steps.push({n:"合计",v:c.total,col:"#2c3e50",f:0,t:c.total,tot:1});
  const all=steps.flatMap(x=>[x.f,x.t]).concat(0);
  let y0=Math.min(...all),y1=Math.max(...all);const pv=(y1-y0)||.02;y0-=pv*.12;y1+=pv*.12;
  const bw=(w-pl-pr)/steps.length,Y=sc(y0,y1,h-pb,pt);
  ticks(y0,y1,5).forEach(t=>{E("line",{x1:pl,y1:Y(t),x2:w-pr,y2:Y(t),class:"grid"},s);
    E("text",{x:pl,y:Y(t)-2,class:"axlbl"},s).textContent=(t*100).toFixed(1)+"%";});
  E("line",{x1:pl,y1:Y(0),x2:w-pr,y2:Y(0),class:"zero"},s);
  steps.forEach((st,i)=>{const x=pl+i*bw+bw*.18,bwi=bw*.64;
    const yt=Y(Math.max(st.f,st.t)),yb=Y(Math.min(st.f,st.t));
    const r=E("rect",{x,y:yt,width:bwi,height:Math.max(1,yb-yt),fill:st.col,rx:2,opacity:st.tot?1:.9},s);
    E("text",{x:x+bwi/2,y:h-pb+15,"text-anchor":"middle",class:"axlbl"},s).textContent=st.n;
    E("text",{x:x+bwi/2,y:st.v>=0?yt-3:yb+11,"text-anchor":"middle",class:"axlbl",style:"fill:var(--ink)"},s).textContent=(st.v*100).toFixed(2);
    r.addEventListener("mousemove",ev=>showTT(`${st.n} 贡献<br><b>${pctS(st.v)}</b>/年`,ev));
    r.addEventListener("mouseleave",hideTT);});
  return s;
}

/* 分位定位条 */
function distStrip(label,q,val,pctl,{w=660,h=30,color="#4E79A7",unit=""}={}){
  const s=svg(w,h),pl=80,pr=52,cy=h/2;
  if(q.p25==null||val==null)return s;
  const lo=Math.min(q.p25,val),hi=Math.max(q.p75,val),pad=(hi-lo)*.35||.1;
  const X=sc(lo-pad,hi+pad,pl,w-pr);
  E("text",{x:pl-8,y:cy+4,"text-anchor":"end",class:"axlbl",style:"font-size:11.5px;fill:var(--ink)"},s).textContent=label;
  E("rect",{x:X(q.p25),y:cy-6,width:Math.max(1,X(q.p75)-X(q.p25)),height:12,fill:color,opacity:.22,rx:2},s);
  E("line",{x1:X(q.p50),y1:cy-7,x2:X(q.p50),y2:cy+7,stroke:color,"stroke-width":2},s);
  const m=E("circle",{cx:X(val),cy,r:5.5,fill:color,stroke:"#fff","stroke-width":1.5},s);
  E("text",{x:w-pr+6,y:cy+4,class:"axlbl",style:"fill:var(--ink);font-weight:600"},s).textContent=pctl!=null?Math.round(pctl*100)+"分位":"";
  m.addEventListener("mousemove",ev=>showTT(`${label}<br>本基金 <b>${num(val)}${unit}</b> · ${pctl!=null?Math.round(pctl*100)+"分位":""}<br><span style="opacity:.7">同类 p25/p50/p75 = ${num(q.p25)}/${num(q.p50)}/${num(q.p75)}</span>`,ev));
  m.addEventListener("mouseleave",hideTT);
  return s;
}

  b9.insertAdjacentHTML("beforeend",`<div class="mini" style="margin:8px 0 4px">季报评述情感分析（信用债/利率债 各自的过去回顾 + 未来展望，逐季，悬停查看判断依据）</div>`);
  b9.appendChild(sentimentGrid(CM.quarterly));
  b9.appendChild(legend([["牛市/乐观","#0e8a52"],["震荡/中性","#c9a227"],["熊市/悲观","#c0392b"]]));
  b9.insertAdjacentHTML("beforeend",`<div class="gapbox" style="margin-top:8px">

  b9.appendChild(note("把这4行和 ④ 风格漂移对照：经理判断「利率债牛市」的季度，持仓是否真的在加久期/加利率债？"));

  // — 最近季报评述 —
  b9.insertAdjacentHTML("beforeend",`<div class="mini" style="margin:12px 0 4px">最近季报评述（原文摘录）</div>`);
  const box=document.createElement("div");box.className="cmt";
  CM.quarterly.slice(-6).reverse().forEach(r=>{
    const kw=Object.entries(r.kw).filter(([,v])=>v>0).map(([k,v])=>`<span class="kwchip">${k}×${v}</span>`).join("");
    box.innerHTML+=`<div class="it"><div class="dt">${r.s} ~ ${r.e}　<span style="color:#6b7684;font-weight:400">季报 · 披露于 ${r.iss} · ${r.n}字</span></div>
      <div style="margin:3px 0">${kw}</div><div style="color:#42505f">${esc(r.txt.slice(0,320))}…</div></div>`;});

  // — 年报/半年报(可展开) —
  if(CM.annual.length){
    const det=document.createElement("details");det.style.marginTop="10px";
    det.innerHTML=`<summary style="cursor:pointer;color:var(--accent);font-size:12.5px">▸ 展开半年报/年报评述（${CM.annual.length}条，不进曲线）</summary>`;
    const abox=document.createElement("div");abox.className="cmt";abox.style.marginTop="6px";
    CM.annual.slice().reverse().forEach(r=>{
      const kw=Object.entries(r.kw).filter(([,v])=>v>0).map(([k,v])=>`<span class="kwchip">${k}×${v}</span>`).join("");
      abox.innerHTML+=`<div class="it"><div class="dt">${r.s} ~ ${r.e}　<span style="color:#6b7684;font-weight:400">${r.rtype} · 披露于 ${r.iss} · ${r.n}字</span></div>
        <div style="margin:3px 0">${kw}</div><div style="color:#42505f">${esc(r.txt.slice(0,320))}…</div></div>`;});
    det.appendChild(abox);b9.appendChild(det);
  }
  app.appendChild(c9);

  /* ===== m20 经理风格指纹(★2026-07-21新增:经理换人前后风格变没变) ===== */
  const MS=FUND.mgr_study;
  const cMS=card("m20","㉑ 历任经理风格指纹","任期精确分段(scan-line算法) · 雷达=历任独任经理内部分位0~100%");
  const bMS=bd(cMS);
  bMS.insertAdjacentHTML("beforeend",`<div class="note" style="margin-bottom:8px">
    用起止日边界扫描线算法精确切分出 <b>${MS.n_segments}</b> 段任期（含共管期，避免肉眼数漏重叠）；
    把同一人的多段独任任期合并后，共 <b>${MS.n_managers}</b> 位独任经理进入下方对比。
    共管/代管期单独列一行，<b>不并入</b>任何个人的统计（避免把搭档的业绩记到自己头上）。</div>`);
  if(MS.sensitive.length){
    bMS.insertAdjacentHTML("beforeend",`<div class="err" style="margin-bottom:10px">
      ⚠ <b>发现敏感任职事件</b>（源自 <code>S_INFO_MANAGER_POST</code> 字段的关键词匹配）：<br>
      ${MS.sensitive.map(sv=>`<b>${esc(sv.nm)}</b>　${sv.s} ~ ${sv.e}　${esc(sv.note)}`).join("<br>")}</div>`);
  }
  let tms=`<table class="t"><thead><tr><th>经理</th><th>身份</th><th>起</th><th>止</th><th>天数</th>
    <th>年化</th><th>夏普</th><th>回撤</th><th>久期</th><th>杠杆</th>
    <th>利率β</th><th>斜率β</th><th>凸度β</th><th>信用β</th><th>违约β</th><th>R²</th></tr></thead><tbody>`;
  MS.summary.forEach(r=>{
    const dim=!r.enough?' style="opacity:.5"':"";
    tms+=`<tr${dim} title="${!r.enough?'样本不足(风格季度点<2 或 滚动β点<5)，仅供时间轴参考':''}">
      <td><b>${esc(r.nm)}</b></td><td>${r.kind}${!r.enough?" ⚠":""}</td><td>${r.s}</td><td>${r.e}</td><td>${r.days}</td>
      <td>${pctS(r.ann)}</td><td>${num(r.sharpe)}</td><td>${pctS(r.mdd)}</td><td>${num(r.dur)}</td><td>${num(r.lev,2)}</td>
      <td>${num(r.level,3)}</td><td>${num(r.slope,3)}</td><td>${num(r.curve,3)}</td><td>${num(r.credit,3)}</td><td>${num(r.default,3)}</td><td>${num(r.r2,3)}</td></tr>`;});
  tms+="</tbody></table>";
  const tmsWrap=document.createElement("div");tmsWrap.style.overflowX="auto";tmsWrap.innerHTML=tms;
  bMS.appendChild(tmsWrap);
  bMS.appendChild(note("⚠标记 / 灰底行 = 样本不足(风格季度点&lt;2 或 滚动β点&lt;5)，只作时间轴参考、不进下方雷达图排名。"));

  const rg=document.createElement("div");rg.className="grid2";rg.style.marginTop="14px";
  const raBox=document.createElement("div");
  raBox.insertAdjacentHTML("beforeend",`<div class="mini" style="margin-bottom:4px">雷达A · 业绩结果（历任经理内部分位）</div>`);
  raBox.appendChild(radarChart(
    [{key:"ann_pct",label:"年化收益"},{key:"sharpe_pct",label:"夏普比率"},{key:"mdd_pct",label:"回撤控制"}],
    MS.radar_a.map((r,i)=>({name:r.nm,color:MPAL[i%MPAL.length],
      vals:{ann_pct:r.ann_pct,sharpe_pct:r.sharpe_pct,mdd_pct:r.mdd_pct},
      raw:{ann_pct:pctS(r.ann),sharpe_pct:num(r.sharpe),mdd_pct:pctS(r.mdd)}}))));
  raBox.appendChild(legend(MS.radar_a.map((r,i)=>[r.nm,MPAL[i%MPAL.length]])));
  const rbBox=document.createElement("div");
  rbBox.insertAdjacentHTML("beforeend",`<div class="mini" style="margin-bottom:4px">雷达B · 因子风格（5因子β + R²，历任经理内部分位）</div>`);
  rbBox.appendChild(radarChart(
    [{key:"level_pct",label:"利率"},{key:"slope_pct",label:"斜率"},{key:"curve_pct",label:"凸度"},
     {key:"credit_pct",label:"信用"},{key:"default_pct",label:"违约"},{key:"r2_pct",label:"R²"}],
    MS.radar_b.map((r,i)=>({name:r.nm,color:MPAL[i%MPAL.length],
      vals:{level_pct:r.level_pct,slope_pct:r.slope_pct,curve_pct:r.curve_pct,credit_pct:r.credit_pct,default_pct:r.default_pct,r2_pct:r.r2_pct},
      raw:{level_pct:num(r.level,3),slope_pct:num(r.slope,3),curve_pct:num(r.curve,3),credit_pct:num(r.credit,3),default_pct:num(r.default,3),r2_pct:num(r.r2,3)}}))));
  rbBox.appendChild(legend(MS.radar_b.map((r,i)=>[r.nm,MPAL[i%MPAL.length]])));
  rbBox.appendChild(note("⚠ R²不是与5个β并列的第6个风格方向，而是这5个β<b>整体</b>解释力的高低——放在同一雷达图上只是为了一屏对比，解读时请与其余5角分开看。"));
  rg.appendChild(raBox);rg.appendChild(rbBox);
  bMS.appendChild(rg);
  app.appendChild(cMS);

  /* ===== 数据缺口汇总 ===== */
  const cg=document.createElement("div");cg.className="card";
  cg.innerHTML=`<div class="hd"><h3>⚠️ 数据缺口汇总 · 哪些需求做不了</h3><span class="tag">需求文档第四节</span></div><div class="bd"></div>`;
  let gh=`<div class="gapbox">`;
  META.gaps.forEach(g=>gh+=`<div style="margin-bottom:6px">· <b>${esc(g.k)}</b> — ${esc(g.v)}</div>`);
  gh+=`</div>`;cg.querySelector(".bd").innerHTML=gh;app.appendChild(cg);

  regroup(cg);   // ★把线性卡片按大类重组 + 重新编号(见 GROUP_PLAN)
}

/* ★大类分组方案:照飞书《一只基金的详细研究所需数据库》标题层级
   keys=卡片标题里的唯一子串(用于定位),span2=占满整行的宽卡 */
const GROUP_PLAN=[
  {title:"二、基金市场表现", sub:"净值/业绩/风险/费率/vs基准",
   keys:["业绩与风险","净值走势","滚动业绩","同类业绩分位","A/C 份额对比","业绩比较基准"]},
  {title:"三、基金持仓穿透", sub:"券种结构/杠杆/vs同类/逐券明细(季度频)",
   keys:["风格漂移","杠杆演变","持仓结构 vs 同类","逐券持仓明细"]},
  {title:"四、多因子模型分析框架", sub:"数学构造(含正交化) → 选定窗口:暴露与贡献分解 → 全历史:暴露时间演变(本基金vs全市场) → 久期(两种独立方法对照)",
   keys:["五因子数学构造","五因子暴露","收益贡献分解","因子暴露时间演变","久期时间序列","月度久期测算"]},
  {title:"五、基金运营情况", sub:"收益来源结构 + 回购融资/借钱规模(损益表+资产负债表·半年频)",
   keys:["收益来源结构","回购融资"]},
  {title:"六、基金的市场热度", sub:"规模/申赎/聪明钱FOF/全市场相关性",
   keys:["规模演变","申赎压力","聪明钱因子","全市场净值相关性"]},
  {title:"七、基金经理研究", sub:"任期 + 定期报告评述(说vs做) / 经理换人前后风格变没变(★2026-07-21新增)",
   keys:["基金经理评述","历任经理风格指纹"]},
];
/* ★2026-07-21修复:半宽卡若与相邻卡纵横比不同/落单,同排会出现"图表大小不一/留白缺口"
   (领导汇报反馈)——原则:凡不能与紧邻同宽度、同纵横比的图表卡配对的,一律改 span2 占满整行。
   规模演变+申赎压力(同h/w)、滚动因子暴露+收益贡献分解(已统一h/w见下方图表调用)、基础知识+费率清单(纯表格)
   三对配对天然登对,保留半宽并排;其余全部拉满整行,不再让不同纵横比的图表挤在同一行。*/
const GROUP_SPAN2=new Set(["业绩与风险","净值走势","滚动业绩","同类业绩分位","A/C 份额对比","业绩比较基准",
  "风格漂移","杠杆演变","持仓结构 vs 同类","五因子数学构造","五因子暴露","收益贡献分解","因子暴露时间演变","久期时间序列","月度久期测算",
  "收益来源结构","回购融资","聪明钱因子","全市场净值相关性","基金经理评述","历任经理风格指纹","逐券持仓明细"]);
// ★2026-07-22修复: 原来只到㉑(21个),且重新编号的正则只认①-⑳ —— 導致㉑及以上的卡片(历任经理风格指纹/基础知识/费率清单等)
//   永远不会被regroup()动态改号,只要前面分组的卡片数量一变(如本次因子模块合并少了1张),这几张后面的卡片编号就会错位。
//   修复:编号池扩到㉟(35个,留足余量),正则同步扩到①-㉟,让全部卡片都吃到自动重新编号,不再需要手工对齐。
const CIRCLED="①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟".split("");

function regroup(gapCard){
  const app=document.getElementById("app");
  const fundhead=app.querySelector(".fundhead");
  const frag=document.createDocumentFragment();
  let n=0;
  GROUP_PLAN.forEach(g=>{
    const sec=document.createElement("div");sec.className="grpsec";
    const grid=document.createElement("div");grid.className="grpgrid";sec.appendChild(grid);
    g.keys.forEach(key=>{
      const card=[...app.querySelectorAll(".card")].find(c=>{
        const h=c.querySelector(".hd h3");
        return h && h.textContent.includes(key) && !c.dataset.grouped;});
      if(!card)return;
      card.dataset.grouped="1";
      const h=card.querySelector(".hd h3");
      h.innerHTML=h.innerHTML.replace(/^\s*[①-⑳㉑-㉟]\s*/, CIRCLED[n]+" ");   // 重新编号(①-㉟全覆盖,见上方CIRCLED注释)
      n++;
      if(GROUP_SPAN2.has(key))card.classList.add("span2");
      grid.appendChild(card);   // appendChild 会自动把卡片从原位置(含g7/g34包裹)移出
    });
    if(grid.children.length){
      grpToggleHeader(sec,g.title,g.sub,grid.children.length);   // ★2026-07-24新增:大纲视图折叠标题条
      frag.appendChild(sec);
    }
  });
  // 清掉被搬空的旧包裹层(g7/g34 等 grid2),但保留 fundhead 与 数据缺口卡
  [...app.children].forEach(ch=>{
    if(ch!==fundhead && ch!==gapCard && !ch.classList.contains("grpsec")
       && ch.querySelectorAll(".card").length===0) ch.remove();});
  app.insertBefore(frag, gapCard);   // 分组区整体插到"数据缺口"卡之前、fundhead之后
}
