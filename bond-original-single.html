<style>
:root{
  --bg:#eef1f5; --panel:#fff; --ink:#1a2230; --muted:#69758a; --line:#e2e6ec; --line2:#eef1f5;

  --f-level:#4E79A7; --f-slope:#F28E2B; --f-curve:#59A14F; --f-credit:#B07AA1; --f-default:#E15759;
  --gov:#4E79A7; --fin:#59A14F; --corp:#F28E2B; --cb:#B07AA1; --other:#9aa4b0;
  --shadow:0 1px 3px rgba(20,30,45,.07),0 1px 2px rgba(20,30,45,.04);
  --shadow-lg:0 10px 26px rgba(15,25,45,.11),0 2px 6px rgba(15,25,45,.06);
  --navy1:#0a1120; --navy2:#122844; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei","PingFang SC",sans-serif;
 background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650}
.wrap{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
header.top{position:relative;overflow:hidden;border-radius:14px;color:#eef2f7;
  background:linear-gradient(120deg,var(--navy1) 0%,var(--navy2) 55%,#1a3a5c 100%);
  padding:22px 26px 20px;margin-bottom:18px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.06)}
header.top::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 12% 15%,rgba(0,0,0,.9),transparent 72%);
  mask-image:radial-gradient(ellipse at 12% 15%,rgba(0,0,0,.9),transparent 72%)}
header.top::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(194,0,0,.38),transparent 70%);filter:blur(6px);pointer-events:none}
header.top h1{font-size:21px;letter-spacing:.6px;position:relative;color:#fff}
header.top h1::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px 2px rgba(194,0,0,.75);margin-right:9px;vertical-align:2px}
header.top .sub{color:#a9b6c9;font-size:12.5px;margin-top:5px;position:relative;letter-spacing:.2px}
.metastrip{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:12px;position:relative}
.metastrip .m{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:20px;
  padding:3px 11px;font-size:11.5px;color:#c3cddb}
.metastrip .m b{color:#fff;font-weight:650}
.fundhead{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 18px 16px 21px;position:relative;overflow:hidden}
.fundhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--accent),var(--accent2))}
.fundhead h2{font-size:19px}
.fundhead .code{color:var(--muted);font-size:13px;font-weight:500;margin-left:6px}
.kv{display:flex;flex-wrap:wrap;gap:5px 18px;color:#4a5563;font-size:12.5px;margin-top:6px}
.kv b{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:16px;position:relative;overflow:hidden;transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow-lg)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--accent2),var(--accent) 65%,transparent)}
.card .hd{padding:13px 16px 11px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .hd h3{font-size:14.5px;letter-spacing:.2px}
.card .hd .tag{font-size:11.5px;color:var(--muted);font-weight:500}
.card .bd{padding:15px 16px}
.mini{font-size:11.5px;color:var(--muted)}
/* ★ 数据统计时间频率标注(用户2026-07-17长期要求:凡画图模块必须标注数据点的时间频率) */
.freqrow{padding:0 16px 6px}
.freqbadge{display:inline-block;font-size:11px;font-weight:600;color:#8a5a10;background:#fdf3e0;border:1px solid #f0dfae;border-radius:20px;padding:2px 10px}
/* ★ 数据溯源 */
.prov{border-top:1px dashed var(--line);background:#fafbfc;padding:9px 14px;font-size:11px;color:#5a6673;line-height:1.7;border-radius:0 0 10px 10px}
.prov .t{font-weight:700;color:#42505f}
.prov code{background:#eef1f5;padding:1px 5px;border-radius:3px;font-size:10.5px;color:#33475b}
.prov .path{color:#7a8694;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;word-break:break-all}
.prov .note{color:#8a6a1e;background:#fdf7ec;border-radius:4px;padding:2px 6px;display:inline-block;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
/* ★大类分组(照飞书《一只基金的详细研究所需数据库》标题层级) */
.grpsec{margin:32px 0 0}
.grphd{display:flex;align-items:baseline;gap:12px;position:relative;border-radius:9px;
  padding:10px 16px 10px 18px;margin-bottom:16px;box-shadow:var(--shadow);cursor:pointer;user-select:none;
  background:linear-gradient(90deg,var(--navy1),var(--navy2) 60%,rgba(19,40,68,.05))}
.grphd:hover{filter:brightness(1.08)}
.grphd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:9px 0 0 9px;
  background:linear-gradient(180deg,var(--accent),var(--accent2))}
.grphd .chev{font-size:12px;color:#cfe0f0;transition:transform .15s;display:inline-block}
.grphd .gt{font-size:16.5px;font-weight:700;color:#fff;letter-spacing:.5px}
.grphd .gs{font-size:12px;color:#9fb0c6}
.grphd .cnt{font-size:11.5px;color:#cfe0f0;margin-left:auto;background:rgba(255,255,255,.12);
  border-radius:20px;padding:2px 10px;white-space:nowrap}
/* ★2026-07-24新增:大纲视图折叠——点击分组标题条收纳/展开整个分组,方便一次看完所有模块数量 */
.grpsec.collapsed .chev{transform:rotate(-90deg)}
.grpsec.collapsed>*:not(.grphd){display:none}
.grpsec.collapsed .grphd{margin-bottom:8px}
.grpgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grpgrid .span2{grid-column:1 / -1}
@media(max-width:1000px){.grpgrid{grid-template-columns:1fr}.grpgrid .span2{grid-column:auto}}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:#fafbfd;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;
  padding:9px 11px;transition:border-color .12s}
.metric:hover{border-left-color:var(--accent2)}
.metric .lb{font-size:11.5px;color:var(--muted)}
.metric .vl{font-size:19.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:.2px;
  font-family:ui-monospace,"SF Mono",Consolas,Menlo,monospace}
.metric .vl.pos{color:var(--good)} .metric .vl.neg{color:var(--bad)}
.wtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.wtab{padding:5px 14px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;cursor:pointer;
  background:#fbfcfd;user-select:none;color:#4a5563;font-weight:500;transition:all .12s}
.wtab:hover{border-color:var(--accent2);color:var(--accent2)}
.wtab.on{background:linear-gradient(135deg,var(--accent2),#0b3f6b);color:#fff;border-color:transparent;
  box-shadow:0 2px 8px rgba(10,111,176,.35);font-weight:650}
.segrow{display:flex;gap:6px;flex-wrap:wrap}
.seg{padding:5px 13px;border:1px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;
  background:#fbfcfd;color:#4a5563;font-weight:500;user-select:none;transition:all .12s}
.seg:hover{border-color:var(--accent);color:var(--accent)}
.seg.on{background:linear-gradient(135deg,var(--accent),#8a0000);color:#fff;border-color:transparent;
  box-shadow:0 2px 8px rgba(194,0,0,.3);font-weight:650}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:#42505f;margin-top:6px}
.legend .lg{display:flex;align-items:center;gap:5px}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
.grid{stroke:#eef1f4;stroke-width:1} .axis{stroke:#c9d0d8;stroke-width:1}
.axlbl{fill:var(--muted);font-size:10.5px} .zero{stroke:#9aa4b0;stroke-width:1;stroke-dasharray:3 3}
.tt{position:fixed;pointer-events:none;background:#1c2530;color:#fff;font-size:11.5px;padding:5px 8px;border-radius:5px;z-index:99;opacity:0;transition:opacity .08s;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.err{background:#fff3f3;border:1px solid #f3c9c9;color:#a3242a;padding:14px 16px;border-radius:8px;font-size:13px;line-height:1.6}
.okbox{background:#eaf7f0;border:1px solid #bfe3ce;border-radius:8px;padding:12px 14px;color:#1d6b45;font-size:12.5px;line-height:1.7}
.okbox b{color:#12603a}
.t td.pos{color:var(--good);font-weight:600}
.gapbox{background:#fdf7ec;border:1px solid #f0e0c0;border-radius:8px;padding:12px 14px;color:#7a5a1e;font-size:12.5px;line-height:1.7}
.gapbox b{color:#8a5a10}
.formula{background:#f4f6fa;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;
  font-family:ui-monospace,Consolas,"SF Mono",Menlo,monospace;font-size:12.5px;line-height:1.85;color:#1c2530;overflow-x:auto;white-space:pre}
.formula .lbl{color:#6b7684;font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;font-size:11.5px}
.ftable{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
.ftable th,.ftable td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top}
.ftable th{color:var(--muted);font-weight:600;background:#fafbfc}
.ftable code{font-size:11px}
table.t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:5px 7px;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600;background:#fafbfc}
.pctrow{display:grid;grid-template-columns:84px 1fr 54px;align-items:center;gap:10px;margin:8px 0;font-size:12.5px}
.pcttrack{height:9px;border-radius:6px;background:linear-gradient(90deg,#f0d9d9,#f3ede0,#d9ece2);position:relative}
.pctmark{position:absolute;top:-3px;width:3px;height:15px;background:var(--ink);border-radius:2px}
.pctval{text-align:right;font-variant-numeric:tabular-nums;color:#42505f}
.cmt{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafbfc;font-size:12.5px;line-height:1.75}
.cmt .it{padding:8px 0;border-bottom:1px solid var(--line2)}
.cmt .it:last-child{border:0}
.cmt .dt{font-weight:700;color:var(--blue);font-size:12px}
.kwchip{display:inline-block;background:#eef2f7;border:1px solid #e0e6ee;border-radius:10px;padding:0 7px;font-size:11px;margin:0 3px 0 0;color:#33475b}
footer{margin-top:24px;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.8}
</style>
